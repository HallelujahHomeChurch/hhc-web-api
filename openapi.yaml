  /member/recordings/{id}/live/{captureId}/cover:
    get:
      operationId: getMemberLiveCover
      summary: Read the current visible live thumbnail without creating a playback grant
      description: >-
        Supports legacy live captures and B1 broadcasts through the exact bound capture.
        B1 requires an announced, unrevoked broadcast in live or end_pending phase and
        an available, unstopped, unexpired capture. Eligibility and selected cover identity
        are rechecked after Asset I/O. Automatic and custom covers reuse broadcast ownership;
        this does not enable legacy capture-scoped administrator writes.
        Member live list, search and watch.live expose the same ready coverRevision.
        B1 coverRevision comes from the readable broadcast cover snapshot, not pending capture readiness.
      tags: [Authenticated]
      x-hhc-visibility: authenticated
      x-hhc-callers: [api-gateway]
      x-hhc-cache: private, no-store
      security: [{ daprApiToken: [], daprCallerAppId: [], trustedUserId: [], trustedAuthProvider: [], trustedScopes: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: captureId, in: path, required: true, schema: { type: string, pattern: '^[a-f0-9]{32}$' } }
      responses:
        '200': { description: Bounded private JPEG with nosniff; membership and current legal entitlement required, content: { image/jpeg: { schema: { type: string, format: binary } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/AdminUnauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '404': { $ref: '#/components/responses/Error' }
