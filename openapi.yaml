          items: { $ref: '#/components/schemas/OnlineBulletinBlock' }
        worship:
          type: array
          minItems: 1
          maxItems: 256
          items: { $ref: '#/components/schemas/OnlineBulletinItem' }
        work:
          type: array
          minItems: 1
          maxItems: 256
          items: { $ref: '#/components/schemas/OnlineBulletinItem' }
        wordQuestions:
          type: array
          minItems: 1
          maxItems: 256
          items: { $ref: '#/components/schemas/OnlineBulletinItem' }
        weeklyVerses:
          type: array
          minItems: 1
          maxItems: 4096
