      servers: [{ url: https://admin.alive.org.tw/api }]
      x-required-scopes: [cms:bulletins:write]
      parameters:
        - { $ref: '#/components/parameters/IssueID' }
        - { name: series, in: path, required: true, schema: { type: string, enum: [general] } }
        - { name: contentLocale, in: path, required: true, schema: { type: string, enum: [zh-Hant] } }
        - { name: If-Match, in: header, required: true, schema: { type: string, pattern: '^"(0|[1-9][0-9]*)"$' } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OnlineBulletinExtractionInput' }
      responses:
        '200':
          description: Existing completed or failed job, not automatically retried
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OnlineBulletinQueuedExtractionEnvelope' }
        '202':
          description: Extraction queued or already running; read state for progress
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OnlineBulletinQueuedExtractionEnvelope' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/AdminUnauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '404': { $ref: '#/components/responses/Error' }
        '409':
          description: Version conflict includes meta.currentVersion and meta.canonicalVersion; other conflicts reject retrying an active or immutable job
