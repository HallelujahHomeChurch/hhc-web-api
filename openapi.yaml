    SiteDisplayFields:
      type: object
      required: [locale, siteName, englishName, copyrightHolder, allRightsReserved, seoTitleSuffix, seoDescriptionFallback]
      properties:
        locale: { $ref: '#/components/schemas/ContentLocale' }
        siteName: { type: string, minLength: 1 }
        englishName: { type: string, minLength: 1 }
        copyrightHolder: { type: string, minLength: 1 }
        allRightsReserved: { type: string, minLength: 1 }
        seoTitleSuffix: { type: string, minLength: 1 }
        seoDescriptionFallback: { type: string, minLength: 1 }
    SiteLocaleSettings:
      allOf:
        - $ref: '#/components/schemas/SiteDisplayFields'
        - type: object
          required: [header, legal]
          properties:
            header:
              type: array
              minItems: 3
              maxItems: 3
              items: { $ref: '#/components/schemas/AdminSiteHeaderNavigationItem' }
            legal:
              type: array
              minItems: 2
              maxItems: 2
              items: { $ref: '#/components/schemas/AdminSiteLegalNavigationItem' }
      unevaluatedProperties: false
    SiteLayout:
      allOf:
        - $ref: '#/components/schemas/SiteDisplayFields'
        - type: object
          required: [header, legal, links, version, publishedAt]
          properties:
            header:
              type: array
              minItems: 3
              maxItems: 3
              items: { $ref: '#/components/schemas/PublicSiteHeaderNavigationItem' }
            legal:
              type: array
              minItems: 2
              maxItems: 2
              items: { $ref: '#/components/schemas/PublicSiteLegalNavigationItem' }
            links: { $ref: '#/components/schemas/SiteExternalLinks' }
            version: { type: integer, format: int64, minimum: 1 }
            publishedAt: { type: string, format: date-time }
      unevaluatedProperties: false
    SiteSettingsWriteFields:
      type: object
      required: [locales, links]
      properties:
        locales:
          type: array
          minItems: 5
          maxItems: 5
          items: { $ref: '#/components/schemas/SiteLocaleSettings' }
        links: { $ref: '#/components/schemas/SiteExternalLinks' }
    SiteSettingsWriteInput:
      allOf:
        - $ref: '#/components/schemas/SiteSettingsWriteFields'
      unevaluatedProperties: false
    SiteSettings:
      allOf:
        - $ref: '#/components/schemas/SiteSettingsWriteFields'
        - type: object
          required: [id, status, version, createdBy, updatedBy, createdAt, updatedAt]
          properties:
            id: { type: string, const: default }
            status: { type: string, enum: [draft, published, unpublished] }
            version: { type: integer, format: int64, minimum: 1 }
            createdBy: { type: string }
            updatedBy: { type: string }
            publishedBy: { type: string }
            publishedAt: { type: string, format: date-time }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
      unevaluatedProperties: false
    SiteSettingsRevision:
      type: object
      additionalProperties: false
      required: [revision, revisionType, snapshot, createdBy, createdAt]
      properties:
        revision: { type: integer, format: int64, minimum: 1 }
        revisionType: { type: string, enum: [draft_saved, published, unpublished, seeded, restored_to_draft] }
        snapshot: { $ref: '#/components/schemas/SiteSettings' }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
