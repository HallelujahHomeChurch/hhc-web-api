        '409':
          description: State/key conflict or missing objects; poll and reconcile before retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingCaptureErrorEnvelope'
        '410':
          description: Fixed capture deadline passed; preserve local media.
