        playbackScopeId:
          type: string
          format: uuid
        mediaUrl:
          type: string
          format: uri
          description: Allowlisted media origin, exact /videos/{recordingId}/captures/{captureId}/sessions/{playbackScopeId}/master.m3u8
            path.
        exchangeCredential:
          type: string
          minLength: 1
          description: Short-lived exchange credential; never log, persist, or place in URL.
        issuedAt:
          type: string
          format: date-time
          description: UTC RFC3339 timestamp emitted with Z suffix.
        expiresAt:
          type: string
          format: date-time
          description: UTC RFC3339 timestamp emitted with Z suffix.
        serverNow:
          type: string
          format: date-time
          description: UTC RFC3339 timestamp emitted with Z suffix.
        captureExpiresAt:
          type: string
          format: date-time
          description: UTC RFC3339 timestamp emitted with Z suffix.
        stopAcceptedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: UTC RFC3339 timestamp emitted with Z suffix.
        replayUntil:
          type:
          - string
          - 'null'
          format: date-time
          description: UTC RFC3339 timestamp emitted with Z suffix.
        terminalReason:
          type:
          - string
          - 'null'
        liveState:
          type: string
          enum:
          - starting
          - live
          - recovering
          - interrupted
          - ending
          - ended
          - failed
          - expired
          - aborted
        progress:
          $ref: '#/components/schemas/RecordingLiveProgress'
        watermarkCode:
          type: string
          minLength: 1
          description: Reuse the existing member watermark policy; withhold credentials when required trace persistence fails.
    MemberLiveRecording:
      type: object
      additionalProperties: false
      required:
      - id
      - captureId
      - title
      - liveState
      - createdAt
      - stopAcceptedAt
      - progress
      properties:
        coverMode: {type: string, enum: [auto, custom], description: Selected cover mode even when the selected image is pending.}
        publicId: { type: string, pattern: '^[A-Za-z0-9_-]{11}$' }
        startedAt: {type: string, format: date-time}
        coverRevision: { type: string, maxLength: 128, description: Immutable active image identity; changes only after a ready image becomes effective. }
        id:
          type: string
          format: uuid
        captureId:
          type: string
          pattern: ^[a-f0-9]{32}$
        title:
          type: string
          maxLength: 180
        description: {$ref: '#/components/schemas/RecordingDescription'}
        liveState:
          type: string
          enum:
          - starting
          - live
          - recovering
          - interrupted
          - ending
          - ended
          - failed
          - expired
          - aborted
        createdAt:
          type: string
          format: date-time
          description: UTC RFC3339 timestamp emitted with Z suffix.
        stopAcceptedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: UTC RFC3339 timestamp emitted with Z suffix.
        progress:
          $ref: '#/components/schemas/RecordingLiveProgress'
    RecordingCaptureEnvelope:
      type: object
      additionalProperties: false
      required:
      - data
      - meta
      - error
      properties:
        data:
          $ref: '#/components/schemas/RecordingCaptureStatus'
        meta:
          type: object
          additionalProperties: true
        error:
          type: 'null'
    RecordingCaptureResultEnvelope:
      type: object
      additionalProperties: false
      required:
      - data
      - meta
      - error
      properties:
        data:
          $ref: '#/components/schemas/RecordingCaptureResult'
        meta:
          type: object
          additionalProperties: true
        error:
          type: 'null'
    RecordingCaptureSignedEnvelope:
      type: object
      additionalProperties: false
      required:
      - data
      - meta
      - error
      properties:
        data:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/SignedRecordingObject'
        meta:
          type: object
          additionalProperties: true
        error:
          type: 'null'
    MemberLivePlaybackEnvelope:
      type: object
      additionalProperties: false
      required:
      - data
      - meta
      - error
      properties:
        data:
          $ref: '#/components/schemas/MemberLivePlayback'
        meta:
          type: object
          additionalProperties: true
        error:
          type: 'null'
    MemberLiveRecordingsEnvelope:
      type: object
      additionalProperties: false
      required:
      - data
      - meta
      - error
      properties:
        data:
          type: array
          minItems: 0
          maxItems: 1
          items:
            $ref: '#/components/schemas/MemberLiveRecording'
        meta:
          type: object
          additionalProperties: true
        error:
          type: 'null'
    RecordingCaptureErrorEnvelope:
      type: object
      additionalProperties: false
      required:
      - data
      - meta
      - error
      properties:
        data:
          type: 'null'
        meta:
          type: object
          additionalProperties: true
        error:
          $ref: '#/components/schemas/RecordingCaptureError'
    ReaderSentence:
      description: Dynamic sentence anchor. The canonical- ID prefix is reserved for shared canonical metadata anchors across layouts.
      type: object
      additionalProperties: false
      required: [id, spans]
      properties:
        id: { $ref: '#/components/schemas/OnlineBulletinID' }
        spans:
          type: array
          minItems: 1
          maxItems: 32
          items: { $ref: '#/components/schemas/OnlineBulletinSpan' }
    ReaderBlock:
      type: object
      additionalProperties: false
      required: [id, style, sentences]
      properties:
        id: { $ref: '#/components/schemas/OnlineBulletinID' }
        style: { $ref: '#/components/schemas/OnlineBulletinParagraphStyle' }
        sentences:
          type: array
          minItems: 1
          maxItems: 1024
          items: { $ref: '#/components/schemas/ReaderSentence' }
    ReaderItem:
      type: object
      additionalProperties: false
      required: [id, blocks]
      properties:
        id: { $ref: '#/components/schemas/OnlineBulletinID' }
        title: { $ref: '#/components/schemas/ReaderBlock' }
        blocks:
          type: array
          maxItems: 4096
          items: { $ref: '#/components/schemas/ReaderBlock' }
    ReaderCover:
      type: object
      additionalProperties: false
      required: [welcome, worship, work, wordQuestions, weeklyVerses]
      properties:
        welcome:
          type: array
          minItems: 1
          maxItems: 4096
          items: { $ref: '#/components/schemas/ReaderBlock' }
        worship:
          type: array
          minItems: 1
          maxItems: 256
          items: { $ref: '#/components/schemas/ReaderItem' }
        work:
          type: array
          minItems: 1
          maxItems: 256
          items: { $ref: '#/components/schemas/ReaderItem' }
        wordQuestions:
          type: array
          minItems: 1
          maxItems: 256
          items: { $ref: '#/components/schemas/ReaderItem' }
        weeklyVerses:
          type: array
          minItems: 1
          maxItems: 4096
          items: { $ref: '#/components/schemas/ReaderBlock' }
    ReaderBodySection:
      type: object
      additionalProperties: false
      required: [kind, title, blocks]
      properties:
        kind: { type: string, enum: [sermon, testimony, teaching, reflection, unknown], description: Unknown creates a blocking review issue. }
        header: { $ref: '#/components/schemas/ReaderBodyHeader' }
        title: { $ref: '#/components/schemas/ReaderBlock' }
        subtitle: { $ref: '#/components/schemas/ReaderBlock' }
        contributors:
          type: array
          maxItems: 32
          items:
            type: object
            additionalProperties: false
            required: [role, name]
            properties:
              role: { type: string, enum: [speaker, transcriber, editor, author] }
              name: { $ref: '#/components/schemas/ReaderBlock' }
        blocks:
          type: array
          minItems: 1
          maxItems: 4096
          items: { $ref: '#/components/schemas/ReaderBlock' }
    ReaderBodyHeader:
      description: First body section only. Source lecture date is independent of canonical issue publication date; all fields use sentence anchors. Missing contributor roles block publication review.
      type: object
      additionalProperties: false
      required: [lectureDate, contributors]
      properties:
        lectureDate: { $ref: '#/components/schemas/ReaderBlock' }
        contributors:
          type: array
          maxItems: 3
          items:
            type: object
            additionalProperties: false
            required: [role, name]
            properties:
              role: { type: string, enum: [speaker, transcriber, editor] }
              name: { $ref: '#/components/schemas/ReaderBlock' }
    ReaderHymnLyrics:
      type: object
      additionalProperties: false
      required: [hymns]
      properties:
        hymns:
          type: array
          minItems: 1
          maxItems: 32
          items:
            type: object
            additionalProperties: false
            required: [id, title, sections]
            properties:
              id: { $ref: '#/components/schemas/OnlineBulletinID' }
              number: { $ref: '#/components/schemas/ReaderBlock' }
              title: { $ref: '#/components/schemas/ReaderBlock' }
              sourceLabel: { $ref: '#/components/schemas/ReaderBlock' }
              sections:
                type: array
                minItems: 1
                maxItems: 64
                items:
                  type: object
                  additionalProperties: false
                  required: [id, kind, lines]
                  properties:
                    id: { $ref: '#/components/schemas/OnlineBulletinID' }
                    kind: { type: string, enum: [verse, chorus, bridge] }
                    lines:
                      type: array
                      minItems: 1
                      maxItems: 4096
                      items: { $ref: '#/components/schemas/ReaderBlock' }
    ReaderIllustration:
      description: Source-linked private raster illustration; owned Asset references are server-only and sanitized PNG pixels are authorized response-only.
      type: object
      additionalProperties: false
      required: [id, componentId, pageId, box, alt, sha256, sizeBytes, png]
      properties:
        id: { $ref: '#/components/schemas/OnlineBulletinHash' }
        componentId: { $ref: '#/components/schemas/OnlineBulletinID' }
        afterBlockId: { $ref: '#/components/schemas/OnlineBulletinID' }
        pageId: { $ref: '#/components/schemas/OnlineBulletinID' }
        box: { $ref: '#/components/schemas/OnlineBulletinBox' }
        alt: { type: string, minLength: 1, maxLength: 256 }
        sha256: { $ref: '#/components/schemas/OnlineBulletinHash' }
        sizeBytes: { type: integer, minimum: 1, maximum: 2097152 }
        png: { type: string, maxLength: 2796204, pattern: '^[A-Za-z0-9+/]+={0,2}$', description: Authorized response-only sanitized PNG base64; never stored in documents. }
    ReaderComponent:
      oneOf:
        - $ref: '#/components/schemas/ReaderCoverComponent'
        - $ref: '#/components/schemas/ReaderBodyComponent'
        - $ref: '#/components/schemas/ReaderHymnComponent'
        - $ref: '#/components/schemas/ReaderBackComponent'
      discriminator:
        propertyName: type
        mapping:
          cover: '#/components/schemas/ReaderCoverComponent'
          bodySection: '#/components/schemas/ReaderBodyComponent'
          hymnLyrics: '#/components/schemas/ReaderHymnComponent'
          backSummary: '#/components/schemas/ReaderBackComponent'
          announcements: '#/components/schemas/ReaderBackComponent'
          victoriesAndPrayers: '#/components/schemas/ReaderBackComponent'
    ReaderCoverComponent:
      type: object
      additionalProperties: false
      required: [id, type, cover]
      properties:
        illustrations:
          type: array
          maxItems: 8
          items: { $ref: '#/components/schemas/ReaderIllustration' }
        id: { $ref: '#/components/schemas/OnlineBulletinID' }
        type: { type: string, const: cover }
        cover: { $ref: '#/components/schemas/ReaderCover' }
    ReaderBodyComponent:
      type: object
      additionalProperties: false
      required: [id, type, bodySection]
      properties:
        illustrations:
          type: array
          maxItems: 8
          items: { $ref: '#/components/schemas/ReaderIllustration' }
        id: { $ref: '#/components/schemas/OnlineBulletinID' }
        type: { type: string, const: bodySection }
        bodySection: { $ref: '#/components/schemas/ReaderBodySection' }
    ReaderHymnComponent:
      type: object
      additionalProperties: false
      required: [id, type, hymnLyrics]
      properties:
        illustrations:
          type: array
          maxItems: 8
          items: { $ref: '#/components/schemas/ReaderIllustration' }
        id: { $ref: '#/components/schemas/OnlineBulletinID' }
        type: { type: string, const: hymnLyrics }
        hymnLyrics: { $ref: '#/components/schemas/ReaderHymnLyrics' }
    ReaderBackComponent:
      type: object
      additionalProperties: false
      required: [id, type, items]
      properties:
        illustrations:
          type: array
          maxItems: 8
          items: { $ref: '#/components/schemas/ReaderIllustration' }
        id: { $ref: '#/components/schemas/OnlineBulletinID' }
        type: { type: string, enum: [backSummary, announcements, victoriesAndPrayers] }
        items:
          type: array
          maxItems: 256
          items: { $ref: '#/components/schemas/ReaderItem' }
    ReaderHighlightColor:
      type: string
      enum: [yellow, red, blue]
    ReaderAnchorIDs:
      type: array
      minItems: 1
      maxItems: 500
      uniqueItems: true
      items: { $ref: '#/components/schemas/OnlineBulletinID' }
    ReaderTextRange:
      type: object
      additionalProperties: false
      required: [sentenceId, start, end]
      description: Half-open Unicode scalar offsets into the trusted published sentence; start must be less than end. DOM UTF-16 offsets are not accepted.
      properties:
        sentenceId: { $ref: '#/components/schemas/OnlineBulletinID' }
        start: { type: integer, minimum: 0, maximum: 1000000 }
        end: { type: integer, minimum: 1, maximum: 1000000 }
    ReaderTextRanges:
      type: array
      minItems: 1
      maxItems: 500
      description: One continuous range in semantic order; exactly one entry for each sentenceIds item. Omit for legacy whole-sentence behavior; null and empty are invalid.
      items: { $ref: '#/components/schemas/ReaderTextRange' }
    ReaderHighlightSegment:
      type: object
      additionalProperties: false
      required: [start, end, color]
      properties:
        start: { type: integer, minimum: 0 }
        end: { type: integer, minimum: 1 }
        color: { $ref: '#/components/schemas/ReaderHighlightColor' }
    ReaderNoteRange:
      type: object
      additionalProperties: false
      required: [sentenceId, start, end, quote]
      properties:
        sentenceId: { $ref: '#/components/schemas/OnlineBulletinID' }
        start: { type: integer, minimum: 0 }
        end: { type: integer, minimum: 1 }
        quote: { type: string, description: Complete server-derived source sentence used to verify offsets on revision migration. The parent note quote contains only selected text. }
    ReaderPrivateAnchor:
      type: object
      additionalProperties: false
      required: [sentenceId, quote, componentId, pageId]
      properties:
        sentenceId: { type: string }
        quote: { type: string }
        componentId: { type: string }
        pageId: { type: string }
    ReaderHighlight:
      type: object
      additionalProperties: false
      required: [sentenceId, color, quote, active, version, updatedAt]
      properties:
        segments:
          type: array
          minItems: 1
          maxItems: 256
          description: Authoritative sorted non-overlapping ranges. When omitted, legacy color covers the complete sentence. When present, top-level color is only the first segment color.
          items: { $ref: '#/components/schemas/ReaderHighlightSegment' }
        sentenceId: { $ref: '#/components/schemas/OnlineBulletinID' }
        color: { $ref: '#/components/schemas/ReaderHighlightColor' }
        quote: { type: string }
        active: { type: boolean }
        version: { type: integer, minimum: 1 }
        updatedAt: { type: string, format: date-time }
    ReaderHighlightHistoryEntry:
      type: object
      additionalProperties: false
      description: Missing highlight is an opaque consumed-entry tombstone; it prevents migration from resurrecting discarded private text.
      required: [id]
      properties:
        id: { type: string, format: uuid }
        highlight: { $ref: '#/components/schemas/ReaderHighlight' }
    ReaderNote:
      type: object
      additionalProperties: false
      required: [id, text, sentenceIds, inactiveAnchors, quote, version, deleted, reanchorRequired, createdAt, updatedAt]
      properties:
        ranges:
          type: array
          minItems: 1
          maxItems: 500
          items: { $ref: '#/components/schemas/ReaderNoteRange' }
        id: { type: string, format: uuid }
        text: { type: string, maxLength: 10000 }
        sentenceIds: { type: array, maxItems: 500, items: { $ref: '#/components/schemas/OnlineBulletinID' } }
        inactiveAnchors: { type: array, items: { $ref: '#/components/schemas/ReaderPrivateAnchor' } }
        quote: { type: string }
        version: { type: integer, minimum: 1 }
        deleted: { type: boolean }
        reanchorRequired: { type: boolean, description: Oversized automatic split retains private text/quote without truncation; explicit re-anchoring is required. }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ReaderBookmark:
      description: Account/document private bookmark. Deleted tombstones have empty name/sentenceId/pageId and offset zero. Revisions never guess a replacement target.
      type: object
      additionalProperties: false
      required: [id, name, sentenceId, offset, pageId, documentRevision, version, deleted, reanchorRequired, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 80 }
        sentenceId: { type: string, maxLength: 128 }
        offset: { type: integer, minimum: 0, description: Unicode scalar offset within the canonical fragment on pageId. }
        pageId: { type: string, maxLength: 128 }
        documentRevision: { type: integer, minimum: 1 }
        version: { type: integer, minimum: 1 }
        deleted: { type: boolean }
        reanchorRequired: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ReaderProgress:
      type: object
      additionalProperties: false
      required: [pageId, componentId, sentenceId, recordedAt, updatedAt]
      properties:
        pageId: { type: string }
        componentId: { type: string }
        sentenceId: { type: string }
        recordedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ReaderMigrationConflict:
      type: object
      additionalProperties: false
      required: [id, sentenceIds, sources]
      properties:
        id: { type: string, format: uuid }
        sentenceIds: { $ref: '#/components/schemas/ReaderAnchorIDs' }
        sources: { type: array, items: { $ref: '#/components/schemas/ReaderHighlight' } }
    ReaderPrivateState:
      type: object
      additionalProperties: false
      required: [accountId, documentId, appliedRevision, currentRevision, highlights, notes, progress, conflicts]
      properties:
        accountId: { type: string, format: uuid, readOnly: true, description: Trusted response binding only; never accepted as a mutation input. }
        documentId: { type: string, format: uuid }
        appliedRevision: { type: integer, minimum: 1 }
        currentRevision: { type: integer, minimum: 1 }
        highlights: { type: array, items: { $ref: '#/components/schemas/ReaderHighlight' } }
        highlightHistory:
          type: array
          description: Private retained source selections that no longer locate current text. Entries are not active highlights and never imply a current anchor. Omitted on legacy states.
          items: { $ref: '#/components/schemas/ReaderHighlightHistoryEntry' }
        notes: { type: array, items: { $ref: '#/components/schemas/ReaderNote' } }
        bookmarks:
          type: array
          description: New producers always return this array, including empty. Optional only for compatibility with older producers and offline snapshots.
          items: { $ref: '#/components/schemas/ReaderBookmark' }
        progress: { oneOf: [{ $ref: '#/components/schemas/ReaderProgress' }, { type: 'null' }] }
        conflicts: { type: array, items: { $ref: '#/components/schemas/ReaderMigrationConflict' } }
    ReaderStateEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta, error]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [state]
          properties:
            state: { $ref: '#/components/schemas/ReaderPrivateState' }
            fromRevision: { type: integer, minimum: 1 }
            mappings:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [fromSentenceId, toSentenceIds]
                properties:
                  fromSentenceId: { $ref: '#/components/schemas/OnlineBulletinID' }
                  toSentenceIds: { type: array, items: { $ref: '#/components/schemas/OnlineBulletinID' } }
        meta: { type: object, additionalProperties: true }
        error: { type: 'null' }
    ReaderMutationResult:
      type: object
      additionalProperties: false
      required: [mutationId, status, revision]
      properties:
        mutationId: { type: string, format: uuid }
        status: { type: string, enum: [applied, revision_changed, recovery_required, note_conflict, migration_conflict, conflict_not_found, bookmark_conflict, bookmark_limit] }
        revision: { type: integer, minimum: 1 }
        note: { $ref: '#/components/schemas/ReaderNote' }
        bookmark: { $ref: '#/components/schemas/ReaderBookmark' }
    ReaderMutationEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta, error]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [state, results]
          properties:
            state: { $ref: '#/components/schemas/ReaderPrivateState' }
            results: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/ReaderMutationResult' } }
        meta: { type: object, additionalProperties: true }
        error: { type: 'null' }
    ReaderMutation:
      allOf:
        - type: object
          additionalProperties: false
          required: [mutationId, createdAt, documentRevision, kind, payload]
          properties:
            mutationId: { type: string, format: uuid }
            createdAt: { type: string, format: date-time }
            documentRevision: { type: integer, minimum: 1, maximum: 9007199254740991 }
            baseVersion: { type: integer, minimum: 1 }
            kind: { type: string, enum: [setHighlight, clearHighlight, restoreHighlight, discardHighlightHistory, createNote, editNote, deleteNote, reanchorNote, setProgress, resolveHighlightMigrationConflict, createBookmark, renameBookmark, deleteBookmark, reanchorBookmark] }
            payload: { type: object, additionalProperties: true }
        - oneOf:
            - required: [kind, payload]
              properties:
                kind: { const: setHighlight }
                payload:
                  type: object
                  additionalProperties: false
                  required: [sentenceIds, color]
                  properties:
                    ranges: { $ref: '#/components/schemas/ReaderTextRanges' }
                    sentenceIds: { $ref: '#/components/schemas/ReaderAnchorIDs' }
                    color: { $ref: '#/components/schemas/ReaderHighlightColor' }
              not: { required: [baseVersion] }
            - required: [kind, payload]
              properties:
                kind: { const: clearHighlight }
                payload:
                  type: object
                  additionalProperties: false
                  required: [sentenceIds]
                  properties:
                    ranges: { $ref: '#/components/schemas/ReaderTextRanges' }
                    sentenceIds: { $ref: '#/components/schemas/ReaderAnchorIDs' }
              not: { required: [baseVersion] }
            - required: [kind, payload]
              properties:
                kind: { const: createNote }
                payload:
                  type: object
                  additionalProperties: false
                  required: [noteId, sentenceIds, text]
                  properties:
                    ranges: { $ref: '#/components/schemas/ReaderTextRanges' }
                    noteId: { type: string, format: uuid }
                    sentenceIds: { $ref: '#/components/schemas/ReaderAnchorIDs' }
                    text: { type: string, minLength: 1, maxLength: 10000 }
              not: { required: [baseVersion] }
            - required: [kind, payload, baseVersion]
              properties:
                kind: { const: editNote }
                payload:
                  type: object
                  additionalProperties: false
                  required: [noteId, text]
                  properties:
                    noteId: { type: string, format: uuid }
                    text: { type: string, minLength: 1, maxLength: 10000 }
            - required: [kind, payload, baseVersion]
              properties:
                kind: { const: reanchorNote }
                payload:
                  description: Explicitly select a new range for a note with unavailable anchors. Requires the current note baseVersion and documentRevision. Preserves note identity, original quote and text; ranges use current server-validated Unicode scalar offsets. A stale note returns note_conflict.
                  type: object
                  additionalProperties: false
                  required: [noteId, sentenceIds, ranges]
                  properties:
                    noteId: { type: string, format: uuid }
                    sentenceIds: { $ref: '#/components/schemas/ReaderAnchorIDs' }
                    ranges: { $ref: '#/components/schemas/ReaderTextRanges' }
            - required: [kind, payload, baseVersion]
              properties:
                kind: { const: deleteNote }
                payload:
                  type: object
                  additionalProperties: false
                  required: [noteId]
                  properties:
                    noteId: { type: string, format: uuid }
            - required: [kind, payload]
              properties:
                kind: { const: setProgress }
                payload:
                  type: object
                  additionalProperties: false
                  properties:
                    pageId: { type: string, maxLength: 128 }
                    componentId: { type: string, maxLength: 128 }
                    sentenceId: { type: string, maxLength: 128 }
              not: { required: [baseVersion] }
            - required: [kind, payload]
              properties:
                kind: { const: restoreHighlight }
                payload:
                  type: object
                  additionalProperties: false
                  required: [historyId, sentenceIds, ranges, color]
                  properties:
                    historyId: { type: string, format: uuid }
                    sentenceIds: { $ref: '#/components/schemas/ReaderAnchorIDs' }
                    ranges: { $ref: '#/components/schemas/ReaderTextRanges' }
                    color: { $ref: '#/components/schemas/ReaderHighlightColor' }
              not: { required: [baseVersion] }
            - required: [kind, payload]
              properties:
                kind: { const: discardHighlightHistory }
                payload:
                  type: object
                  additionalProperties: false
                  required: [historyId]
                  properties:
                    historyId: { type: string, format: uuid }
              not: { required: [baseVersion] }
            - required: [kind, payload]
              properties:
                kind: { const: resolveHighlightMigrationConflict }
                payload:
                  type: object
                  additionalProperties: false
                  required: [conflictId, chosenColor, currentRevision]
                  properties:
                    conflictId: { type: string, format: uuid }
                    chosenColor: { $ref: '#/components/schemas/ReaderHighlightColor' }
                    currentRevision: { type: integer, minimum: 1, maximum: 9007199254740991 }
              not: { required: [baseVersion] }
            - required: [kind, payload]
              properties:
                kind: { const: createBookmark }
                baseVersion: false
                payload:
                  type: object
                  additionalProperties: false
                  required: [bookmarkId, name, sentenceId, offset, pageId]
                  properties:
                    bookmarkId: { type: string, format: uuid }
                    name: { type: string, minLength: 1, maxLength: 80 }
                    sentenceId: { type: string, minLength: 1, maxLength: 128 }
                    offset: { type: integer, minimum: 0 }
                    pageId: { type: string, minLength: 1, maxLength: 128 }
              not: { required: [baseVersion] }
            - required: [kind, payload, baseVersion]
              properties:
                kind: { const: renameBookmark }
                baseVersion: { type: integer, minimum: 1 }
                payload:
                  type: object
                  additionalProperties: false
                  required: [bookmarkId, name]
                  properties:
                    bookmarkId: { type: string, format: uuid }
                    name: { type: string, minLength: 1, maxLength: 80 }
            - required: [kind, payload, baseVersion]
              properties:
                kind: { const: deleteBookmark }
                baseVersion: { type: integer, minimum: 1 }
                payload:
                  type: object
                  additionalProperties: false
                  required: [bookmarkId]
                  properties:
                    bookmarkId: { type: string, format: uuid }
            - required: [kind, payload, baseVersion]
              properties:
                kind: { const: reanchorBookmark }
                baseVersion: { type: integer, minimum: 1 }
                payload:
                  type: object
                  additionalProperties: false
                  required: [bookmarkId, sentenceId, offset, pageId]
                  properties:
                    bookmarkId: { type: string, format: uuid }
                    sentenceId: { type: string, minLength: 1, maxLength: 128 }
                    offset: { type: integer, minimum: 0 }
                    pageId: { type: string, minLength: 1, maxLength: 128 }
    ReaderAccessInput:
      description: At most 4096 encoded bytes. Each client request UUID is account-bound and immutable for the receipt retention period.
      type: object
      additionalProperties: false
      required: [clientRequestId]
      properties:
        clientRequestId: { type: string, format: uuid }
        revision: { type: integer, minimum: 1, maximum: 9007199254740991 }
        receiptId: { type: string, format: uuid }
    ReaderPDFAction:
      description: Current PDF action identity, never a private asset URL.
      type: object
      additionalProperties: false
      required: [issueId, series, locale]
      properties:
        issueId: { type: string, format: uuid }
        series: { $ref: '#/components/schemas/BulletinSeries' }
        locale: { $ref: '#/components/schemas/BulletinLocale' }
    ReaderDiscoveryItem:
      type: object
      additionalProperties: false
      required: [issueId, issueNumber, issueDate, series, contentLocale, canonicalMetadata, onlineRevision, pdfPublished]
      properties:
        issueId: { type: string, format: uuid }
        issueNumber: { type: [integer, 'null'], description: 'Current canonical route identity, independent of the frozen publication metadata.' }
        issueDate: { type: string, format: date }
        series: { $ref: '#/components/schemas/BulletinSeries' }
        contentLocale: { $ref: '#/components/schemas/BulletinLocale' }
        canonicalMetadata: { $ref: '#/components/schemas/OnlineBulletinCanonicalMetadata' }
        documentId: { type: string, format: uuid }
        onlineRevision: { type: [integer, 'null'], minimum: 1 }
        pdfPublished: { type: boolean }
        download: { $ref: '#/components/schemas/ReaderPDFAction' }
    ReaderDiscoveryEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta, error]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [items, total, offset, limit]
          properties:
            items: { type: array, maxItems: 300, items: { $ref: '#/components/schemas/ReaderDiscoveryItem' } }
            total: { type: integer, minimum: 0 }
            offset: { type: integer, minimum: 0, maximum: 1000000 }
            limit: { type: integer, minimum: 1, maximum: 100 }
        meta: { type: object, additionalProperties: true }
        error: { type: 'null' }
    ReaderAccessEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta, error]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [document, access]
          properties:
            document: { $ref: '#/components/schemas/ReaderDocument' }
            access: { $ref: '#/components/schemas/ReaderAccess' }
        meta: { type: object, additionalProperties: true }
        error: { type: 'null' }
    ReaderAccess:
      type: object
      additionalProperties: false
      required: [accountId, documentId, series, contentLocale, revision, currentRevision, receiptId, traceCode, validatedAt, offlineValidUntil]
      properties:
        accountId: { type: string, format: uuid }
        documentId: { type: string, format: uuid }
        series: { $ref: '#/components/schemas/BulletinSeries' }
        contentLocale: { $ref: '#/components/schemas/BulletinLocale' }
        revision: { type: integer, minimum: 1 }
        currentRevision: { type: integer, minimum: 1 }
        receiptId: { type: string, format: uuid }
        traceCode: { type: string, description: Opaque formatted visible code; never account identity. }
        validatedAt: { type: string, format: date-time }
        offlineValidUntil: { type: string, format: date-time, description: Exactly 604800 seconds after validatedAt. }
    ReaderDocument:
      type: object
      additionalProperties: false
      required: [issueId, documentId, series, contentLocale, revision, canonicalMetadata, metadataSyncPending, pdfPublished, content]
      properties:
        issueId: { type: string, format: uuid }
        documentId: { type: string, format: uuid }
        series: { $ref: '#/components/schemas/BulletinSeries' }
        contentLocale: { $ref: '#/components/schemas/BulletinLocale' }
        revision: { type: integer, minimum: 1 }
        canonicalMetadata: { $ref: '#/components/schemas/OnlineBulletinCanonicalMetadata' }
        metadataSyncPending: { type: boolean }
        pdfPublished: { type: boolean }
        download: { $ref: '#/components/schemas/ReaderPDFAction' }
        content: { $ref: '#/components/schemas/ReaderContent' }
    ReaderContent:
      description: Closed published rendering projection with no extraction provenance. Layout proof binds the original worker measurement; it is not a hash of this redacted DTO. Verify the response byte digest separately.
      type: object
      additionalProperties: false
      required: [schemaVersion, templateVersion, printedBodyPageCount, pages, layoutManifest, components]
      allOf:
        - if:
            properties:
              layoutManifest:
                properties: { rendererVersion: { enum: [v9, v10, v11] } }
          then: { required: [templateSnapshot] }
          else: { not: { required: [templateSnapshot] } }
      properties:
        headerSpeakerStartComponentId:
          allOf: [{ $ref: '#/components/schemas/OnlineBulletinID' }]
          description: Source-verified first section for article-header speakers. Omitted when ambiguous; conveys no PDF coordinates.
        printedBodyPageCount: { type: integer, minimum: 2, maximum: 38, description: 'Visible printed body issue-summary count, independent of HTML pagination.' }
        schemaVersion: { type: string, const: '1' }
        templateVersion: { type: string, enum: [v1, v2] }
        templateSnapshot:
          allOf:
            - $ref: '#/components/schemas/BulletinTemplateSettings'
            - properties: { version: { maximum: 9007199254740991 } }
          description: Immutable renderable values only; no settings actor or audit history is exposed.
        pages: { type: array, minItems: 4, maxItems: 40, items: { $ref: '#/components/schemas/OnlineBulletinPage' } }
        layoutManifest: { $ref: '#/components/schemas/OnlineBulletinLayoutManifest' }
        components: { type: array, minItems: 6, maxItems: 256, items: { $ref: '#/components/schemas/ReaderComponent' } }
    OnlineBulletinComparisonValue:
      oneOf:
        - { $ref: '#/components/schemas/OnlineBulletinBlock' }
        - { $ref: '#/components/schemas/OnlineBulletinComponent' }
        - type: array
          maxItems: 256
          items: { $ref: '#/components/schemas/OnlineBulletinID' }
        - { type: 'null' }
    OnlineBulletinComparison:
      type: object
      additionalProperties: false
      required: [documentId, version, canonicalVersion, baseRevision, localRevision, incomingRevision, units]
      properties:
        documentId: { type: string, format: uuid }
        version: { type: integer, format: int64, minimum: 1 }
        canonicalVersion: { type: integer, format: int64, minimum: 1 }
        baseRevision: { type: integer, format: int64, minimum: 1 }
        localRevision: { type: integer, format: int64, minimum: 1 }
        incomingRevision: { type: integer, format: int64, minimum: 1 }
        units:
          type: array
          maxItems: 65536
          items:
            type: object
            additionalProperties: false
            required: [componentId, blockId, suggestion, base, local, incoming]
            properties:
              componentId: { type: string, maxLength: 128 }
              blockId: { type: string, maxLength: 128 }
              sourceRepairRequired: { type: boolean, description: Images from a replaced source must be selected again from the current PDF. }
              suggestion: { type: string, enum: [same, local, incoming, conflict] }
              base: { $ref: '#/components/schemas/OnlineBulletinComparisonValue' }
              local: { $ref: '#/components/schemas/OnlineBulletinComparisonValue' }
              incoming: { $ref: '#/components/schemas/OnlineBulletinComparisonValue' }
    OnlineBulletinCompareInput:
      type: object
      additionalProperties: false
      required: [canonicalVersion, baseRevision, localRevision, incomingRevision]
      properties:
        canonicalVersion: { type: integer, format: int64, minimum: 1 }
        baseRevision: { type: integer, format: int64, minimum: 1 }
        localRevision: { type: integer, format: int64, minimum: 1 }
        incomingRevision: { type: integer, format: int64, minimum: 1 }
        choices:
          type: array
          maxItems: 65536
          items:
            type: object
            additionalProperties: false
            required: [componentId, blockId, choice]
            properties:
              componentId: { type: string, maxLength: 128 }
              blockId: { type: string, maxLength: 128 }
              choice: { type: string, enum: [local, incoming, manual] }
              value: { $ref: '#/components/schemas/OnlineBulletinComparisonValue' }
            oneOf:
              - properties:
                  choice: { const: manual }
                required: [value]
              - properties:
                  choice: { enum: [local, incoming] }
                not:
                  properties:
                    value: {}
                  required: [value]
    OnlineBulletinDraftInput:
      type: object
      additionalProperties: false
      required: [canonicalVersion, components]
      properties:
        canonicalVersion: { type: integer, format: int64, minimum: 1 }
        components:
          description: Typed editable content only. Omit every read-only sentence source field; the server preserves source provenance by stable sentence ID.
          type: array
          minItems: 6
          maxItems: 256
          items: { $ref: '#/components/schemas/OnlineBulletinComponent' }
    OnlineBulletinSavedDraft:
      type: object
      additionalProperties: false
      required: [documentId, version, revision, layoutJobId]
      properties:
        documentId: { type: string, format: uuid }
        version: { type: integer, format: int64, minimum: 1 }
        revision: { type: integer, format: int64, minimum: 1 }
        layoutJobId: { type: string, format: uuid }
    OnlineBulletinExtractionInput:
      type: object
      additionalProperties: false
      required: [canonicalVersion]
      properties:
        canonicalVersion: { type: integer, format: int64, minimum: 1 }
        retry: { type: boolean, default: false }
        autoPublish: { type: boolean, default: false, description: Authorize verified current-source PDF and online publication; requires cms:bulletins:publish in addition to write. Explicit draft or unpublish cancels this intent. }
        notifySubscribers: { type: boolean, default: false, description: Requires autoPublish; retains existing once-per-issue notification policy. }
    OnlineBulletinQueuedExtractionEnvelope:
      type: object
      required: [data, meta, error]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [documentId, version, job]
          properties:
            documentId: { type: string, format: uuid }
            version: { type: integer, format: int64, minimum: 1 }
            job: { $ref: '#/components/schemas/OnlineBulletinAdminJob' }
        meta: { type: object, additionalProperties: true }
        error: { type: 'null' }
    OnlineBulletinRevisionPage:
      type: object
      additionalProperties: false
      required: [documentId, items, nextBefore]
      properties:
        documentId: { type: string, format: uuid }
        nextBefore: { type: [integer, 'null'], format: int64, minimum: 1 }
        items:
          type: array
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            required: [revision, createdBy, createdAt, sourceAssetChecksum, layoutValidated]
            properties:
              revision: { type: integer, format: int64, minimum: 1 }
              createdBy: { type: string }
              createdAt: { type: string, format: date-time }
              sourceAssetChecksum: { type: string, pattern: '^[0-9a-f]{64}$' }
              layoutValidated: { type: boolean, description: Historical worker proof exists; not current publication authority. }
    OnlineBulletinHistoricalRevision:
      type: object
      additionalProperties: false
      required: [documentId, revision, document, reviewIssues, canonicalMetadata, createdBy, createdAt]
      properties:
        documentId: { type: string, format: uuid }
        revision: { type: integer, format: int64, minimum: 1 }
        document: { $ref: '#/components/schemas/OnlineBulletinDocument' }
        reviewIssues:
          type: array
          maxItems: 4096
          items: { $ref: '#/components/schemas/OnlineBulletinReviewIssue' }
        canonicalMetadata: { $ref: '#/components/schemas/OnlineBulletinCanonicalMetadata' }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
    OnlineBulletinPublishInput:
      type: object
      additionalProperties: false
      required: [canonicalVersion, revision]
      properties:
        canonicalVersion: { type: integer, format: int64, minimum: 1 }
        revision: { type: integer, format: int64, minimum: 1 }
        mappings:
          type: array
          maxItems: 65536
          items: { $ref: '#/components/schemas/OnlineBulletinSentenceMapping' }
    OnlineBulletinSentenceMapping:
      type: object
      additionalProperties: false
      required: [fromSentenceId, status, toSentenceIds]
      properties:
        fromSentenceId: { type: string, pattern: '^[A-Za-z0-9_-]{1,128}$' }
        status: { type: string, enum: [unchanged, moved, split, merged, removed] }
        toSentenceIds:
          type: array
          maxItems: 1024
          uniqueItems: true
          items: { type: string, pattern: '^[A-Za-z0-9_-]{1,128}$' }
    OnlineBulletinUnpublishedRevision:
      type: object
      additionalProperties: false
      required: [documentId, version]
      properties:
        documentId: { type: string, format: uuid }
        version: { type: integer, format: int64, minimum: 1 }
    OnlineBulletinRestoreInput:
      type: object
      additionalProperties: false
      required: [canonicalVersion]
      properties:
        canonicalVersion: { type: integer, format: int64, minimum: 1 }
    OnlineBulletinConfirmInput:
      type: object
      additionalProperties: false
      required: [canonicalVersion, revision, layoutValidationHash, pageCount, acceptedIssues]
      properties:
        canonicalVersion: { type: integer, format: int64, minimum: 1 }
        revision: { type: integer, format: int64, minimum: 1 }
        layoutValidationHash: { type: string, pattern: '^[0-9a-f]{64}$' }
        pageCount: { type: integer, minimum: 1, maximum: 80 }
        acceptedIssues:
          type: array
          maxItems: 4096
          uniqueItems: true
          items: { $ref: '#/components/schemas/OnlineBulletinReviewIssue' }
    OnlineBulletinConfirmedRevision:
      type: object
      additionalProperties: false
      required: [documentId, version, revision]
      properties:
        documentId: { type: string, format: uuid }
        version: { type: integer, format: int64, minimum: 1 }
        revision: { type: integer, format: int64, minimum: 1 }
    OnlineBulletinDerivation:
      type: object
      additionalProperties: false
      description: Latest non-superseded conversion provenance; Admin only. A resultRevision may be Incoming rather than the adopted Local baseline. stale compares the current source revision, hash and canonical metadata.
      required: [sourceDocumentId, sourceRevision, sourceContentHash, sourceMetadataVersion, converterVersion, resultRevision, convertedMetadata, stale]
      properties:
        sourceDocumentId: { type: string, format: uuid }
        sourceRevision: { type: integer, format: int64, minimum: 1 }
        sourceContentHash: { type: string, pattern: '^[0-9a-f]{64}$' }
        sourceMetadataVersion: { type: integer, format: int64, minimum: 1 }
        converterVersion: { type: string }
        resultRevision: { type: [integer, 'null'], format: int64, minimum: 1 }
        convertedMetadata:
          oneOf:
            - { type: 'null' }
            - { $ref: '#/components/schemas/OnlineBulletinCanonicalMetadata' }
        stale: { type: boolean }
    OnlineBulletinConversionInput:
      type: object
      additionalProperties: false
      required: [canonicalVersion, sourceOnlineVersion, sourceRevision]
      properties:
        canonicalVersion: { type: integer, format: int64, minimum: 1 }
        sourceOnlineVersion: { type: integer, format: int64, minimum: 1 }
        sourceRevision: { type: integer, format: int64, minimum: 1 }
        retry: { type: boolean, default: false }
    OnlineBulletinAutomation:
      type: object
      additionalProperties: false
      required: [autoPublish, update, summary, changeKind]
      properties:
        disposition: { $ref: '#/components/schemas/PublicationDisposition' }
        autoPublish: { type: boolean }
        summary: { type: string, maxLength: 800 }
        changeKind: { type: string, enum: ['', first, unchanged, layout, correction, structure] }
        update:
          oneOf:
            - { type: 'null' }
            - type: object
              additionalProperties: false
              required: [id, status, attempts, errorCode, resultRevision]
              properties:
                id: { type: string, format: uuid }
                status: { type: string, enum: [queued, planning, ready, failed, superseded] }
                attempts: { type: integer, minimum: 0, maximum: 10 }
                errorCode: { type: string }
                resultRevision: { type: [integer, 'null'], format: int64, minimum: 1 }
    OnlineBulletinAdminState:
      type: object
      additionalProperties: false
      required: [issueId, series, contentLocale, canonicalVersion, canonicalMetadata, pdfStatus, documentId, version, draftStatus, baseRevision, local, incomingRevision, publishedRevision, publishedMetadata, metadataSyncPending, confirmed, extraction, layout]
      properties:
        derivedPublication: { $ref: '#/components/schemas/OnlineBulletinDerivedPublication' }
        notification: { $ref: '#/components/schemas/OnlineBulletinInitialNotification' }
        capabilities: { $ref: '#/components/schemas/OnlineBulletinCapabilities' }
        production: { $ref: '#/components/schemas/OnlineBulletinProduction' }
        automation: { $ref: '#/components/schemas/OnlineBulletinAutomation' }
        issueId: { type: string, format: uuid }
        series: { type: string, enum: [general] }
        contentLocale: { type: string, enum: [zh-Hant, zh-Hans] }
        canonicalVersion: { type: integer, format: int64, minimum: 1 }
        canonicalMetadata: { $ref: '#/components/schemas/OnlineBulletinCanonicalMetadata' }
        pdfStatus: { $ref: '#/components/schemas/BulletinVersionStatus' }
        documentId: { type: string, pattern: '^([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})?$' }
        version: { type: integer, format: int64, minimum: 0 }
        draftStatus: { type: string, enum: [notStarted, extracting, reviewRequired, ready, published, extractionFailed] }
        baseRevision: { type: [integer, 'null'], format: int64, minimum: 1 }
        incomingRevision: { type: [integer, 'null'], format: int64, minimum: 1 }
        publishedRevision: { type: [integer, 'null'], format: int64, minimum: 1 }
        metadataSyncPending: { type: boolean, description: Canonical metadata differs from the immutable Online publication and requires explicit republish. }
        conversion: { $ref: '#/components/schemas/OnlineBulletinAdminJob' }
        derivation: { $ref: '#/components/schemas/OnlineBulletinDerivation' }
        confirmed: { type: boolean, description: Human confirmation matches current Local and canonical metadata. This does not itself authorize publication. }
        publishedMetadata:
          oneOf:
            - { type: 'null' }
            - { $ref: '#/components/schemas/OnlineBulletinCanonicalMetadata' }
        local:
          oneOf:
            - { type: 'null' }
            - { $ref: '#/components/schemas/OnlineBulletinAdminRevision' }
        extraction:
          oneOf:
            - { type: 'null' }
            - { $ref: '#/components/schemas/OnlineBulletinAdminJob' }
        layout:
          oneOf:
            - { type: 'null' }
            - { $ref: '#/components/schemas/OnlineBulletinAdminJob' }
    OnlineBulletinAdminRevision:
      type: object
      additionalProperties: false
      required: [revision, document, reviewIssues]
      properties:
        revision: { type: integer, format: int64, minimum: 1 }
        document: { $ref: '#/components/schemas/OnlineBulletinDocument' }
        reviewIssues:
          type: array
          maxItems: 4096
          items: { $ref: '#/components/schemas/OnlineBulletinReviewIssue' }
    OnlineBulletinReviewIssue:
      type: object
      additionalProperties: false
      required: [code, blocking]
      properties:
        code: { type: string, pattern: '^[a-z0-9_]{1,64}$' }
        blocking: { type: boolean }
        componentId: { $ref: '#/components/schemas/OnlineBulletinID' }
        blockId: { $ref: '#/components/schemas/OnlineBulletinID' }
        sentenceId: { $ref: '#/components/schemas/OnlineBulletinID' }
        fixedElement:
          description: Validated fixed template element at the failing layout location. This diagnostic cannot be waived.
          $ref: '#/components/schemas/OnlineBulletinID'
        sourcePage:
          description: One-based original PDF page, never the composed online page index. Omitted when no exact source page is available.
          type: integer
          minimum: 1
          maximum: 40
    OnlineBulletinAdminJob:
      type: object
      additionalProperties: false
      required: [id, status, attempts, errorCode]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [queued, parsing, converting, review_ready, validating, ready, failed] }
        resultRevision:
          description: This extraction job's saved candidate revision. Null means no saved candidate; omitted by older producers means unknown. Never infer this from the current Local or Incoming pointer.
          type: [integer, 'null']
          minimum: 1
        attempts: { type: integer, minimum: 0 }
        errorCode: { type: string, pattern: '^[a-z0-9_]{0,64}$' }
        reviewIssues:
          description: Extraction, current saved-draft layout, or Simplified conversion diagnostics. Layout findings are non-waivable and reference original PDF pages and content IDs when available. Conversion locations refer to the immutable Traditional source revision recorded by the derivation.
          type: array
          maxItems: 4096
          items: { $ref: '#/components/schemas/OnlineBulletinReviewIssue' }
    OnlineBulletinID:
      type: string
      pattern: '^[A-Za-z0-9_-]{1,128}$'
    OnlineBulletinHash:
      type: string
      pattern: '^[0-9a-f]{64}$'
    OnlineBulletinFontRole:
      type: string
      enum: [body, scripture, emphasis, reference, foreignText, symbol]
    OnlineBulletinDocument:
      description: Typed immutable content. Canonical issue metadata and mutable source asset IDs are intentionally absent. Maximum encoded size is 8 MiB; server also validates references, total collection limits and fragment coverage.
      type: object
      additionalProperties: false
      required: [issueId, series, contentLocale, schemaVersion, templateVersion, sourceAssetChecksum, sourcePageCount, pages, layoutManifest, components]
      allOf:
        - if:
            properties:
              layoutManifest:
                properties: { rendererVersion: { enum: [v9, v10, v11] } }
          then: { required: [templateSnapshot] }
          else: { not: { required: [templateSnapshot] } }
      properties:
        issueId: { type: string, format: uuid }
        series: { type: string, const: general }
        contentLocale: { type: string, enum: [zh-Hant, zh-Hans] }
        schemaVersion: { type: string, const: '1' }
        templateVersion: { type: string, enum: [v1, v2] }
        templateSnapshot:
          allOf:
            - $ref: '#/components/schemas/BulletinTemplateSettings'
            - properties: { version: { maximum: 9007199254740991 } }
          description: Immutable issue-owned settings captured when queued. Required by V9 and V10; earlier renderers do not carry a snapshot. Simplified values are server-derived by OpenCC, with the same settings version. Never editable through draft components.
        sourceAssetChecksum: { $ref: '#/components/schemas/OnlineBulletinHash' }
        sourcePageCount: { type: integer, minimum: 4, maximum: 40, description: Must equal the saved page count. Composition preserves original page identity and fragment membership; overflow blocks publication instead of adding pages. }
        pages:
          type: array
          minItems: 4
          maxItems: 40
          items: { $ref: '#/components/schemas/OnlineBulletinPage' }
        layoutManifest: { $ref: '#/components/schemas/OnlineBulletinLayoutManifest' }
        components:
          type: array
          minItems: 6
          maxItems: 256
          items: { $ref: '#/components/schemas/OnlineBulletinComponent' }
    OnlineBulletinPage:
      type: object
      additionalProperties: false
      required: [id, width, height]
      properties:
        id: { $ref: '#/components/schemas/OnlineBulletinID' }
        width: { type: number, exclusiveMinimum: 0, maximum: 2000, description: PDF points. }
        height: { type: number, exclusiveMinimum: 0, maximum: 2000, description: PDF points. }
    OnlineBulletinBox:
      description: Normalized page-relative rectangle. Server additionally rejects any edge exceeding the page boundary.
      type: object
      additionalProperties: false
      required: [x, y, width, height]
      properties:
        x: { type: number, minimum: 0, maximum: 1 }
        y: { type: number, minimum: 0, maximum: 1 }
        width: { type: number, exclusiveMinimum: 0, maximum: 1 }
        height: { type: number, exclusiveMinimum: 0, maximum: 1 }
    OnlineBulletinLayoutManifest:
      description: Revision-owned manifest; hashes bind the authoritative isolated-worker measurement. Empty validation hashes represent a pending draft, never permission to publish.
      type: object
      additionalProperties: false
      required: [templateVersion, rendererVersion, rendererArtifactSha256, assets, pages]
      properties:
        templateVersion: { type: string, enum: [v1, v2] }
        rendererVersion: { type: string, enum: [v1, v2, v3, v4, v5, v6, v7, v8, v9, v10, v11], description: Adaptive renderers retain the v1 Traditional or v2 Simplified template. V4 permits a safe 24-point bottom margin for dense body pages; V5 extends this to complete covers. V6 adds historical four-row cover profiles; V7 preserves proportional inline font sizes during cover composition. V8 fits titles at normal tracking and keeps heading-speaker rows and cover date-issue rows together. V9 consumes an immutable issue-owned template snapshot. V10 reuses V9 paper rendering and adds bounded measured dense-cover composition with separate long title/subtitle rows and a 9-point cover text floor. Existing published renderer versions remain immutable. }
        rendererArtifactSha256: { $ref: '#/components/schemas/OnlineBulletinHash' }
        contentHash: { $ref: '#/components/schemas/OnlineBulletinHash' }
        layoutValidationHash: { $ref: '#/components/schemas/OnlineBulletinHash' }
        assets:
          type: array
          minItems: 1
          maxItems: 64
          items: { $ref: '#/components/schemas/OnlineBulletinAsset' }
        pages:
          type: array
          minItems: 4
          maxItems: 40
          items: { $ref: '#/components/schemas/OnlineBulletinLayoutPage' }
    OnlineBulletinAsset:
      description: Code-owned permanent self-hosted asset, never an executable URL. Filename includes its exact SHA-256.
      type: object
      additionalProperties: false
      required: [url, sha256, kind]
      properties:
        url: { type: string, pattern: '^/assets/weekly/v[12]/[a-zA-Z0-9_-]*[0-9a-f]{64}\.(woff2|png|svg|webp)$' }
        sha256: { $ref: '#/components/schemas/OnlineBulletinHash' }
        kind: { type: string, enum: [font, decoration] }
        fontRole: { $ref: '#/components/schemas/OnlineBulletinFontRole' }
    OnlineBulletinLayoutPage:
      type: object
      additionalProperties: false
      required: [pageId, slots]
      properties:
        pageId: { $ref: '#/components/schemas/OnlineBulletinID' }
        fixedSlots:
          type: array
          maxItems: 128
          items: { $ref: '#/components/schemas/OnlineBulletinFixedSlot' }
        slots:
          type: array
          maxItems: 50000
          items: { $ref: '#/components/schemas/OnlineBulletinSlot' }
    OnlineBulletinSlot:
      type: object
      additionalProperties: false
      required: [id, componentId, blockId, box, fragments]
      properties:
        id: { $ref: '#/components/schemas/OnlineBulletinID' }
        componentId: { $ref: '#/components/schemas/OnlineBulletinID' }
        blockId: { $ref: '#/components/schemas/OnlineBulletinID' }
        box: { $ref: '#/components/schemas/OnlineBulletinBox' }
        continuationOf: { $ref: '#/components/schemas/OnlineBulletinID' }
        fragments:
          type: array
          minItems: 1
          maxItems: 1024
          items: { $ref: '#/components/schemas/OnlineBulletinFragment' }
    OnlineBulletinFixedSlot:
      description: Template-owned geometry for a fixed label or canonical metadata reference. It contains no editable text or executable URL.
      type: object
      additionalProperties: false
      required: [id, element, box, style]
      properties:
        id: { $ref: '#/components/schemas/OnlineBulletinID' }
        element:
          type: string
          enum: [title, subtitle, date, issueNumber, pageNumber, masthead, vision, visionMission, visionFellowship, visionCommitment, historicalVision, historicalGoals, historicalGospelGoals, historicalActions, historicalCommitment, pastor, contact, scanHint, websiteQRLabel, youtubeQRLabel, streamQRLabel, welcomeLabel, worshipLabel, workLabel, wordLabel, verseLabel, hymnLabel, summaryLabel, summarySidebarTitle, summarySidebarTagline, announcementsLabel, prayersLabel, titleLabel, speakerLabel, speakerSeparator, lectureDateMarker, bodyIssueSummary, bodySpeakerLabel, transcriberLabel, editorLabel, authorLabel, logo, backgroundLogo, websiteQR, youtubeQR, streamQR, topRule, footerRule, summaryFrame, announcementsFrame, prayersFrame]
          description: Historical elements require rendererVersion v6, v7 or v8; historicalGospelGoals preserves the reviewed native gospel-wording variant instead of substituting historicalGoals.
        box: { $ref: '#/components/schemas/OnlineBulletinBox' }
        style: { $ref: '#/components/schemas/OnlineBulletinParagraphStyle' }
    OnlineBulletinCanonicalMetadata:
      description: Read-only snapshot of existing CMS fields, separate from editable document content.
      type: object
      additionalProperties: false
      required: [title, subtitle, issueNumber, date]
      properties:
        title: { type: string, minLength: 1, maxLength: 256 }
        subtitle: { type: string, maxLength: 256 }
        issueNumber: { type: integer, minimum: 1 }
        date: { type: string, format: date }
    OnlineBulletinFragment:
      description: Half-open offsets in Unicode code points, not UTF-8 bytes or UTF-16 units. Coverage must be complete and non-overlapping in reading order.
      type: object
      additionalProperties: false
      required: [sentenceId, start, end]
      properties:
        sentenceId: { $ref: '#/components/schemas/OnlineBulletinID' }
        start: { type: integer, minimum: 0, maximum: 4095 }
        end: { type: integer, minimum: 1, maximum: 4096 }
    OnlineBulletinSpan:
      type: object
      additionalProperties: false
      required: [text, fontRole]
      properties:
        text: { type: string, minLength: 1, maxLength: 4096 }
        fontRole: { $ref: '#/components/schemas/OnlineBulletinFontRole' }
        fontSize: { type: [number, 'null'], minimum: 6, maximum: 96, description: Optional source PDF-point size for mixed-size inline runs. Missing or null inherits the block size; mobile retains the proportional em ratio. }
    OnlineBulletinSentence:
      description: Dynamic sentence anchor. The canonical- ID prefix is reserved for shared canonical metadata anchors across layouts.
      type: object
      additionalProperties: false
      required: [id, spans]
      properties:
        id: { $ref: '#/components/schemas/OnlineBulletinID' }
        spans:
          type: array
          minItems: 1
          maxItems: 32
          items: { $ref: '#/components/schemas/OnlineBulletinSpan' }
        source:
          readOnly: true
          description: Server-owned PDF provenance; forbidden in component edit requests.
          type: object
          additionalProperties: false
          required: [page, box]
          properties:
            page: { type: integer, minimum: 1, maximum: 40 }
            box: { $ref: '#/components/schemas/OnlineBulletinBox' }
    OnlineBulletinParagraphStyle:
      description: Font size and line height in PDF points. Indents and spacing in em units; negative first-line indentation supports hanging paragraphs.
      type: object
      additionalProperties: false
      required: [fontSize, lineHeight, indent, firstLineIndent, spaceBefore, spaceAfter]
      properties:
        fontSize: { type: number, minimum: 6, maximum: 96 }
        lineHeight: { type: number, minimum: 6, maximum: 192 }
        letterSpacing: { type: number, minimum: -0.5, maximum: 1, description: Explicit source tracking in em; omitted means zero. Never adjusted automatically to fit edits. }
        align: { type: string, enum: [left, center, right, justify] }
        indent: { type: number, minimum: 0, maximum: 20 }
        firstLineIndent: { type: number, minimum: -20, maximum: 20 }
        spaceBefore: { type: number, minimum: 0, maximum: 20 }
        spaceAfter: { type: number, minimum: 0, maximum: 20 }
    OnlineBulletinBlock:
      type: object
      additionalProperties: false
      required: [id, style, sentences]
      properties:
        id: { $ref: '#/components/schemas/OnlineBulletinID' }
        style: { $ref: '#/components/schemas/OnlineBulletinParagraphStyle' }
        sentences:
          type: array
          minItems: 1
          maxItems: 1024
          items: { $ref: '#/components/schemas/OnlineBulletinSentence' }
