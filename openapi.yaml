  /admin/bulletins/{issueId}/online/general/zh-Hant/recover-publication:
    post:
      operationId: recoverOnlineBulletinPublication
      summary: Publish an existing qualified Traditional online draft
      description: Capability-gated synchronous CMS transaction. Requires current human publication scope, exact source/canonical/Local and immutable semantic and measured layout evidence. Never queues extraction or layout, never creates notifications, and preserves original authorizer evidence. Successful recovery may trigger the existing Simplified derivation. The same actor/key/input replays its original receipt after withdrawal without republishing; changed input conflicts. Qualification conflicts return sanitized meta.blockers. All responses are private, no-store.
      tags: [Admin]
      x-hhc-visibility: admin
      x-hhc-callers: [api-gateway]
      x-hhc-cache: 'private, no-store'
      x-required-scopes: [cms:bulletins:publish]
      security: [{ daprApiToken: [], daprCallerAppId: [], trustedUserId: [], trustedAuthProvider: [], trustedScopes: [] }]
      servers: [{ url: https://admin.alive.org.tw/api }]
      parameters:
        - { name: issueId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: If-Match, in: header, required: true, schema: { type: string, pattern: '^"[1-9][0-9]*"$' } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 128 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OnlineBulletinRecoveryInput' }
      responses:
        '200':
          description: Immutable recovery receipt and original publication outcome
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta, error]
                properties:
                  data: { $ref: '#/components/schemas/OnlineBulletinRecoveryResult' }
                  meta: { type: object, additionalProperties: true }
                  error: { type: 'null' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/AdminUnauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '404': { $ref: '#/components/responses/Error' }
        '409':
          description: CAS/key conflict or sanitized saved-draft qualification blockers
          content:
            application/json:
              schema:
                anyOf:
                  - { $ref: '#/components/schemas/OnlineBulletinRecoveryBlockedEnvelope' }
                  - { $ref: '#/components/schemas/ErrorEnvelope' }
        '428': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /admin/bulletins/{issueId}/online/general/zh-Hans/recover-publication:
    post:
      operationId: recoverSimplifiedOnlineBulletinPublication
      summary: Publish an existing qualified Simplified online draft
      description: Default-off capability gates new human publication grants for exact saved Simplified conversion, semantic assessment and measured layout proof from an immutable Traditional Published source. Requires current publish permission, targetDocumentId, canonical and source/target CAS. No conversion, OCR, layout, Asset or notification work is created. The original automatic operation authorizer and terminal cause remain history. Exact actor/key/input replay returns the original immutable receipt before all live source/Local/capability eligibility gates; it is historical and never proves current availability. All responses are private, no-store. Idempotency keys are 1..128 UTF-8 bytes, reject leading/trailing Unicode whitespace and ASCII controls, and are never normalized. Duplicate key headers are invalid.
      tags: [Admin]
      x-hhc-visibility: admin
      x-hhc-callers: [api-gateway]
      x-hhc-cache: 'private, no-store'
      x-required-scopes: [cms:bulletins:publish]
      security: [{ daprApiToken: [], daprCallerAppId: [], trustedUserId: [], trustedAuthProvider: [], trustedScopes: [] }]
      servers: [{ url: https://admin.alive.org.tw/api }]
      parameters:
        - { name: issueId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: If-Match, in: header, required: true, schema: { type: string, pattern: '^"[1-9][0-9]*"$' } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 128 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OnlineBulletinSimplifiedRecoveryRequest' }
      responses:
        '200':
          description: Immutable recovery receipt and original publication outcome
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta, error]
                properties:
                  data: { $ref: '#/components/schemas/OnlineBulletinSimplifiedRecoveryResult' }
                  meta: { type: object, additionalProperties: true }
                  error: { type: 'null' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/AdminUnauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '404': { $ref: '#/components/responses/Error' }
        '409':
          description: CAS/key conflict or sanitized saved-draft qualification blockers
          content:
            application/json:
              schema:
                anyOf:
                  - { $ref: '#/components/schemas/OnlineBulletinSimplifiedRecoveryBlockedEnvelope' }
                  - { $ref: '#/components/schemas/ErrorEnvelope' }
        '412': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
