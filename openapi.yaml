  /member/recordings:
    get:
      operationId: listMemberRecordings
      summary: List or search published recordings after membership and video entitlement checks
      tags: [Authenticated]
      x-hhc-visibility: authenticated
      x-hhc-callers: [api-gateway]
      x-hhc-cache: 'private, no-store'
      security: [{ daprApiToken: [], daprCallerAppId: [], trustedUserId: [], trustedAuthProvider: [], trustedScopes: [] }]
      description: Without limit, retains the legacy array response. With limit, returns uploadedAt DESC and id DESC keyset batches and meta.nextCursor (null at exhaustion). Empty batches may still carry a cursor when media is no longer available; continue until nextCursor is null. Every batch rechecks current visibility and ready media. durationSeconds describes the verified public range for B1 broadcasts and the ready package duration for standalone recordings. B1 items without a ready public duration are omitted instead of exposing the private raw-capture duration. q normalizes Unicode whitespace and case, splits into words, and requires every word to occur literally in the title or description. Nonempty q requires limit. Search is applied before the batch limit. Cursor binds the normalized query digest and sort version; legacy cursors are accepted only without a query. Duplicate q values and malformed queries are rejected.
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 }, description: Enable batched reads; required when cursor is supplied. }
        - { name: cursor, in: query, schema: { type: string, maxLength: 256 }, description: Opaque nextCursor from the previous batch for the same normalized q; requires limit. }
        - { name: q, in: query, schema: { type: string, maxLength: 100 }, description: Optional literal title/description search; maximum 100 normalized Unicode code points. Empty query retains ordinary listing. }
      responses:
        '200': { description: Authorized recent recordings, content: { application/json: { schema: { $ref: '#/components/schemas/RecordingListEnvelope' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/AdminUnauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
