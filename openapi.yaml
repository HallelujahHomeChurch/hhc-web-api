      type: object
      additionalProperties: false
      required: [explicitOnlinePublication, qualifiedDraftRecovery]
      properties:
        explicitOnlinePublication: { type: boolean, description: Inactive until every publisher and worker supports durable intent epochs. }
        qualifiedDraftRecovery: { type: boolean }
        simplifiedPublicationRecovery: { type: boolean, description: Default-off dedicated saved-proof Simplified recovery capability. }
    PublicationDisposition:
      type: object
      additionalProperties: false
      description: Latest append-only disposition for a known intent. Omitted for legacy history without evidence; a false autoPublish flag never implies a historical cancellation reason.
      required: [intentId, epoch, status, reasonCode, changedAt, canonicalVersion, sourceAssetId, sourceChecksum]
      properties:
        intentId: { type: string, format: uuid }
        epoch: { type: integer, format: int64, minimum: 1 }
        status: { type: string, enum: [authorized, running, completed, cancelled, superseded, failed] }
        reasonCode: { type: string, enum: [automatic_authorized, automatic_running, automatic_published, pdf_only, source_replaced, canonical_edited, draft_edited, explicit_draft, unpublished, manual_published, recovery_authorized, recovery_started, recovery_published, processing_failed, manual_state_change] }
        changedAt: { type: string, format: date-time }
        canonicalVersion: { type: integer, format: int64, minimum: 1 }
        sourceAssetId: { type: string }
        sourceChecksum: { type: string, pattern: '^([0-9a-f]{64})?$' }
        documentId: { type: string, format: uuid }
        revision: { type: integer, format: int64, minimum: 1 }
        receiptId: { type: string, format: uuid }
    OnlineBulletinRecoveryBlocker:
      type: string
      enum: [missing_local, pdf_not_published, source_changed, stale_metadata, review_required, incompatible_proof, layout_not_ready, semantic_proof_missing]
    OnlineBulletinRecoveryBlockedEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta, error]
      properties:
        data: { type: 'null' }
        meta:
          type: object
          additionalProperties: false
          required: [blockers]
          properties:
            blockers: { type: array, minItems: 1, maxItems: 8, uniqueItems: true, items: { $ref: '#/components/schemas/OnlineBulletinRecoveryBlocker' } }
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code: { const: recovery_blocked, type: string }
            message: { type: string }
    OnlineBulletinRecoveryInput:
      type: object
      additionalProperties: false
      required: [canonicalVersion, revision, layoutValidationHash]
      properties:
        canonicalVersion: { type: integer, format: int64, minimum: 1 }
        revision: { type: integer, format: int64, minimum: 1 }
        layoutValidationHash: { type: string, pattern: '^[0-9a-f]{64}$' }
    OnlineBulletinRecoveryReceipt:
      type: object
      additionalProperties: false
      required: [id, operationKey, documentId, revision, canonicalVersion, onlineVersion, layoutValidationHash, outcome, createdAt]
      properties:
        id: { type: string, format: uuid }
        operationKey: { type: string, minLength: 1, maxLength: 128 }
        documentId: { type: string, format: uuid }
        revision: { type: integer, format: int64, minimum: 1 }
        canonicalVersion: { type: integer, format: int64, minimum: 1 }
        onlineVersion: { type: integer, format: int64, minimum: 1 }
        layoutValidationHash: { type: string, pattern: '^[0-9a-f]{64}$' }
        outcome: { type: string, enum: [published] }
        createdAt: { type: string, format: date-time }
