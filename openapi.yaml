        - $ref: '#/components/parameters/ContentID'
        - { name: assetId, in: path, required: true, schema: { type: string } }
      responses:
        '401': { $ref: '#/components/responses/AdminUnauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '200':
          description: News cover scan and processing status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssetStatusEnvelope' }
  /admin/content/news/{contentId}/assets/{assetId}/scan/retry:
    post:
      operationId: retryNewsCoverScan
      summary: Retry news cover scan
      tags: [Admin]
      x-hhc-visibility: admin
      x-hhc-callers: [api-gateway]
      security: [{ daprApiToken: [], daprCallerAppId: [], trustedUserId: [], trustedAuthProvider: [], trustedScopes: [] }]
      servers: [{ url: https://admin.alive.org.tw/api }]
      x-required-scopes: ['cms:write', 'assets:write']
      parameters:
        - { name: contentId, in: path, required: true, schema: { type: string } }
        - { name: assetId, in: path, required: true, schema: { type: string } }
      responses:
        '401': { $ref: '#/components/responses/AdminUnauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '200':
          description: News cover scan requeued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssetStatusEnvelope' }
