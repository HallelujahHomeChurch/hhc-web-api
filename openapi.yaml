openapi: 3.1.0
info:
  title: HHC Web API
  version: 0.2.0
  description: |-
    Website API owns CMS records and publication state; asset-api owns file bytes, scanning, derivatives, and grants.
    Campaign routes are authorization-preserving proxies to engagement-api, which owns campaign and consent state.
    Structured online bulletins start at issue 1739. Earlier issues retain PDF discovery/downloads and private immutable revision history, but online reader access, new extraction, Simplified conversion and online publication return 404. Discovery omits only their online projections, not their PDFs. Existing offline receipts are neither rewritten nor extended.
tags:
  - name: Public
    description: Published website projections exposed through api-gateway.
  - name: Admin
    description: CMS administration exposed through api-gateway and authorized by trusted Account identity headers.
  - name: Authenticated
    description: Signed-in application projections exposed through api-gateway.
  - name: Private
    description: Direct Dapr service-to-service operations.
  - name: Operations
    description: Direct service health and readiness endpoints used by platform probes.
x-hhc-service: hhc-web-api
x-hhc-owner: HHC Platform
x-hhc-repository: HallelujahHomeChurch/hhc-web-api
servers:
  - url: https://www.alive.org.tw/api
    description: Public and admin gateway surface; api-gateway validates browser JWTs and injects trusted identity headers.
paths:
  /video-previews/{publicId}:
    parameters:
      - name: publicId
        in: path
        required: true
        schema: { type: string, pattern: '^[A-Za-z0-9_-]{11}$' }
    get:
      operationId: getVideoSharePreview
      summary: Public title for one eligible recording or announced broadcast
      description: Public share allowlist only. No membership required. Includes announced draft broadcasts waiting for input; announcement does not grant playback access. Hidden, deleted, expired, terminal, unannounced, revoked and cancelled content returns 404; uploads and archived broadcasts still require a published, ready recording. No list endpoint. noindex does not prevent bot retrieval.
      tags: [Public]
      x-hhc-visibility: public
      x-hhc-callers: [api-gateway, hhc-web]
      x-hhc-cache: no-store
      security: []
      responses:
        '200':
          description: Public title only; no description or media grants
          headers:
            Link:
              schema: { type: string }
              description: Optional same-site canonical /video/{publicId}, only for currently eligible recordings with an assigned public ID.
            X-Robots-Tag:
              schema: { type: string }
              description: noindex, nofollow, noarchive
          content:
            application/json:
              schema:
                type: object
                required: [data, meta, error]
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    required: [title]
                    properties:
                      title: { type: string, maxLength: 180 }
                  meta: { type: object }
                  error: { type: 'null' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /video-previews/{publicId}/cover:
    parameters:
      - name: publicId
        in: path
        required: true
        schema: { type: string, pattern: '^[A-Za-z0-9_-]{11}$' }
    get:
      operationId: getVideoShareCover
      summary: Public selected cover for one eligible recording or announced broadcast
      description: Uses the same current share eligibility as the title preview, including announced draft broadcasts before capture. Automatic live covers use the fixed branding JPEG; custom covers require the selected ready image. No playback grant or alternative cover access. The image can be retrieved by any client and cached by sharing services.
      tags: [Public]
      x-hhc-visibility: public
      x-hhc-callers: [api-gateway, hhc-web]
      x-hhc-cache: no-store
      security: []
      responses:
        '200':
          description: Selected JPEG cover with no-store and noindex headers
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
