openapi: 3.1.0
info:
  title: HHC Web API
  version: 0.2.0
  description: |-
    Website API owns CMS records and publication state; asset-api owns file bytes, scanning, derivatives, and grants.
    Campaign routes are authorization-preserving proxies to engagement-api, which owns campaign and consent state.
tags:
  - name: Public
    description: Published website projections exposed through api-gateway.
  - name: Admin
    description: CMS administration exposed through api-gateway and authorized by trusted Account identity headers.
  - name: Authenticated
    description: Signed-in application projections exposed through api-gateway.
  - name: Private
    description: Direct Dapr service-to-service operations.
  - name: Operations
    description: Direct service health and readiness endpoints used by platform probes.
x-hhc-service: hhc-web-api
x-hhc-owner: HHC Platform
x-hhc-repository: HallelujahHomeChurch/hhc-web-api
servers:
  - url: https://www.alive.org.tw/api
    description: Public and admin gateway surface; api-gateway validates browser JWTs and injects trusted identity headers.
paths:
  /health:
    get:
      operationId: getHealth
      summary: Get health
      tags: [Operations]
      x-hhc-visibility: operations
      x-hhc-callers: []
      security: []
      servers: [{ url: / }]
      responses:
        '200': { $ref: '#/components/responses/Health' }
  /health/live:
    get:
      operationId: getLiveness
      summary: Get liveness
      tags: [Operations]
      x-hhc-visibility: operations
      x-hhc-callers: []
      security: []
      servers: [{ url: / }]
      responses:
        '200': { $ref: '#/components/responses/Health' }
  /ready:
    get:
      operationId: getReadiness
      summary: Get readiness
      tags: [Operations]
      x-hhc-visibility: operations
      x-hhc-callers: []
      security: []
      servers: [{ url: / }]
      responses:
        '200': { $ref: '#/components/responses/Health' }
        '503': { $ref: '#/components/responses/Error' }
  /health/ready:
    get:
      operationId: getHealthReadiness
      summary: Get health readiness
      tags: [Operations]
      x-hhc-visibility: operations
      x-hhc-callers: []
      security: []
      servers: [{ url: / }]
      responses:
        '200': { $ref: '#/components/responses/Health' }
        '503': { $ref: '#/components/responses/Error' }
  /meetings:
    get:
      operationId: listPublicMeetings
      summary: List public meetings
      tags: [Public]
      x-hhc-visibility: public
      x-hhc-callers: [api-gateway]
      x-hhc-required-headers: [If-None-Match]
      x-hhc-cache: 'public, max-age=30'
      security: []
      parameters: [{ $ref: '#/components/parameters/IfNoneMatch' }]
      responses:
        '200': { $ref: '#/components/responses/PublicMeetingList' }
        '304': { $ref: '#/components/responses/MeetingNotModified' }
        '500': { $ref: '#/components/responses/Error' }
  /meetings/{meetingKey}:
    parameters:
      - $ref: '#/components/parameters/MeetingKey'
    get:
      operationId: getPublicMeeting
      summary: Get a public meeting
      tags: [Public]
      x-hhc-visibility: public
      x-hhc-callers: [api-gateway]
      x-hhc-required-headers: [If-None-Match]
      x-hhc-cache: 'public, max-age=30'
      security: []
      parameters: [{ $ref: '#/components/parameters/IfNoneMatch' }]
      responses:
        '200': { $ref: '#/components/responses/PublicMeeting' }
        '304': { $ref: '#/components/responses/MeetingNotModified' }
        '404': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
