        '503': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    daprApiToken:
      type: apiKey
      in: header
      name: dapr-api-token
      description: Dapr API token supplied by api-gateway; the value is never published in this contract.
    daprCallerAppId:
      type: apiKey
      in: header
      name: Dapr-Caller-App-Id
      description: Must identify the configured api-gateway Dapr application.
    trustedUserId:
      type: apiKey
      in: header
      name: X-HHC-User-ID
      description: Sanitized Account user identifier injected by api-gateway.
    trustedAuthProvider:
      type: apiKey
      in: header
      name: X-HHC-Auth-Provider
      description: Must be account-api.
    trustedScopes:
      type: apiKey
      in: header
      name: X-HHC-Scopes
      description: Sanitized Account scopes injected by api-gateway and enforced per operation.
  parameters:
    ContentLocale: { name: locale, in: query, schema: { $ref: '#/components/schemas/ContentLocale' } }
    BulletinEdition: { name: locale, in: query, schema: { $ref: '#/components/schemas/BulletinEdition' } }
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, maximum: 10000, default: 1 } }
    PageSize: { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
    PerPage: { name: perPage, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
    SearchQuery:
      name: q
      in: query
      description: Searches the internal campaign name and localized subject or body.
      schema: { type: string, maxLength: 120 }
    IssueID: { name: issueId, in: path, required: true, schema: { type: string, format: uuid } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1 } }
    IfMatch: { name: If-Match, in: header, required: true, schema: { type: string, pattern: '^"[1-9][0-9]*"$' } }
    IfNoneMatch:
      name: If-None-Match
      in: header
      description: Conditional validator; weak validators and comma-separated lists are accepted.
      schema: { type: string }
    ContentModule: { name: module, in: path, required: true, schema: { $ref: '#/components/schemas/ContentModule' } }
    PublicationContentModule: { name: module, in: path, required: true, schema: { $ref: '#/components/schemas/PublicationContentModule' } }
    CreatableContentModule: { name: module, in: path, required: true, schema: { $ref: '#/components/schemas/CreatableContentModule' } }
    TranslatableContentModule: { name: module, in: path, required: true, schema: { $ref: '#/components/schemas/TranslatableContentModule' } }
    PageKey: { name: pageKey, in: path, required: true, schema: { type: string, enum: [home, about, privacy-policy, terms-of-use] } }
    ContentID: { name: contentId, in: path, required: true, schema: { type: string, format: uuid } }
    ContentTranslationTargetLocale: { name: targetLocale, in: path, required: true, schema: { $ref: '#/components/schemas/ContentTranslationTargetLocale' } }
    BulletinTranslationTargetEdition: { name: targetLocale, in: path, required: true, schema: { $ref: '#/components/schemas/BulletinTranslationTargetEdition' } }
    CampaignTranslationTargetLocale: { name: targetLocale, in: path, required: true, schema: { $ref: '#/components/schemas/CampaignTranslationTargetLocale' } }
    Revision: { name: revision, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    MeetingKey: { name: meetingKey, in: path, required: true, schema: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' } }
    OperationsID: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    StatusAction: { name: action, in: path, required: true, schema: { type: string, enum: [pause, resume, archive, restore] } }
    OccurrenceDate: { name: occurrenceDate, in: path, required: true, schema: { type: string, format: date } }
    IncludeArchived: { name: includeArchived, in: query, schema: { type: boolean, default: false } }
    RangeFrom: { name: from, in: query, schema: { type: string, format: date-time }, description: Inclusive range start; defaults to now. }
    RangeTo: { name: to, in: query, schema: { type: string, format: date-time }, description: Exclusive range end; defaults to 30 days after from and cannot exceed 90 days. }
  requestBodies:
    ChurchUnitInput:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/ChurchUnitInput' } } }
    OperationsResourceInput:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/OperationsResourceInput' } } }
    MeetingInput:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/MeetingInput' } } }
    MeetingOccurrenceOverrideInput:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/MeetingOccurrenceOverrideInput' } } }
    MeetingCollectionBindings:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/MeetingCollectionBindings' } } }
    PublicationInput:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PublicationInput' }
    ContentWriteInput:
      required: true
      content:
        application/json:
          schema:
            anyOf:
              - $ref: '#/components/schemas/ContentWriteInput'
              - $ref: '#/components/schemas/HomePageWriteInputV2'
    TranslationPreviewInput:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/TranslationPreviewInput' }
  responses:
    PublicMeetingList:
      description: Public meeting list; no internal IDs, bindings, or audit fields.
      headers: { ETag: { schema: { type: string } }, Cache-Control: { schema: { type: string, const: 'public, max-age=30' } } }
      content: { application/json: { schema: { $ref: '#/components/schemas/PublicMeetingListEnvelope' } } }
    PublicMeeting:
      description: Public meeting; no internal IDs, bindings, or audit fields.
      headers: { ETag: { schema: { type: string } }, Cache-Control: { schema: { type: string, const: 'public, max-age=30' } } }
      content: { application/json: { schema: { $ref: '#/components/schemas/PublicMeetingEnvelope' } } }
    PublicMeetingOccurrenceList:
      description: Public meeting occurrences including cancelled occurrences.
      headers: { ETag: { schema: { type: string } }, Cache-Control: { schema: { type: string, const: 'public, max-age=30' } } }
      content: { application/json: { schema: { $ref: '#/components/schemas/PublicMeetingOccurrenceListEnvelope' } } }
    MeetingNotModified:
      description: The public meeting projection has not changed.
      headers: { ETag: { schema: { type: string } }, Cache-Control: { schema: { type: string, const: 'public, max-age=30' } } }
    MediaSyncWindowList:
      description: Redacted media sync windows.
      headers: { Cache-Control: { schema: { type: string, const: 'private, no-store' } } }
      content: { application/json: { schema: { $ref: '#/components/schemas/MediaSyncWindowListEnvelope' } } }
    MeetingOccurrenceList:
      description: Internal meeting occurrences without collection bindings.
      headers: { Cache-Control: { schema: { type: string, const: 'private, no-store' } } }
      content: { application/json: { schema: { $ref: '#/components/schemas/MeetingOccurrenceListEnvelope' } } }
    ChurchUnitList:
      description: Church unit list.
      content: { application/json: { schema: { $ref: '#/components/schemas/ChurchUnitListEnvelope' } } }
    ChurchUnit:
      description: Church unit.
      headers: { ETag: { schema: { type: string } } }
      content: { application/json: { schema: { $ref: '#/components/schemas/ChurchUnitEnvelope' } } }
    OperationsResourceList:
      description: Operations resource list.
      content: { application/json: { schema: { $ref: '#/components/schemas/OperationsResourceListEnvelope' } } }
    OperationsResource:
      description: Operations resource.
      headers: { ETag: { schema: { type: string } } }
      content: { application/json: { schema: { $ref: '#/components/schemas/OperationsResourceEnvelope' } } }
    MeetingList:
      description: Administrative meeting list.
      content: { application/json: { schema: { $ref: '#/components/schemas/MeetingListEnvelope' } } }
    Meeting:
      description: Meeting mutation result.
      headers: { ETag: { schema: { type: string } } }
      content: { application/json: { schema: { $ref: '#/components/schemas/MeetingMutationEnvelope' } } }
    MeetingDetail:
      description: Administrative meeting detail with overrides and collection bindings.
      headers: { ETag: { schema: { type: string } } }
      content: { application/json: { schema: { $ref: '#/components/schemas/MeetingDetailEnvelope' } } }
    MeetingOccurrenceOverride:
      description: Meeting occurrence override.
      headers: { ETag: { schema: { type: string } } }
      content: { application/json: { schema: { $ref: '#/components/schemas/MeetingOccurrenceOverrideEnvelope' } } }
    Health:
      description: Service process is healthy or ready.
      content:
        application/json:
          schema:
            type: object
            required: [data, meta, error]
            properties:
              data:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [healthy, ready] }
              meta: { type: object }
              error: { type: 'null' }
    BulletinIssue:
      description: Bulletin issue
      headers:
        ETag: { schema: { type: string } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/BulletinIssueEnvelope' }
    PublicBulletin:
      description: Published bulletin
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PublicBulletinEnvelope' }
    Error:
      description: Standard API error envelope
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    AdminUnauthorized:
      description: Trusted gateway identity is missing or invalid.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    AdminForbidden:
      description: The trusted Account identity lacks a required scope.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Campaign:
      description: Engagement-owned campaign response forwarded unchanged.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CampaignEnvelope' }
    CampaignPage:
      description: Engagement-owned campaign page forwarded unchanged.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CampaignPageEnvelope' }
    CampaignDeliveryPage:
      description: Engagement-owned campaign delivery page forwarded unchanged.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CampaignDeliveryPageEnvelope' }
    CampaignSchedule:
      description: Engagement-owned campaign schedule forwarded unchanged.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CampaignScheduleEnvelope' }
    CampaignScheduleList:
      description: Engagement-owned campaign schedule list forwarded unchanged.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CampaignScheduleListEnvelope' }
    EngagementError:
      description: Engagement API rejected or could not complete the proxied request.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/EngagementErrorEnvelope' }
    EngagementUnavailable:
      description: Engagement API is unavailable locally or reports that it is not ready.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/EngagementUnavailableEnvelope' }
    ContentItem:
      description: Typed content item
      headers:
        ETag: { schema: { type: string } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ContentItemEnvelope' }
    PublicContentList:
      description: Published localized content
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PublicContentListEnvelope' }
    PublicContentItem:
      description: Published localized content item
      headers:
        ETag: { schema: { type: string } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PublicContentItemEnvelope' }
    PublicLocationList:
      description: Published locations for the exact requested locale.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PublicLocationListEnvelope' }
    PublicEditorialPage:
      description: Published fixed editorial page for the exact requested locale.
      headers:
        ETag: { schema: { type: string } }
        Cache-Control: { schema: { type: string, const: 'public, max-age=30, must-revalidate' } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PublicEditorialPageEnvelope' }
    PublicEditorialPageNotModified:
      description: The fixed editorial page has not changed.
      headers:
        ETag: { schema: { type: string } }
        Cache-Control: { schema: { type: string, const: 'public, max-age=30, must-revalidate' } }
    SiteLayout:
      description: Published Site Layout for the exact requested locale.
      headers:
        ETag: { $ref: '#/components/headers/SiteLayoutETag' }
        Cache-Control: { $ref: '#/components/headers/SiteLayoutCacheControl' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SiteLayoutEnvelope' }
    SiteLayoutNotModified:
      description: Site Layout has not changed.
      headers:
        ETag: { $ref: '#/components/headers/SiteLayoutETag' }
        Cache-Control: { $ref: '#/components/headers/SiteLayoutCacheControl' }
    SiteSettings:
      description: Site Settings aggregate.
      headers:
        ETag: { schema: { type: string } }
        Cache-Control: { schema: { type: string, const: 'private, no-store' } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SiteSettingsEnvelope' }
    SiteSettingsRevisionList:
      description: Site Settings revision list.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SiteSettingsRevisionListEnvelope' }
    ContentTranslationPreview:
      description: Review-only generated translation preview; no CMS state is changed.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ContentTranslationPreviewEnvelope' }
    BulletinTranslationPreview:
      description: Review-only generated bulletin edition preview; no CMS state is changed.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/BulletinTranslationPreviewEnvelope' }
    CampaignTranslationPreview:
      description: Review-only generated campaign translation preview; no campaign or schedule state is changed.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CampaignTranslationPreviewEnvelope' }
    InvalidTranslationRequest:
      description: invalid_translation_request
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    TranslationNotFound:
      description: not_found
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    TranslationExists:
      description: translation_exists
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    TranslationVersionMismatch:
      description: version_mismatch
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    TranslationRateLimited:
      description: translation_rate_limited
      headers:
        Retry-After:
          description: Integer seconds until the caller may retry this translation target.
          schema: { type: integer, minimum: 1 }
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    TranslationContentFiltered:
      description: translation_content_filtered
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    TranslationProviderError:
      description: translation_provider_error
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    TranslationDisabled:
      description: translation_disabled
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    TranslationTimeout:
      description: translation_timeout
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
  headers:
    SiteLayoutETag:
      description: Strong validator derived from the published aggregate version.
      schema: { type: string, pattern: '^"site-layout-[1-9][0-9]*"$' }
    SiteLayoutCacheControl:
      description: Public revalidation policy for Site Layout projections.
      schema: { type: string, const: 'public, max-age=30, must-revalidate' }
  schemas:
    OperationsStatus: { type: string, enum: [active, paused, archived] }
    OperationsVisibility: { type: string, enum: [public, internal] }
    MeetingSchedule:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type: { type: string, enum: [weekly, once] }
        daysOfWeek: { type: array, uniqueItems: true, items: { type: integer, minimum: 0, maximum: 6 } }
        startTime: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
        startsAt: { type: string, format: date-time }
    ChurchUnitInput:
      type: object
      required: [key, name]
      properties:
        key: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 2000 }
        parentId: { type: string, format: uuid }
    ChurchUnit:
      allOf:
        - $ref: '#/components/schemas/ChurchUnitInput'
        - type: object
          required: [id, status, version]
          properties:
            id: { type: string, format: uuid }
            status: { $ref: '#/components/schemas/OperationsStatus' }
            version: { type: integer, format: int64, minimum: 1 }
      unevaluatedProperties: false
    OperationsResourceInput:
      type: object
      required: [key, name, kind, churchUnitId, timezone, visibility]
      properties:
        key: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 2000 }
        kind: { type: string, enum: [venue] }
        churchUnitId: { type: string, format: uuid }
        locationContentId: { type: string, format: uuid }
        timezone: { type: string, minLength: 1, maxLength: 100 }
        visibility: { $ref: '#/components/schemas/OperationsVisibility' }
    OperationsResource:
      allOf:
        - $ref: '#/components/schemas/OperationsResourceInput'
        - type: object
          required: [id, reservationEnabled, status, version]
          properties:
            id: { type: string, format: uuid }
            reservationEnabled: { type: boolean, const: false }
            status: { $ref: '#/components/schemas/OperationsStatus' }
            version: { type: integer, format: int64, minimum: 1 }
      unevaluatedProperties: false
    MeetingInput:
      type: object
      required: [key, name, churchUnitId, venueResourceId, timezone, schedule, durationMinutes, visibility]
      properties:
        key: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 2000 }
        churchUnitId: { type: string, format: uuid }
        venueResourceId: { type: string, format: uuid }
        timezone: { type: string, minLength: 1, maxLength: 100 }
        schedule: { $ref: '#/components/schemas/MeetingSchedule' }
        durationMinutes: { type: integer, minimum: 1, maximum: 1440 }
        visibility: { $ref: '#/components/schemas/OperationsVisibility' }
    Meeting:
      allOf:
        - $ref: '#/components/schemas/MeetingInput'
        - type: object
          required: [id, status, version]
          properties:
            id: { type: string, format: uuid }
            status: { $ref: '#/components/schemas/OperationsStatus' }
            version: { type: integer, format: int64, minimum: 1 }
    PublicMeeting:
      type: object
      additionalProperties: false
      required: [key, name, timezone, schedule, durationMinutes]
      properties:
        key: { type: string }
        name: { type: string }
        description: { type: string }
        timezone: { type: string }
        schedule: { $ref: '#/components/schemas/MeetingSchedule' }
        durationMinutes: { type: integer, minimum: 1, maximum: 1440 }
        nextOccurrence: { $ref: '#/components/schemas/PublicMeetingOccurrence' }
    PublicMeetingOccurrence:
      type: object
      additionalProperties: false
      required: [occurrenceId, meetingKey, startsAt, endsAt, status]
      properties:
        occurrenceId: { type: string, format: uuid }
        meetingKey: { type: string }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        status: { type: string, enum: [scheduled, cancelled] }
    MeetingOccurrence:
      type: object
      additionalProperties: false
      required: [occurrenceId, meetingId, meetingKey, churchUnitId, venueResourceId, startsAt, endsAt, status, version]
      properties:
        occurrenceId: { type: string, format: uuid }
        meetingId: { type: string, format: uuid }
        meetingKey: { type: string }
        churchUnitId: { type: string, format: uuid }
        venueResourceId: { type: string, format: uuid }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        status: { type: string, enum: [scheduled, cancelled] }
        version: { type: integer, format: int64, minimum: 1 }
    MeetingOccurrenceOverrideInput:
      type: object
      properties:
        cancelled: { type: boolean }
        startsAt: { type: string, format: date-time }
        durationMinutes: { type: integer, minimum: 1, maximum: 1440 }
        venueResourceId: { type: string, format: uuid }
        reason: { type: string, maxLength: 500 }
    MeetingOccurrenceOverride:
      allOf:
        - $ref: '#/components/schemas/MeetingOccurrenceOverrideInput'
        - type: object
          required: [meetingId, occurrenceDate, cancelled, version]
          properties:
            meetingId: { type: string, format: uuid }
            occurrenceDate: { type: string, format: date }
            version: { type: integer, format: int64, minimum: 1 }
      unevaluatedProperties: false
    MediaSyncWindow:
      type: object
      additionalProperties: false
      required: [startsAt, endsAt]
      properties:
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
    MeetingCollectionBindings:
      type: object
      additionalProperties: false
      required: [collectionIds]
      properties:
        collectionIds: { type: array, uniqueItems: true, maxItems: 1000, items: { type: string, format: uuid } }
    MeetingMutation:
      allOf:
        - $ref: '#/components/schemas/Meeting'
        - type: object
          properties:
            nextOccurrence: { $ref: '#/components/schemas/MeetingOccurrence' }
      unevaluatedProperties: false
    MeetingDetail:
      allOf:
        - $ref: '#/components/schemas/Meeting'
        - type: object
          required: [overrides, collectionIds]
          properties:
            overrides: { type: array, items: { $ref: '#/components/schemas/MeetingOccurrenceOverride' } }
            collectionIds: { type: array, items: { type: string, format: uuid } }
      unevaluatedProperties: false
    PublicMeetingListEnvelope: { type: object, required: [data], properties: { data: { type: array, items: { $ref: '#/components/schemas/PublicMeeting' } } } }
    PublicMeetingEnvelope: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/PublicMeeting' } } }
    PublicMeetingOccurrenceListEnvelope: { type: object, required: [data], properties: { data: { type: array, items: { $ref: '#/components/schemas/PublicMeetingOccurrence' } } } }
    MediaSyncWindowListEnvelope: { type: object, required: [data], properties: { data: { type: array, items: { $ref: '#/components/schemas/MediaSyncWindow' } } } }
    MeetingOccurrenceListEnvelope: { type: object, required: [data], properties: { data: { type: array, items: { $ref: '#/components/schemas/MeetingOccurrence' } } } }
    ChurchUnitListEnvelope: { type: object, required: [data], properties: { data: { type: array, items: { $ref: '#/components/schemas/ChurchUnit' } } } }
    ChurchUnitEnvelope: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/ChurchUnit' } } }
    OperationsResourceListEnvelope: { type: object, required: [data], properties: { data: { type: array, items: { $ref: '#/components/schemas/OperationsResource' } } } }
    OperationsResourceEnvelope: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/OperationsResource' } } }
    MeetingListEnvelope: { type: object, required: [data], properties: { data: { type: array, items: { $ref: '#/components/schemas/Meeting' } } } }
    MeetingMutationEnvelope: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/MeetingMutation' } } }
    MeetingDetailEnvelope: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/MeetingDetail' } } }
    MeetingOccurrenceOverrideEnvelope: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/MeetingOccurrenceOverride' } } }
    CampaignTranslation:
      type: object
      additionalProperties: false
      required: [subject, body]
      properties:
        subject: { type: string, maxLength: 200 }
        body: { type: string, maxLength: 20000 }
        clickBehavior:
          type: string
          enum: [home, url, dismiss]
          description: Web push click behavior. URL requires actionUrl; home and dismiss omit it.
        actionUrl:
          type: string
          maxLength: 2048
          pattern: '^/(?!/).*$'
    CampaignStatus:
      type: string
      enum: [draft, queued, sending, completed, completed_with_failures, failed]
    CampaignDeliverySummary:
      type: object
      additionalProperties: false
      required: [total, pending, processing, submitted, sent, failed, suppressed]
      properties:
        total: { type: integer, minimum: 0 }
        pending: { type: integer, minimum: 0 }
        processing: { type: integer, minimum: 0 }
        submitted: { type: integer, minimum: 0 }
        sent: { type: integer, minimum: 0 }
        failed: { type: integer, minimum: 0 }
        suppressed: { type: integer, minimum: 0 }
    Campaign:
      type: object
      additionalProperties: false
      required: [id, name, audienceType, channel, translations, status, recipientCount, createdBy, createdAt, updatedAt, queuedAt, deliverySummary, version]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 120 }
        audienceType: { type: string, enum: [newsletter, all, role, users] }
        channel: { type: string, enum: [email, web_push] }
        roleId: { type: string, format: uuid }
        userIds:
          type: array
          maxItems: 500
          uniqueItems: true
          items: { type: string, format: uuid }
        translations:
          type: object
          minProperties: 1
          additionalProperties: { $ref: '#/components/schemas/CampaignTranslation' }
        status: { $ref: '#/components/schemas/CampaignStatus' }
        recipientCount: { type: integer, minimum: 0 }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        queuedAt: { type: [string, 'null'], format: date-time }
        deliverySummary: { $ref: '#/components/schemas/CampaignDeliverySummary' }
        version: { type: integer, format: int64, minimum: 1 }
    CampaignPage:
      type: object
      additionalProperties: false
      required: [items, page, perPage, total]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Campaign' } }
        page: { type: integer, minimum: 1 }
        perPage: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }
    CampaignDelivery:
      type: object
      additionalProperties: false
      required: [recipientId, channel, locale, status, attemptCount, updatedAt]
      properties:
        recipientId: { type: string }
        userId: { type: string, format: uuid }
        channel: { type: string, enum: [email, web_push] }
        locale: { type: string }
        status: { type: string, enum: [pending, processing, submitted, sent, failed, suppressed] }
        attemptCount: { type: integer, minimum: 0 }
        failureCode: { type: string }
        updatedAt: { type: string, format: date-time }
    CampaignDeliveryPage:
      type: object
      additionalProperties: false
      required: [items, page, perPage, total, summary, campaignStatus]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/CampaignDelivery' } }
        page: { type: integer, minimum: 1 }
        perPage: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }
        summary: { $ref: '#/components/schemas/CampaignDeliverySummary' }
        campaignStatus: { $ref: '#/components/schemas/CampaignStatus' }
    CampaignSchedule:
      type: object
      additionalProperties: false
      required: [id, name, channel, audienceType, scheduleType, runAt, cronExpression, timezone, translations, enabled, nextRunAt, lastRunAt, createdBy, createdAt, updatedAt, version]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 120 }
        channel: { type: string, enum: [email, web_push] }
        audienceType: { type: string, enum: [newsletter, all, role, users] }
        roleId: { type: string, format: uuid }
        userIds:
          type: array
          maxItems: 500
          uniqueItems: true
          items: { type: string, format: uuid }
        scheduleType: { type: string, enum: [once, cron] }
        runAt: { type: [string, 'null'], format: date-time }
        cronExpression: { type: string }
        timezone: { type: string }
        translations:
          type: object
          minProperties: 1
