      required: [receipt, publication, replayed]
      properties:
        receipt: { $ref: '#/components/schemas/OnlineBulletinRecoveryReceipt' }
        publication: { $ref: '#/components/schemas/OnlineBulletinConfirmedRevision' }
        replayed: { type: boolean, description: Returns the immutable original outcome after withdrawal without publishing again. }
    OnlineBulletinProduction:
      type: object
      description: Admin-only progress currently reports scan, recognition and reconciliation. Layout and publication enum values are reserved; existing layout/publication fields remain the authority for later stages. Verification subphase is reserved. Progress never qualifies content for publication.
      additionalProperties: false
      required: [sourceIdentity, jobId, attemptId, progressVersion, phase, status, totalPages, currentPage, verifiedPages, subphase, startedAt, lastProgressAt, heartbeatAt, observedAt, verifiedReuseCount]
      properties:
        sourceIdentity: { type: string, pattern: '^[0-9a-f]{64}$' }
        jobId: { type: string, format: uuid }
        attemptId: { type: string }
        progressVersion: { type: integer, format: int64, minimum: 1 }
        phase: { type: string, enum: [scan, recognition, reconciliation, layout, publication] }
        status: { type: string, enum: [queued, running, waiting, completed, failed, cancelled, superseded] }
        totalPages: { type: [integer, 'null'], minimum: 1, maximum: 40 }
        currentPage: { type: [integer, 'null'], minimum: 1, maximum: 40 }
        verifiedPages: { type: integer, minimum: 0, maximum: 40 }
        subphase: { type: string, enum: ['', source, recognition, verification, verified, checkpoint_reuse, snapshot_reuse] }
        startedAt: { type: [string, 'null'], format: date-time }
        lastProgressAt: { type: [string, 'null'], format: date-time }
        heartbeatAt: { type: [string, 'null'], format: date-time }
        observedAt: { type: string, format: date-time }
        verifiedReuseCount: { type: integer, minimum: 0, maximum: 40 }
    PublicationInput:
      type: object
      additionalProperties: false
      required: [locale]
      properties:
        series: { $ref: '#/components/schemas/BulletinSeries', default: general }
        locale: { $ref: '#/components/schemas/BulletinLocale' }
        onlinePublication:
          type: string
          enum: [continue_automatic, pdf_only]
          description: Capability-gated explicit choice. Omission rejects active automatic authority. continue_automatic preserves existing exact-source authority only and requires a provably healthy current chain without an owned PDF workflow; otherwise it returns 409. It never grants disabled or absent authority. pdf_only cancels pending automatic online work before starting the independent PDF workflow; if the exact PDF is already published with matching completed workflow evidence, it returns that original completed workflow without republishing or notifying. Existing online publication remains available.
        onlineVersion: { type: integer, format: int64, minimum: 0, description: Only valid and required with pdf_only; zero means no online document exists. }
        notifySubscribers:
          type: boolean
          default: false
          description: Queue one member-only Email and Web Push notification pair for the first notification-enabled publication in this series. Ignored by unpublish operations.
