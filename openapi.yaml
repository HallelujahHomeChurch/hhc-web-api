openapi: 3.1.0
info:
  title: HHC Web API
  version: 0.2.0
  description: |-
    Website API owns CMS records and publication state; asset-api owns file bytes, scanning, derivatives, and grants.
    Campaign routes are authorization-preserving proxies to engagement-api, which owns campaign and consent state.
tags:
  - name: Public
    description: Published website projections exposed through api-gateway.
  - name: Admin
    description: CMS administration exposed through api-gateway and authorized by trusted Account identity headers.
  - name: Operations
    description: Direct service health and readiness endpoints used by platform probes.
x-hhc-service: hhc-web-api
x-hhc-owner: HHC Platform
x-hhc-repository: HallelujahHomeChurch/hhc-web-api
servers:
  - url: https://www.alive.org.tw/api
    description: Public and admin gateway surface; api-gateway validates browser JWTs and injects trusted identity headers.
paths:
  /health:
    get:
      operationId: getHealth
      summary: Get health
      tags: [Operations]
      x-hhc-visibility: operations
      x-hhc-callers: []
      security: []
      servers: [{ url: / }]
      responses:
        '200': { $ref: '#/components/responses/Health' }
  /health/live:
    get:
      operationId: getLiveness
      summary: Get liveness
      tags: [Operations]
      x-hhc-visibility: operations
      x-hhc-callers: []
      security: []
      servers: [{ url: / }]
      responses:
        '200': { $ref: '#/components/responses/Health' }
  /ready:
    get:
      operationId: getReadiness
      summary: Get readiness
      tags: [Operations]
      x-hhc-visibility: operations
      x-hhc-callers: []
      security: []
      servers: [{ url: / }]
      responses:
        '200': { $ref: '#/components/responses/Health' }
        '503': { $ref: '#/components/responses/Error' }
  /health/ready:
    get:
      operationId: getHealthReadiness
      summary: Get health readiness
      tags: [Operations]
      x-hhc-visibility: operations
      x-hhc-callers: []
      security: []
      servers: [{ url: / }]
      responses:
        '200': { $ref: '#/components/responses/Health' }
        '503': { $ref: '#/components/responses/Error' }
  /admin/campaigns:
    get:
      operationId: listCampaigns
      summary: List campaigns
      tags: [Admin]
      x-hhc-visibility: admin
      x-hhc-callers: [api-gateway]
      security: [{ daprApiToken: [], daprCallerAppId: [], trustedUserId: [], trustedAuthProvider: [], trustedScopes: [] }]
      servers: [{ url: https://admin.alive.org.tw/api }]
      x-required-any-scopes: ['campaigns:read', 'cms:read']
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/SearchQuery'
      responses:
        '200': { $ref: '#/components/responses/CampaignPage' }
        '400': { $ref: '#/components/responses/EngagementError' }
        '401': { $ref: '#/components/responses/AdminUnauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '500': { $ref: '#/components/responses/EngagementError' }
        '503': { $ref: '#/components/responses/EngagementUnavailable' }
    post:
      operationId: createCampaign
      summary: Create campaign
      tags: [Admin]
      x-hhc-visibility: admin
      x-hhc-callers: [api-gateway]
      security: [{ daprApiToken: [], daprCallerAppId: [], trustedUserId: [], trustedAuthProvider: [], trustedScopes: [] }]
      servers: [{ url: https://admin.alive.org.tw/api }]
      x-required-any-scopes: ['campaigns:write', 'cms:write']
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCampaign' }
      responses:
        '201': { $ref: '#/components/responses/Campaign' }
        '400': { $ref: '#/components/responses/EngagementError' }
        '401': { $ref: '#/components/responses/AdminUnauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '409': { $ref: '#/components/responses/EngagementError' }
        '500': { $ref: '#/components/responses/EngagementError' }
        '503': { $ref: '#/components/responses/EngagementUnavailable' }
  /admin/campaigns/{campaignId}:
    parameters:
      - { name: campaignId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getCampaign
      summary: Get campaign
      tags: [Admin]
      x-hhc-visibility: admin
      x-hhc-callers: [api-gateway]
      security: [{ daprApiToken: [], daprCallerAppId: [], trustedUserId: [], trustedAuthProvider: [], trustedScopes: [] }]
      servers: [{ url: https://admin.alive.org.tw/api }]
      x-required-any-scopes: ['campaigns:read', 'cms:read']
      responses:
        '200': { $ref: '#/components/responses/Campaign' }
        '400': { $ref: '#/components/responses/EngagementError' }
        '401': { $ref: '#/components/responses/AdminUnauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '404': { $ref: '#/components/responses/EngagementError' }
        '500': { $ref: '#/components/responses/EngagementError' }
        '503': { $ref: '#/components/responses/EngagementUnavailable' }
    put:
      operationId: updateCampaign
      summary: Update campaign
      tags: [Admin]
      x-hhc-visibility: admin
      x-hhc-callers: [api-gateway]
      security: [{ daprApiToken: [], daprCallerAppId: [], trustedUserId: [], trustedAuthProvider: [], trustedScopes: [] }]
      servers: [{ url: https://admin.alive.org.tw/api }]
      x-required-any-scopes: ['campaigns:write', 'cms:write']
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateCampaign' }
      responses:
        '200': { $ref: '#/components/responses/Campaign' }
        '400': { $ref: '#/components/responses/EngagementError' }
        '401': { $ref: '#/components/responses/AdminUnauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '409': { $ref: '#/components/responses/EngagementError' }
        '500': { $ref: '#/components/responses/EngagementError' }
        '503': { $ref: '#/components/responses/EngagementUnavailable' }
    delete:
      operationId: deleteCampaign
      summary: Delete campaign
      tags: [Admin]
      x-hhc-visibility: admin
      x-hhc-callers: [api-gateway]
      security: [{ daprApiToken: [], daprCallerAppId: [], trustedUserId: [], trustedAuthProvider: [], trustedScopes: [] }]
      servers: [{ url: https://admin.alive.org.tw/api }]
      x-required-any-scopes: ['campaigns:write', 'cms:write']
      responses:
        '204': { description: Campaign draft deleted }
        '400': { $ref: '#/components/responses/EngagementError' }
        '401': { $ref: '#/components/responses/AdminUnauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '409': { $ref: '#/components/responses/EngagementError' }
        '500': { $ref: '#/components/responses/EngagementError' }
        '503': { $ref: '#/components/responses/EngagementUnavailable' }
  /admin/campaigns/{campaignId}/send:
    post:
      operationId: sendCampaign
      summary: Send campaign
      tags: [Admin]
      x-hhc-visibility: admin
      x-hhc-callers: [api-gateway]
      security: [{ daprApiToken: [], daprCallerAppId: [], trustedUserId: [], trustedAuthProvider: [], trustedScopes: [] }]
      servers: [{ url: https://admin.alive.org.tw/api }]
      x-required-any-scopes: ['campaigns:send', 'cms:write']
      parameters:
        - { name: campaignId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { $ref: '#/components/responses/Campaign' }
        '400': { $ref: '#/components/responses/EngagementError' }
        '401': { $ref: '#/components/responses/AdminUnauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '404': { $ref: '#/components/responses/EngagementError' }
        '409': { $ref: '#/components/responses/EngagementError' }
        '500': { $ref: '#/components/responses/EngagementError' }
        '503': { $ref: '#/components/responses/EngagementUnavailable' }
  /admin/campaigns/{campaignId}/translation-previews/{targetLocale}:
    post:
      operationId: previewCampaignTranslation
      summary: Preview campaign translation
      tags: [Admin]
      x-hhc-visibility: admin
      x-hhc-callers: [api-gateway]
      security: [{ daprApiToken: [], daprCallerAppId: [], trustedUserId: [], trustedAuthProvider: [], trustedScopes: [] }]
      servers: [{ url: https://admin.alive.org.tw/api }]
      x-required-any-scopes: ['campaigns:write', 'cms:write']
      parameters:
        - { name: campaignId, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/CampaignTranslationTargetLocale'
        - $ref: '#/components/parameters/IfMatch'
      requestBody: { $ref: '#/components/requestBodies/TranslationPreviewInput' }
      responses:
        '401': { $ref: '#/components/responses/AdminUnauthorized' }
        '200': { $ref: '#/components/responses/CampaignTranslationPreview' }
        '400': { $ref: '#/components/responses/InvalidTranslationRequest' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '404': { $ref: '#/components/responses/TranslationNotFound' }
        '409': { $ref: '#/components/responses/TranslationExists' }
        '412': { $ref: '#/components/responses/TranslationVersionMismatch' }
        '422': { $ref: '#/components/responses/TranslationContentFiltered' }
        '429': { $ref: '#/components/responses/TranslationRateLimited' }
        '500': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/TranslationProviderError' }
        '503': { $ref: '#/components/responses/TranslationDisabled' }
        '504': { $ref: '#/components/responses/TranslationTimeout' }
  /admin/campaigns/{campaignId}/deliveries:
    get:
      operationId: listCampaignDeliveries
      summary: List campaign deliveries
      tags: [Admin]
      x-hhc-visibility: admin
      x-hhc-callers: [api-gateway]
      security: [{ daprApiToken: [], daprCallerAppId: [], trustedUserId: [], trustedAuthProvider: [], trustedScopes: [] }]
      servers: [{ url: https://admin.alive.org.tw/api }]
      x-required-any-scopes: ['campaigns:read', 'cms:read']
      parameters:
        - { name: campaignId, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200': { $ref: '#/components/responses/CampaignDeliveryPage' }
        '400': { $ref: '#/components/responses/EngagementError' }
        '401': { $ref: '#/components/responses/AdminUnauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '404': { $ref: '#/components/responses/EngagementError' }
        '500': { $ref: '#/components/responses/EngagementError' }
        '503': { $ref: '#/components/responses/EngagementUnavailable' }
  /admin/campaigns/{campaignId}/retry-failed:
    post:
      operationId: retryFailedCampaignDeliveries
      summary: Retry failed campaign deliveries
      tags: [Admin]
      x-hhc-visibility: admin
      x-hhc-callers: [api-gateway]
      security: [{ daprApiToken: [], daprCallerAppId: [], trustedUserId: [], trustedAuthProvider: [], trustedScopes: [] }]
      servers: [{ url: https://admin.alive.org.tw/api }]
      x-required-any-scopes: ['campaigns:send', 'cms:write']
      parameters:
        - { name: campaignId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { $ref: '#/components/responses/Campaign' }
        '400': { $ref: '#/components/responses/EngagementError' }
        '401': { $ref: '#/components/responses/AdminUnauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '404': { $ref: '#/components/responses/EngagementError' }
        '409': { $ref: '#/components/responses/EngagementError' }
        '500': { $ref: '#/components/responses/EngagementError' }
        '503': { $ref: '#/components/responses/EngagementUnavailable' }
  /admin/campaign-schedules:
    get:
      operationId: listCampaignSchedules
      summary: List campaign schedules
      tags: [Admin]
      x-hhc-visibility: admin
      x-hhc-callers: [api-gateway]
      security: [{ daprApiToken: [], daprCallerAppId: [], trustedUserId: [], trustedAuthProvider: [], trustedScopes: [] }]
      servers: [{ url: https://admin.alive.org.tw/api }]
      x-required-any-scopes: ['campaigns:read', 'cms:read']
      responses:
        '200': { $ref: '#/components/responses/CampaignScheduleList' }
        '401': { $ref: '#/components/responses/AdminUnauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '500': { $ref: '#/components/responses/EngagementError' }
        '503': { $ref: '#/components/responses/EngagementUnavailable' }
    post:
      operationId: createCampaignSchedule
      summary: Create campaign schedule
      tags: [Admin]
      x-hhc-visibility: admin
      x-hhc-callers: [api-gateway]
      security: [{ daprApiToken: [], daprCallerAppId: [], trustedUserId: [], trustedAuthProvider: [], trustedScopes: [] }]
      servers: [{ url: https://admin.alive.org.tw/api }]
      x-required-scope-sets: [['campaigns:write', 'campaigns:send'], ['cms:write']]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCampaignSchedule' }
      responses:
        '201': { $ref: '#/components/responses/CampaignSchedule' }
        '400': { $ref: '#/components/responses/EngagementError' }
        '401': { $ref: '#/components/responses/AdminUnauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '500': { $ref: '#/components/responses/EngagementError' }
        '503': { $ref: '#/components/responses/EngagementUnavailable' }
  /admin/campaign-schedules/{scheduleId}:
    parameters:
      - { name: scheduleId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getCampaignSchedule
      summary: Get campaign schedule
      tags: [Admin]
      x-hhc-visibility: admin
      x-hhc-callers: [api-gateway]
      security: [{ daprApiToken: [], daprCallerAppId: [], trustedUserId: [], trustedAuthProvider: [], trustedScopes: [] }]
      servers: [{ url: https://admin.alive.org.tw/api }]
      x-required-any-scopes: ['campaigns:read', 'cms:read']
      responses:
        '200': { $ref: '#/components/responses/CampaignSchedule' }
        '400': { $ref: '#/components/responses/EngagementError' }
        '401': { $ref: '#/components/responses/AdminUnauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '404': { $ref: '#/components/responses/EngagementError' }
        '500': { $ref: '#/components/responses/EngagementError' }
        '503': { $ref: '#/components/responses/EngagementUnavailable' }
    put:
      operationId: updateCampaignSchedule
      summary: Update campaign schedule
      tags: [Admin]
      x-hhc-visibility: admin
      x-hhc-callers: [api-gateway]
      security: [{ daprApiToken: [], daprCallerAppId: [], trustedUserId: [], trustedAuthProvider: [], trustedScopes: [] }]
      servers: [{ url: https://admin.alive.org.tw/api }]
      x-required-any-scopes: ['campaigns:write', 'cms:write']
      description: Enabling a schedule additionally requires campaigns:send; legacy cms:write remains accepted during role migration.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateCampaignSchedule' }
      responses:
        '200': { $ref: '#/components/responses/CampaignSchedule' }
        '400': { $ref: '#/components/responses/EngagementError' }
        '401': { $ref: '#/components/responses/AdminUnauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '404': { $ref: '#/components/responses/EngagementError' }
        '500': { $ref: '#/components/responses/EngagementError' }
        '503': { $ref: '#/components/responses/EngagementUnavailable' }
    delete:
      operationId: deleteCampaignSchedule
      summary: Delete campaign schedule
      tags: [Admin]
      x-hhc-visibility: admin
      x-hhc-callers: [api-gateway]
      security: [{ daprApiToken: [], daprCallerAppId: [], trustedUserId: [], trustedAuthProvider: [], trustedScopes: [] }]
      servers: [{ url: https://admin.alive.org.tw/api }]
      x-required-any-scopes: ['campaigns:write', 'cms:write']
      responses:
        '204': { description: Campaign schedule deleted }
        '400': { $ref: '#/components/responses/EngagementError' }
        '401': { $ref: '#/components/responses/AdminUnauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '404': { $ref: '#/components/responses/EngagementError' }
        '500': { $ref: '#/components/responses/EngagementError' }
        '503': { $ref: '#/components/responses/EngagementUnavailable' }
  /admin/campaign-schedules/{scheduleId}/translation-previews/{targetLocale}:
    post:
      operationId: previewCampaignScheduleTranslation
      summary: Preview campaign schedule translation
      tags: [Admin]
      x-hhc-visibility: admin
      x-hhc-callers: [api-gateway]
      security: [{ daprApiToken: [], daprCallerAppId: [], trustedUserId: [], trustedAuthProvider: [], trustedScopes: [] }]
      servers: [{ url: https://admin.alive.org.tw/api }]
      x-required-any-scopes: ['campaigns:write', 'cms:write']
      parameters:
        - { name: scheduleId, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/CampaignTranslationTargetLocale'
        - $ref: '#/components/parameters/IfMatch'
      requestBody: { $ref: '#/components/requestBodies/TranslationPreviewInput' }
      responses:
        '401': { $ref: '#/components/responses/AdminUnauthorized' }
        '200': { $ref: '#/components/responses/CampaignTranslationPreview' }
        '400': { $ref: '#/components/responses/InvalidTranslationRequest' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '404': { $ref: '#/components/responses/TranslationNotFound' }
        '409': { $ref: '#/components/responses/TranslationExists' }
        '412': { $ref: '#/components/responses/TranslationVersionMismatch' }
        '422': { $ref: '#/components/responses/TranslationContentFiltered' }
        '429': { $ref: '#/components/responses/TranslationRateLimited' }
        '500': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/TranslationProviderError' }
        '503': { $ref: '#/components/responses/TranslationDisabled' }
        '504': { $ref: '#/components/responses/TranslationTimeout' }
  /bulletins:
    get:
      operationId: listPublicBulletins
      summary: List public bulletins
      tags: [Public]
      x-hhc-visibility: public
      x-hhc-callers: [api-gateway]
      security: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Published bulletin page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicBulletinListEnvelope' }
  /bulletins/latest:
    get:
      operationId: getLatestPublicBulletin
      summary: Get latest public bulletin
      tags: [Public]
      x-hhc-visibility: public
      x-hhc-callers: [api-gateway]
      security: []
      parameters: [{ $ref: '#/components/parameters/BulletinEdition' }]
      responses:
        '200': { $ref: '#/components/responses/PublicBulletin' }
        '404': { $ref: '#/components/responses/Error' }
  /bulletins/by-number/{issueNumber}:
    get:
      operationId: getPublicBulletinByNumber
      summary: Get public bulletin by number
      tags: [Public]
      x-hhc-visibility: public
      x-hhc-callers: [api-gateway]
      security: []
      parameters:
        - { name: issueNumber, in: path, required: true, schema: { type: integer, format: int32, minimum: 1, maximum: 2147483647 } }
        - $ref: '#/components/parameters/BulletinEdition'
      responses:
        '200': { $ref: '#/components/responses/PublicBulletin' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /bulletins/{issueDate}:
    get:
      operationId: getPublicBulletinByDate
      summary: Get public bulletin by date
      tags: [Public]
      x-hhc-visibility: public
      x-hhc-callers: [api-gateway]
      security: []
      parameters:
        - { name: issueDate, in: path, required: true, schema: { type: string, format: date } }
        - $ref: '#/components/parameters/BulletinEdition'
      responses:
        '200': { $ref: '#/components/responses/PublicBulletin' }
        '404': { $ref: '#/components/responses/Error' }
  /news:
    get:
      operationId: listPublicNews
      summary: List public news
      tags: [Public]
      x-hhc-visibility: public
      x-hhc-callers: [api-gateway]
      security: []
      parameters:
        - $ref: '#/components/parameters/ContentLocale'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses: { '200': { $ref: '#/components/responses/PublicContentList' } }
  /news/{slug}:
    get:
      operationId: getPublicNews
      summary: Get public news
      tags: [Public]
      x-hhc-visibility: public
      x-hhc-callers: [api-gateway]
      security: []
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 120, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' } }
        - $ref: '#/components/parameters/ContentLocale'
        - { name: If-None-Match, in: header, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/PublicContentItem' }
        '304': { description: Content has not changed }
        '404': { $ref: '#/components/responses/Error' }
  /history:
    get:
      operationId: listPublicHistory
      summary: List public history
      tags: [Public]
      x-hhc-visibility: public
      x-hhc-callers: [api-gateway]
      security: []
      parameters:
        - $ref: '#/components/parameters/ContentLocale'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses: { '200': { $ref: '#/components/responses/PublicContentList' } }
  /videos:
    get:
      operationId: listPublicVideos
      summary: List public videos
      tags: [Public]
      x-hhc-visibility: public
      x-hhc-callers: [api-gateway]
      security: []
      parameters:
        - $ref: '#/components/parameters/ContentLocale'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses: { '200': { $ref: '#/components/responses/PublicContentList' } }
  /locations:
    get:
      operationId: listPublicLocations
      summary: List published locations for one locale
      description: Reads only the requested published locale; no locale fallback is applied.
      tags: [Public]
      x-hhc-visibility: public
      x-hhc-callers: [api-gateway]
      security: []
      parameters: [{ $ref: '#/components/parameters/ContentLocale' }]
      responses:
        '200': { $ref: '#/components/responses/PublicLocationList' }
        '400': { $ref: '#/components/responses/Error' }
  /site-layout:
    get:
      operationId: getPublicSiteLayout
      summary: Get the published site layout for one exact locale
      tags: [Public]
      x-hhc-visibility: public
      x-hhc-callers: [api-gateway]
      security: []
      parameters: [{ $ref: '#/components/parameters/ContentLocale' }]
      responses:
        '200': { $ref: '#/components/responses/SiteLayout' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /home:
    get:
      operationId: getPublicHome
      summary: Get public home
      tags: [Public]
      x-hhc-visibility: public
      x-hhc-callers: [api-gateway]
      security: []
      parameters: [{ $ref: '#/components/parameters/ContentLocale' }]
      responses:
        '200':
          description: Published home page projection
