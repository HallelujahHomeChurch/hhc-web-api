          description: Accepted operation result; acceptance is not verified media readiness.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingCaptureResultEnvelope'
        '400':
          description: Rejected request.
          content:
            application/json:
              schema:
