      summary: Project current membership, bulletin editions and legal acceptance for the LINE requester
      description: Bot-only presentation snapshot. The caller supplies a freshly resolved Account subject through trusted headers, never a browser-selected subject. Locale selects legal/UI language, not content editions. Does not grant content access or return organization, account or membership details. Content requests recheck authorization.
      tags: [Private]
      x-hhc-visibility: private
      x-hhc-callers: [hhc-line-function-bot]
      x-hhc-required-headers: [X-HHC-User-ID, X-HHC-Auth-Provider]
      x-hhc-cache: 'private, no-store'
      security: [{ daprApiToken: [], daprCallerAppId: [], trustedUserId: [], trustedAuthProvider: [] }, { cmsServiceCaller: [], cmsServiceToken: [], trustedUserId: [], trustedAuthProvider: [] }]
      servers: [{ url: / }]
      parameters:
        - name: locale
          in: query
          description: UI and legal-document language; independent of authorized content languages.
          schema: { type: string, enum: [zh-Hant, zh-Hans, en, ja, ko], default: zh-Hant }
      responses:
        '200':
          description: Current authorization presentation; unavailable dependencies never return a partial result.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    required: [qualified, editions, legal]
                    properties:
                      qualified: { type: boolean }
                      legal: { type: string, enum: [allowed, required, not_applicable] }
                      editions:
                        type: array
                        maxItems: 5
                        uniqueItems: true
                        items:
                          type: object
                          additionalProperties: false
                          required: [series, locale]
                          properties:
                            series: { type: string, enum: [general, children] }
                            locale: { type: string, enum: [zh-Hant, zh-Hans, en] }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/AdminUnauthorized' }
        '503': { $ref: '#/components/responses/Error' }
