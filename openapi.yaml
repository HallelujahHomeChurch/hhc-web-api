  headers:
    SiteLayoutETag:
      description: Strong validator derived from the published aggregate version.
      schema: { type: string, pattern: '^"site-layout-[1-9][0-9]*"$' }
    SiteLayoutCacheControl:
      description: Public revalidation policy for Site Layout projections.
      schema: { type: string, const: 'public, max-age=30, must-revalidate' }
  schemas:
    RecordingInteractionSummary:
      type: object
      additionalProperties: false
      required:
        - liked
        - likes
        - commentsEnabled
      properties:
        commentCount: {type: integer, minimum: 0}
        liked:
          type: boolean
        likes:
          type: integer
          minimum: 0
        commentsEnabled:
          type: boolean
    RecordingLikeInput:
      type: object
      additionalProperties: false
      required:
        - liked
      properties:
        liked:
          type: boolean
    RecordingComment:
      type: object
      additionalProperties: false
      required:
        - id
        - text
        - displayName
        - mine
        - deleted
        - hidden
        - revision
        - createdAt
        - replyCount
      properties:
        likes: {type: integer, minimum: 0}
        reaction: {type: [string, 'null'], enum: [like, dislike, null]}
        threadParentId:
          type: string
          format: uuid
          description: Direct structural parent in threaded list responses; omitted on roots. Survives anonymous removed-target placeholders.
        hasChildren:
          type: boolean
          description: Exact traversability fallback when a root's renderable direct-child count is omitted after bounded removal-path traversal. Threaded responses only.
        directChildCount:
          type: integer
          minimum: 0
          description: Renderable direct children across all pages, including anonymous structural placeholders. Threaded list responses only.
        descendantReplyCount:
          type: integer
          minimum: 0
          description: Visible non-deleted replies at all depths below this node, excluding the node and anonymous placeholders. Threaded list responses only. Omitted for non-root nodes when an exact count exceeds the bounded read budget; absence is not zero. Root totals always use the legacy whole-thread shortcut.
        replyPreviewAuthors:
          type: array
          maxItems: 1
          description: Bounded current profiles of visible direct-child authors in deterministic child order. No account identifiers; omitted on removed nodes.
          items:
            type: object
            additionalProperties: false
            required: [displayName]
            properties:
              displayName: {type: string}
              avatarUrl: {type: string}
        replyTo:
          type: object
          additionalProperties: false
          required: [id, displayName]
          properties:
            id: {type: string, format: uuid}
            displayName: {type: string}
        id:
          type: string
          format: uuid
        parentId:
          type: string
          format: uuid
        text:
          type: string
        displayName:
          type: string
        avatarUrl:
          type: string
          description: Current account avatar URL, omitted when absent or the comment is deleted or hidden. Profile lookup may be cached for up to 60 seconds.
        mine:
          type: boolean
        deleted:
          type: boolean
        hidden:
          type: boolean
        revision:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        editedAt:
          type: string
          format: date-time
        replyCount:
          type: integer
          minimum: 0
