    post:
      operationId: publishBulletin
      summary: Publish bulletin
      description: Ordinary PDF publication rejects current automatic authority with 409 automatic_publication_active, including with the capability disabled. Explicit continue_automatic requires a provably healthy current automatic chain without an owned PDF workflow; unknown, stale, failed or already-owned work returns 409 without mutation. It preserves the original automatic notification preference. PDF-only is a separate deliberate cancellation, not early PDF with automatic work retained. For an already-published exact PDF with matching completed workflow evidence, it cancels only the pending automatic plan and returns that original completed workflow without republishing or notifying. Its aggregateVersion is historical; refresh the issue for the current canonical version.
