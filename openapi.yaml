        transaction. Replay returns the original receipt and current recording;
        outcome state_changed never republishes, including after manual
        unpublish or expiry. Reusing an actor-scoped key for a different recording
        or If-Match returns 409. A new intent requires a new key; never retry 412
        automatically with the latest version.
