components:
  securitySchemes:
    broadcastIngestSession:
      type: http
      scheme: bearer
      bearerFormat: HHC-INGEST
      description: Event-bound short-lived HHC ingest session; never an Account access token.
    daprApiToken:
      type: apiKey
      in: header
      name: dapr-api-token
      description: Dapr API token supplied by api-gateway; the value is never published in this contract.
    daprCallerAppId:
      type: apiKey
      in: header
      name: Dapr-Caller-App-Id
      description: Must identify the configured api-gateway Dapr application.
    cmsServiceCaller:
      type: apiKey
      in: header
      name: X-HHC-CMS-Service-Caller
      description: Exact calling service identity on the private HTTPS path.
    cmsServiceToken:
      type: apiKey
      in: header
      name: X-HHC-CMS-Service-Token
      description: Credential bound to the named service and approved route.
    trustedUserId:
      type: apiKey
      in: header
      name: X-HHC-User-ID
      description: Sanitized Account user identifier injected by api-gateway.
    trustedAuthProvider:
      type: apiKey
      in: header
      name: X-HHC-Auth-Provider
      description: Must be account-api.
    trustedPrincipalId:
      type: apiKey
      in: header
      name: X-HHC-Principal-ID
      description: Sanitized service principal UUID injected by api-gateway; never accepted directly from clients.
    trustedPrincipalType:
      type: apiKey
      in: header
      name: X-HHC-Principal-Type
      description: Must be service for the service-principal security alternative. Human identity retains trustedUserId.
    trustedClientId:
      type: apiKey
      in: header
      name: X-HHC-Client-ID
      description: Sanitized Account client identifier injected by api-gateway.
    trustedCredentialId:
      type: apiKey
      in: header
      name: X-HHC-Credential-ID
      description: Sanitized service credential UUID injected by api-gateway; this is an identifier, never a secret.
    trustedScopes:
      type: apiKey
      in: header
      name: X-HHC-Scopes
      description: Sanitized Account scopes injected by api-gateway and enforced per operation.
  parameters:
    ContentLocale: { name: locale, in: query, schema: { $ref: '#/components/schemas/ContentLocale' } }
    BulletinLocale: { name: locale, in: query, schema: { $ref: '#/components/schemas/BulletinLocale' } }
    BulletinSeries: { name: series, in: query, schema: { $ref: '#/components/schemas/BulletinSeries', default: general } }
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, maximum: 10000, default: 1 } }
    PageSize: { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
    PerPage: { name: perPage, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
    SearchQuery:
      name: q
      in: query
      description: Searches the internal campaign name and localized subject or body.
      schema: { type: string, maxLength: 120 }
    IssueID: { name: issueId, in: path, required: true, schema: { type: string, format: uuid } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1 } }
    IfMatch: { name: If-Match, in: header, required: true, schema: { type: string, pattern: '^"[1-9][0-9]*"$' } }
    IfNoneMatch:
      name: If-None-Match
      in: header
      description: Conditional validator; weak validators and comma-separated lists are accepted.
      schema: { type: string }
    ContentModule: { name: module, in: path, required: true, schema: { $ref: '#/components/schemas/ContentModule' } }
    PublicationContentModule: { name: module, in: path, required: true, schema: { $ref: '#/components/schemas/PublicationContentModule' } }
    CreatableContentModule: { name: module, in: path, required: true, schema: { $ref: '#/components/schemas/CreatableContentModule' } }
    TranslatableContentModule: { name: module, in: path, required: true, schema: { $ref: '#/components/schemas/TranslatableContentModule' } }
    PageKey: { name: pageKey, in: path, required: true, schema: { type: string, enum: [home, about, privacy-policy, terms-of-use] } }
    ContentID: { name: contentId, in: path, required: true, schema: { type: string, format: uuid } }
    ContentTranslationTargetLocale: { name: targetLocale, in: path, required: true, schema: { $ref: '#/components/schemas/ContentTranslationTargetLocale' } }
    BulletinTranslationTargetEdition: { name: targetLocale, in: path, required: true, schema: { $ref: '#/components/schemas/BulletinTranslationTargetEdition' } }
    CampaignTranslationTargetLocale: { name: targetLocale, in: path, required: true, schema: { $ref: '#/components/schemas/CampaignTranslationTargetLocale' } }
    Revision: { name: revision, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
  requestBodies:
    PublicationInput:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PublicationInput' }
    ContentWriteInput:
      required: true
      content:
        application/json:
          schema:
            anyOf:
              - $ref: '#/components/schemas/ContentWriteInput'
              - $ref: '#/components/schemas/HomePageWriteInputV2'
    TranslationPreviewInput:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/TranslationPreviewInput' }
  responses:
    BroadcastStreamKeyFailure:
      description: K1 failure; unauthorized or wrong key never bypasses OAuth, actor, epoch or active-capture fencing.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/BroadcastStreamKeyErrorEnvelope' }
    BroadcastFailure:
      description: B1 operation rejected or dependency unavailable; failed responses never prove a state transition.
      headers:
        Retry-After:
          description: Retry delay for unavailable dependencies.
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/BroadcastErrorEnvelope' }
    StatementDismissal:
      description: Owner-scoped statement preference; Cache-Control private, no-store
      content:
        application/json:
          schema: { $ref: '#/components/schemas/StatementDismissalEnvelope' }
    ReaderUnavailable:
      description: Generic not_found for denied, missing or unpublished edition. Only this owner marker together with typed not_found is terminal; an unrelated router or gateway 404 must not purge offline data.
      headers:
        X-HHC-Bulletin-Access: { schema: { type: string, const: unavailable } }
        Cache-Control: { schema: { type: string, const: 'private, no-store' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    Health:
      description: Service process is healthy or ready.
      content:
        application/json:
          schema:
            type: object
            required: [data, meta, error]
            properties:
              data:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [healthy, ready] }
              meta: { type: object }
              error: { type: 'null' }
    BulletinIssue:
      description: Bulletin issue
      headers:
        ETag: { schema: { type: string } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/BulletinIssueEnvelope' }
    ProtectedBulletin:
      description: Published bulletin metadata returned only after exact entitlement authorization.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ProtectedBulletinEnvelope' }
    ProtectedBulletinNotFound:
      description: Bulletin, entitlement, or protected asset is absent; the response does not disclose which condition failed.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    BulletinDownloadJob:
      description: Current durable bulletin preparation state.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/BulletinDownloadJobEnvelope' }
    BulletinDownloadJobPending:
      description: Bulletin preparation is queued or running.
      headers:
        Retry-After: { schema: { type: integer, minimum: 1 } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/BulletinDownloadJobEnvelope' }
    Error:
      description: Standard API error envelope
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    AdminUnauthorized:
      description: Trusted gateway identity is missing or invalid.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    AdminForbidden:
      description: The trusted Account identity lacks a required scope.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Campaign:
