      required: [packageId, sessionId, recordingId, state, sizeBytes, expiresAt, confirmedObjects, nextCursor]
      properties:
        audio: {$ref: '#/components/schemas/RecordingAudioDerivative'}
        processingProgress: {$ref: '#/components/schemas/RecordingProcessingProgress'}
        uploadedAt: {type: string, format: date-time, description: Immutable accepted upload completion time.}
        retentionRevision: {type: integer, format: int64, minimum: 1}
        packageId: { type: string }
        sessionId: { type: string }
        recordingId: { type: string }
        state: { type: string, enum: [uploading, freezing, validating, ready, failed, expired] }
        sizeBytes: { type: integer, format: int64 }
        expiresAt: { type: string, format: date-time }
        confirmedObjects: { type: array, maxItems: 1000, items: { type: string } }
        nextCursor: { type: string, description: Last examined path; empty when this pass is complete. }
        readyAt: { type: string, format: date-time }
        mediaExpiresAt: { type: string, format: date-time }
        renditions: { type: array, minItems: 1, maxItems: 3, items: { $ref: '#/components/schemas/RecordingRendition' } }
    SignedRecordingObject:
      type: object
      additionalProperties: false
      required: [path, url, method, headers]
      properties:
        path: { type: string }
        url: { type: string, format: uri, description: 'At most fifteen-minute single-object R2 PUT capability; never log or persist.' }
        method: { type: string, enum: [PUT] }
        headers: { type: object, additionalProperties: { type: array, items: { type: string } } }
    RecordingPackageInventory:
      type: object
      additionalProperties: false
      description: >-
        HLS v1 declared inventory for the gated package upload contract; current MP4 routes do not consume it.
        SHA-256 inventoryDigest hashes UTF-8 encoding/json-compatible serialization with this field omitted,
        objects sorted by path, renditions sorted by name, and fields in the order shown below.
        Objects exclude package.json itself; total package bytes include the serialized inventory.
        Metadata and hashes are declarations, not proof of readiness. Final bytes and media are verified by the recording Job.
        Master BANDWIDTH and optional AVERAGE-BANDWIDTH must match measured media segment bytes and EXTINF durations
        under RFC 8216 section 4.1, not configured encoder bitrates. Ineligible short-tail windows are excluded from peak bandwidth.
      required: [schemaVersion, presetVersion, objects, renditions, inventoryDigest]
      properties:
        schemaVersion: { type: integer, const: 1 }
        presetVersion: { type: string, pattern: '^[a-zA-Z0-9][a-zA-Z0-9._-]{0,63}$' }
        objects:
          type: array
          minItems: 4
          maxItems: 13000
          items: { $ref: '#/components/schemas/RecordingPackageObject' }
        renditions:
          type: array
          minItems: 1
          maxItems: 3
          items: { $ref: '#/components/schemas/RecordingRendition' }
        inventoryDigest: { type: string, pattern: '^[a-f0-9]{64}$' }
    RecordingPackageObject:
      type: object
      additionalProperties: false
      required: [path, sizeBytes, sha256]
      properties:
        path:
          type: string
          pattern: '^(master\.m3u8|(480p|720p|1080p)/(index\.m3u8|init\.mp4|seg-[0-9]{6}\.m4s))$'
          description: Canonical relative path. Unique paths and every declared rendition's complete contiguous segment list are required. No URLs, encoded paths, queries or package.json.
        sizeBytes: { type: integer, format: int64, minimum: 1, maximum: 134217728, description: 'Playlists additionally have a 1048576-byte limit. Package total including inventory must be at most 10000000000 bytes.' }
        sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
    RecordingRendition:
      type: object
      additionalProperties: false
      required: [name, width, height, frameRate, videoBitrate, audioBitrate, durationSeconds, segmentCount]
      properties:
        name: { type: string, enum: [480p, 720p, 1080p], description: '720p is mandatory for backward compatibility; 480p and 1080p optional. Names are unique; each additional rung has distinct dimensions and ordered bitrates.' }
        width: { type: integer, minimum: 2, maximum: 1920, multipleOf: 2, description: '480p maximum width is 854; 720p maximum width is 1280; source must never be upscaled.' }
        height: { type: integer, minimum: 2, maximum: 1080, multipleOf: 2, description: '480p maximum height is 480; 720p maximum height is 720. Actual dimensions are retained for smaller sources.' }
        frameRate: { type: number, exclusiveMinimum: 0, maximum: 30 }
        videoBitrate: { type: integer, minimum: 500000, maximum: 8000000 }
        audioBitrate: { type: integer, const: 128000 }
        durationSeconds: { type: number, exclusiveMinimum: 0, maximum: 43200 }
        segmentCount: { type: integer, minimum: 1, maximum: 4320, description: 'Actual number of contiguous media segments, including a legal short final segment; validated against playlists and decoded media, not inferred from duration. All renditions require aligned actual boundaries. The obs-hls-10s-v1 profile allows up to 4320 segments; other profiles remain limited to 1440.' }
    RecordingPackageSignInput:
      type: object
      additionalProperties: false
      required: [paths]
      properties:
        paths: { type: array, minItems: 1, maxItems: 100, uniqueItems: true, items: { type: string } }
    RecordingPackageCompleteInput:
      type: object
      additionalProperties: false
    RecordingPackageEnvelope:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/RecordingPackage' }
        meta: { type: object, additionalProperties: true }
        error: { type: ['null'] }
    RecordingPackageStatusEnvelope:
