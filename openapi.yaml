      x-hhc-callers: [api-gateway]
      x-hhc-required-headers: [Dapr-Caller-App-Id, dapr-api-token, X-HHC-User-ID, X-HHC-Auth-Provider]
      x-hhc-cache: 'private, no-store'
      security: [{ daprApiToken: [], daprCallerAppId: [], trustedUserId: [], trustedAuthProvider: [], trustedScopes: [] }]
      parameters:
        - $ref: '#/components/parameters/RangeFrom'
        - $ref: '#/components/parameters/RangeTo'
      responses:
