name: Production Release

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/**
      - Dockerfile
      - go.mod
      - go.sum
      - cmd/**
      - internal/**
      - migrations/**
      - infra/**
      - scripts/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hhc-web-api-production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: hhc_web_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hhc_web_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      HHW_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/hhc_web_test?sslmode=disable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - run: |
          ./scripts/bootstrap-database.test.sh
          go test -race ./... -count=1 -p=1
          go vet ./...
          docker build -t hhc-web-api:verify .

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    env:
      ACR_NAME: alive
      ACR_LOGIN_SERVER: alive.azurecr.io
      IMAGE_REPOSITORY: alive/hhc-web-api
      RESOURCE_GROUP: alive
      MIGRATION_JOB_NAME: hhc-web-migrate
      API_APP_NAME: hhc-web-api
      API_GATEWAY_APP_NAME: api-gateway
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate release configuration
        run: |
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            test -n "${!name:-}" || { echo "Missing repository variable: ${name}" >&2; exit 1; }
          done
      - name: Set image tag
        run: echo "IMAGE_TAG=main-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - name: Sign in to Azure with OIDC
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: az extension add --name containerapp --upgrade --yes
      - name: Build and push image
        run: |
          az acr build \
            --registry "$ACR_NAME" \
            --image "${IMAGE_REPOSITORY}:${IMAGE_TAG}" \
            --file Dockerfile \
            .
      - name: Update migration job
        run: |
          image_ref="${ACR_LOGIN_SERVER}/${IMAGE_REPOSITORY}:${IMAGE_TAG}"
          az deployment group create \
            --name "hhc-web-migrate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --parameters migrationImage="$image_ref" runtimeImage="$image_ref" deployRuntime=false provisionPermissions=false \
            --only-show-errors --output none
      - name: Run migrations
        run: |
          execution_name="$(az containerapp job start -g "$RESOURCE_GROUP" -n "$MIGRATION_JOB_NAME" --query name -o tsv --only-show-errors)"
          test -n "$execution_name"
          for attempt in {1..60}; do
            status="$(az containerapp job execution list -g "$RESOURCE_GROUP" -n "$MIGRATION_JOB_NAME" \
              --query "[?name=='${execution_name}'].properties.status | [0]" -o tsv --only-show-errors)"
            case "$status" in
              Succeeded) exit 0 ;;
              Failed|Canceled|Cancelled|Stopped) echo "Migration ${execution_name}: ${status}" >&2; exit 1 ;;
            esac
            sleep 10
          done
          echo "Migration timed out" >&2
          exit 1
      - name: Deploy API
        run: |
          image_ref="${ACR_LOGIN_SERVER}/${IMAGE_REPOSITORY}:${IMAGE_TAG}"
          az deployment group create \
            --name "hhc-web-runtime-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --parameters migrationImage="$image_ref" runtimeImage="$image_ref" deployRuntime=true provisionPermissions=false \
            --only-show-errors --output none
      - name: Wait for API revision
        run: |
          image_ref="${ACR_LOGIN_SERVER}/${IMAGE_REPOSITORY}:${IMAGE_TAG}"
          for attempt in {1..60}; do
            latest="$(az containerapp show -g "$RESOURCE_GROUP" -n "$API_APP_NAME" --query properties.latestRevisionName -o tsv --only-show-errors)"
            ready="$(az containerapp show -g "$RESOURCE_GROUP" -n "$API_APP_NAME" --query properties.latestReadyRevisionName -o tsv --only-show-errors)"
            if [[ -n "$latest" && "$latest" == "$ready" ]]; then
              image="$(az containerapp revision show -g "$RESOURCE_GROUP" -n "$API_APP_NAME" --revision "$ready" \
                --query properties.template.containers[0].image -o tsv --only-show-errors)"
              [[ "$image" == "$image_ref" ]] && exit 0
            fi
            sleep 10
          done
          echo "HHC web API did not become ready" >&2
          exit 1
      - name: Verify Dapr API through gateway
        run: |
          probe() {
            local path="$1"
            output="$(timeout 60s script -q -e -c \
              "az containerapp exec -g \"$RESOURCE_GROUP\" -n \"$API_GATEWAY_APP_NAME\" --command \"/usr/bin/wget -S -O - http://localhost:3500/v1.0/invoke/hhc-web-api/method${path}\"" \
              /dev/null 2>&1)"
            output="${output//$'\r'/}"
            printf '%s\n' "$output"
            grep -Eq 'HTTP/1\.[01][[:space:]]+200' <<< "$output"
          }
          probe /health
          probe /ready
          probe '/api/home?locale=zh-Hant'
      - name: Verify protected routes reject missing identity
        run: |
          output="$(timeout 60s script -q -e -c \
            "az containerapp exec -g \"$RESOURCE_GROUP\" -n \"$API_GATEWAY_APP_NAME\" --command \"/usr/bin/wget -S -O - http://localhost:3500/v1.0/invoke/hhc-web-api/method/api/admin/bulletins\"" \
            /dev/null 2>&1 || true)"
          output="${output//$'\r'/}"
          printf '%s\n' "$output"
          grep -Eq 'HTTP/1\.[01][[:space:]]+401' <<< "$output"
