name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: hhc_web_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hhc_web_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      HHW_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/hhc_web_test?sslmode=disable
      TEST_POSTGRES_DSN: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
      HHC_WEB_ALLOW_DESTRUCTIVE_TEST: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: |
          ./scripts/bootstrap-migration-role.test.sh
          ./scripts/test-migration-policy-test.sh
          ./scripts/test-migration-policy.sh internal/migrations/sql/*.sql
          ./scripts/test-what-if-policy.sh
          go test -race ./... -count=1 -p=1
          go vet ./...
          ./scripts/test-release-policy.sh
          docker build -t hhc-web-api:verify .
