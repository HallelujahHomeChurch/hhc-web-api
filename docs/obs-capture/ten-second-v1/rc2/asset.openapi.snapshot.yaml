openapi: 3.1.0
info:
  title: HHC S10 capture integration schema
  version: s10-2026-10-18.rc2
  description: Fixed S10 bounds supplement. See contract.md for profile-specific runtime validation.
servers:
- url: http://asset-api
  description: Internal service address; public requests enter through API Gateway.
paths:
  /priv/recording-packages:
    post:
      operationId: createRecordingPackage
      summary: Create or replay an actor-bound HLS package upload.
      description: Gated producer API; unavailable until wired with the package worker. Inventory is bounded to
        8MiB; total package bytes include its canonical serialized bytes. At most two active packages per actor
        and one package per recording.
      tags:
      - Private
      x-hhc-visibility: private
      x-hhc-callers:
      - hhc-web-api
      security:
      - daprCaller: []
      - workloadPrincipal: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/RecordingActorID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - recordingId
              - inventory
              properties:
                recordingId:
                  type: string
                  pattern: ^[a-zA-Z0-9-]{1,80}$
                inventory:
                  $ref: '#/components/schemas/RecordingPackageInventory'
      responses:
        '201':
          description: Created or exact replay; not yet ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingPackage'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '413':
          description: 'package_too_large: total package exceeds 10GB.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/Error'
  /priv/recording-packages/{packageID}:
    parameters:
    - $ref: '#/components/parameters/RecordingPackageID'
    - $ref: '#/components/parameters/RecordingActorID'
    get:
      operationId: getRecordingPackage
      summary: Query state and a bounded page of remotely observed upload objects.
      description: confirmedObjects means remote size matches the inventory, not verified SHA-256 or ready media.
        A strongly consistent R2 listing is scoped to the package staging prefix and bounded to 13000 objects; provider
        failures never imply missing or confirmed objects. Results follow sorted inventory path order; use nextCursor
        until empty. Non-uploading states do not query mutable staging objects.
      tags:
      - Private
      x-hhc-visibility: private
      x-hhc-callers:
      - hhc-web-api
      security:
      - daprCaller: []
      - workloadPrincipal: []
      parameters:
      - name: cursor
        in: query
        schema:
          type: string
        description: Last examined object path from the previous page.
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          default: 100
      responses:
        '200':
          description: Actor-scoped upload status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingPackageStatus'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /priv/recording-packages/{packageID}/ready:
    parameters:
    - $ref: '#/components/parameters/RecordingPackageID'
    get:
      operationId: getReadyRecordingPackage
      summary: Read the recording-bound ready package projection for its owning CMS.
      description: Owner-only and gated with HLS. Does not require uploader identity or expose inventory/storage
        paths. CMS must independently authorize its viewer or publication operation. Failed, incomplete, expired
        and mismatched packages are denied.
      tags:
      - Private
      x-hhc-visibility: private
      x-hhc-callers:
      - hhc-web-api
      security:
      - daprCaller: []
      - workloadPrincipal: []
      parameters:
      - name: recordingId
        in: query
        required: true
        schema:
          type: string
          pattern: ^[a-zA-Z0-9-]{1,80}$
      responses:
        '200':
          description: Bounded ready projection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingPackageStatus'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /priv/recording-packages/{packageID}/covers:
    parameters:
    - $ref: '#/components/parameters/RecordingPackageID'
    - name: recordingId
      in: query
      required: true
      schema:
        type: string
    get:
      operationId: listRecordingCovers
      summary: List recording-bound image jobs and candidates without storage locations.
      tags:
      - Private
      x-hhc-visibility: private
      x-hhc-callers:
      - hhc-web-api
      security:
      - daprCaller: []
      - workloadPrincipal: []
      responses:
        '200':
          description: Private no-store candidate list. Custom jobs retain the upload operation key for response-loss
            recovery.
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/RecordingCover'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /priv/recording-packages/{packageID}/cover-uploads:
    parameters:
    - $ref: '#/components/parameters/RecordingPackageID'
    - name: recordingId
      in: query
      required: true
      schema:
        type: string
    post:
      operationId: uploadRecordingCover
      summary: Accept at most 5 MiB JPEG or PNG into private R2 for bounded normalization.
      description: Exact actor and idempotency replay; changed bytes conflict. Only a ready nonexpired CMS-owned
        package is eligible. This does not select or publish an image. Images never enter the ordinary Blob scan
        lifecycle.
      tags:
      - Private
      x-hhc-visibility: private
      x-hhc-callers:
      - hhc-web-api
      security:
      - daprCaller: []
      - workloadPrincipal: []
      parameters:
      - name: X-HHC-Actor-ID
        in: header
        required: true
        schema:
          type: string
          maxLength: 160
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          maxLength: 160
      requestBody:
        required: true
        content:
          image/jpeg:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
      responses:
        '202':
          description: Durable processing receipt; not a selection receipt.
          content:
            application/json:
              schema:
                type: object
                required:
                - uploadId
                - state
                properties:
                  uploadId:
                    type: string
                  state:
                    type: string
                    enum:
                    - uploading
                    - pending
                    - processing
                    - ready
                    - failed
                    - expired
        '413':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /priv/recording-packages/{packageID}/covers/{coverID}/content:
    parameters:
    - $ref: '#/components/parameters/RecordingPackageID'
    - name: recordingId
      in: query
      required: true
      schema:
        type: string
    - name: coverID
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: readRecordingCover
      summary: Read a ready recording-bound standardized JPEG.
      tags:
      - Private
      x-hhc-visibility: private
      x-hhc-callers:
      - hhc-web-api
      security:
      - daprCaller: []
      - workloadPrincipal: []
      responses:
        '200':
          description: Private no-store image/jpeg with nosniff; at most 1 MiB.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /priv/recording-packages/{packageID}/covers/{coverID}/retain:
    parameters:
    - $ref: '#/components/parameters/RecordingPackageID'
    - name: recordingId
      in: query
      required: true
      schema:
        type: string
    - name: coverID
      in: path
      required: true
      schema:
        type: string
    post:
      operationId: retainRecordingCover
      summary: Idempotently protect a ready image using a CMS selection reference.
      tags:
      - Private
      x-hhc-visibility: private
      x-hhc-callers:
      - hhc-web-api
      security:
      - daprCaller: []
      - workloadPrincipal: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - referenceId
              properties:
                referenceId:
                  type: string
                  minLength: 1
                  maxLength: 160
      responses:
        '204':
          description: Reference retained; conflicting reference reuse is rejected.
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /priv/recording-packages/{packageID}/covers/{coverID}/references/{referenceID}:
    parameters:
    - $ref: '#/components/parameters/RecordingPackageID'
    - name: recordingId
      in: query
      required: true
      schema:
        type: string
    - name: coverID
      in: path
      required: true
      schema:
        type: string
    - name: referenceID
      in: path
      required: true
      schema:
        type: string
    delete:
      operationId: releaseRecordingCover
      summary: Idempotently release exactly one CMS image selection reference.
      tags:
      - Private
      x-hhc-visibility: private
      x-hhc-callers:
      - hhc-web-api
      security:
      - daprCaller: []
      - workloadPrincipal: []
      responses:
        '204':
          description: Reference released or already absent.
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /priv/recording-packages/{packageID}/sign:
    parameters:
    - $ref: '#/components/parameters/RecordingPackageID'
    - $ref: '#/components/parameters/RecordingActorID'
    post:
      operationId: signRecordingPackage
      summary: Sign up to 100 fixed-size staging object PUT URLs.
      description: Validates the entire batch before signing. Only inventory paths are accepted. URLs last at most
        15 minutes or the remaining upload session, never target final storage and must not be logged. No new URLs
        after complete.
      tags:
      - Private
      x-hhc-visibility: private
      x-hhc-callers:
      - hhc-web-api
      security:
      - daprCaller: []
      - workloadPrincipal: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - paths
              properties:
                paths:
                  type: array
                  minItems: 1
                  maxItems: 100
                  uniqueItems: true
                  items:
                    type: string
      responses:
        '200':
          description: Single-object PUT capabilities.
          content:
            application/json:
              schema:
                type: array
                maxItems: 100
                items:
                  $ref: '#/components/schemas/SignedRecordingObject'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /priv/recording-packages/{packageID}/complete:
    parameters:
    - $ref: '#/components/parameters/RecordingPackageID'
    - $ref: '#/components/parameters/RecordingActorID'
    post:
      operationId: completeRecordingPackage
      summary: Durably freeze the inventory and queue asynchronous copy and validation.
      description: Returns only after the freezing state is persisted. An exact replay returns the accepted state,
        even after the upload session expires. Does not verify all uploaded bytes in the request or make the package
        ready.
      tags:
      - Private
      x-hhc-visibility: private
      x-hhc-callers:
      - hhc-web-api
      security:
      - daprCaller: []
      - workloadPrincipal: []
      responses:
        '202':
          description: Durable freezing receipt or accepted completion replay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingPackage'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /priv/recording-packages/{packageID}/grant:
    parameters:
    - $ref: '#/components/parameters/RecordingPackageID'
    post:
      operationId: issueRecordingPackageGrant
      summary: Issue an immutable package-prefix playback exchange after CMS entitlement checks.
      description: Requires a ready CMS-owned package matching recordingId. The owning CMS must check the current
        viewer entitlement and publication before calling. Media retention and the supplied publication expiry clamp
        the one-hour playback credential; no mutable staging path is signed. The authenticated playback base optionally
        serves previews/index.vtt (text/vtt) and previews/seg-NNNNNN.jpg (image/jpeg), each bounded to 1 MiB and
        authorized identically to HLS including cache hits. WEBVTT cues reference five-second 160x90 sprite cells
        relative to the index; absent previews return 404 without affecting video readiness. Derived paths are server-only
        and excluded from producer inventories and PUT signing. See docs/member-video-operations.md for the canonical
        preview contract.
      tags:
      - Private
      x-hhc-visibility: private
      x-hhc-callers:
      - hhc-web-api
      security:
      - daprCaller: []
      - workloadPrincipal: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - recordingId
              - scopeId
              - recordingExpiresAt
              properties:
                recordingId:
                  type: string
                scopeId:
                  type: string
                recordingExpiresAt:
                  type: string
                  format: date-time
      responses:
        '200':
          $ref: '#/components/responses/RecordingGrant'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /priv/recording-captures:
    post:
      operationId: createRecordingCapture
      summary: createRecordingCapture
      description: Private progressive intake. CMS enforces a stop receipt before seal. Confirm queues durable validation;
        PUT/listing evidence is not immutable hash/media verification. Progress exposes only the published three-rendition
        common waterline. Live grants require three verified segments and are bounded by five minutes and capture/replay
        expiry.
      tags:
      - Private
      x-hhc-visibility: private
      x-hhc-callers:
      - hhc-web-api
      x-hhc-cache: private, no-store
      security:
      - daprCaller: []
      - workloadPrincipal: []
      parameters:
      - $ref: '#/components/parameters/RecordingActorID'
      responses:
        '201':
          description: Accepted operation result; acceptance is not verified media readiness.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingCaptureResult'
        '400':
          description: Rejected request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingCaptureErrorResponse'
        '401':
          description: Rejected request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingCaptureErrorResponse'
        '403':
          description: Rejected request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingCaptureErrorResponse'
        '404':
          description: Rejected request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingCaptureErrorResponse'
        '409':
          description: State/key conflict or missing objects; poll and reconcile before retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingCaptureErrorResponse'
        '410':
          description: Fixed capture deadline passed; preserve local media.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingCaptureErrorResponse'
        '413':
          description: Rejected request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingCaptureErrorResponse'
        '429':
          description: Retry after the Retry-After delay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingCaptureErrorResponse'
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
              description: Seconds until retry.
        '503':
          description: Temporary dependency failure; capped backoff with jitter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingCaptureErrorResponse'
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
              description: Seconds until retry.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordingCaptureCreateInput'
  /priv/recording-captures/{captureId}/broadcast-signal:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - closeIfIdle
              additionalProperties: false
              properties:
                closeIfIdle:
                  type: boolean
                  description: False after CMS Stop; recover an existing cutoff without creating a new one.
      operationId: reconcileRecordingBroadcastSignal
      summary: Reconcile a direct broadcast signal deadline
      description: CMS calls only for a public direct stream. Atomically freezes the contiguous confirmed three-rendition
        end after 60 seconds without a new segment following the expected next segment time. Does not validate,
        stop, seal, release input or publish. Duplicate confirms do not renew the clock. Late uploads remain accepted
        for the original capture.
      tags:
      - Private
      x-hhc-visibility: private
      x-hhc-callers:
      - hhc-web-api
      x-hhc-cache: private, no-store
      security:
      - daprCaller: []
      parameters:
      - $ref: '#/components/parameters/RecordingActorID'
      - name: captureId
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-f0-9]{32}$
      responses:
        '200':
          description: Current receipt clock and immutable cutoff, if elapsed.
          content:
            application/json:
              schema:
                type: object
                required:
                - state
                - lastMediaConfirmedAt
                - deadline
                - endSequenceExclusive
                properties:
                  state:
                    type: string
                    enum:
                    - waiting
                    - healthy
                    - interrupted
                    - ended
                  lastMediaConfirmedAt:
                    type:
                    - string
                    - 'null'
                    format: date-time
                  deadline:
                    type:
                    - string
                    - 'null'
                    format: date-time
                  endSequenceExclusive:
                    type:
                    - integer
                    - 'null'
                    minimum: 1
                    maximum: 4320
        '403':
          description: Caller or owner is not authorized.
        '404':
          description: Capture does not exist.
        '409':
          description: Capture is not a broadcast.
        '503':
          description: Dependency unavailable; retain state and retry with backoff.
  /priv/recording-captures/{captureId}:
    get:
      operationId: getRecordingCapture
      summary: getRecordingCapture
      description: Private progressive intake. CMS enforces a stop receipt before seal. Confirm queues durable validation;
        PUT/listing evidence is not immutable hash/media verification. Progress exposes only the published three-rendition
        common waterline. Live grants require three verified segments and are bounded by five minutes and capture/replay
        expiry.
      tags:
      - Private
      x-hhc-visibility: private
      x-hhc-callers:
      - hhc-web-api
      x-hhc-cache: private, no-store
      security:
      - daprCaller: []
      - workloadPrincipal: []
      parameters:
      - $ref: '#/components/parameters/RecordingActorID'
      - name: captureId
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-f0-9]{32}$
      - name: cursor
        in: query
        required: false
        schema:
          type: string
          maxLength: 128
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          default: 1000
      responses:
        '200':
          description: Accepted operation result; acceptance is not verified media readiness.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingCaptureStatus'
        '400':
          description: Rejected request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingCaptureErrorResponse'
        '401':
          description: Rejected request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingCaptureErrorResponse'
        '403':
          description: Rejected request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingCaptureErrorResponse'
        '404':
          description: Rejected request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingCaptureErrorResponse'
        '409':
          description: State/key conflict or missing objects; poll and reconcile before retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingCaptureErrorResponse'
        '410':
          description: Fixed capture deadline passed; preserve local media.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingCaptureErrorResponse'
        '413':
          description: Rejected request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingCaptureErrorResponse'
        '429':
          description: Retry after the Retry-After delay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingCaptureErrorResponse'
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
              description: Seconds until retry.
        '503':
          description: Temporary dependency failure; capped backoff with jitter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingCaptureErrorResponse'
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
              description: Seconds until retry.
  /priv/recording-captures/{captureId}/objects:
    post:
      operationId: declareRecordingCapture
      summary: declareRecordingCapture
      description: Private progressive intake. CMS enforces a stop receipt before seal. Confirm queues durable validation;
        PUT/listing evidence is not immutable hash/media verification. Progress exposes only the published three-rendition
        common waterline. Live grants require three verified segments and are bounded by five minutes and capture/replay
        expiry.
      tags:
      - Private
      x-hhc-visibility: private
      x-hhc-callers:
      - hhc-web-api
      x-hhc-cache: private, no-store
      security:
      - daprCaller: []
      - workloadPrincipal: []
      parameters:
      - $ref: '#/components/parameters/RecordingActorID'
      - name: captureId
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-f0-9]{32}$
      responses:
        '200':
          description: Accepted operation result; acceptance is not verified media readiness.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingCaptureResult'
        '400':
          description: Rejected request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingCaptureErrorResponse'
        '401':
          description: Rejected request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingCaptureErrorResponse'
        '403':
          description: Rejected request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingCaptureErrorResponse'
        '404':
          description: Rejected request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingCaptureErrorResponse'
        '409':
          description: State/key conflict or missing objects; poll and reconcile before retry.
