components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    RecordingActorID:
      name: X-HHC-Actor-ID
      in: header
      required: true
      schema:
        type: string
        format: uuid
    RecordingPackageID:
      name: packageID
      in: path
      required: true
      schema:
        type: string
        pattern: ^[a-f0-9]{32}$
  responses:
    Error:
      description: Stable Asset API error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RecordingGrant:
      description: One-minute exchange credential, never a public URL.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RecordingMediaGrant'
  schemas:
    BroadcastPreviewGrant:
      type: object
      additionalProperties: false
      required:
      - recordingId
      - captureId
      - epoch
      - purpose
      - scope
      - mediaPath
      - exchangeCredential
      - issuedAt
      - expiresAt
      properties:
        recordingId:
          type: string
          format: uuid
        captureId:
          type: string
          pattern: ^[a-f0-9]{32}$
        epoch:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        purpose:
          type: string
          enum:
          - staff-preview
        scope:
          type: string
          format: uuid
        mediaPath:
          type: string
          description: Only /videos/{recordingId}/captures/{captureId}/previews/{scope}/master.m3u8; cookie sibling.
            Cannot exchange or read a member sessions URL.
        exchangeCredential:
          type: string
        issuedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
    BroadcastPreviewGrantInput:
      type: object
      additionalProperties: false
      required:
      - recordingId
      - epoch
      - userId
      - playbackScopeId
      - expiresAt
      properties:
        recordingId:
          type: string
          format: uuid
        epoch:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        userId:
          type: string
          format: uuid
          description: Authenticated staff user; CMS enforces current staff authorization.
        playbackScopeId:
          type: string
          format: uuid
        expiresAt:
          type: string
          format: date-time
    BroadcastProjection:
      type: object
      additionalProperties: false
      required:
      - epoch
      - rangeRevision
      - state
      - startSequence
      - endSequenceExclusive
      - mediaStartSeconds
      - durationSeconds
      - revision
      properties:
        epoch:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        rangeRevision:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        state:
          type: string
          enum:
          - pending
          - ready
          - failed
        startSequence:
          type:
          - integer
          - 'null'
          minimum: 0
          maximum: 2147483647
        endSequenceExclusive:
          type:
          - integer
          - 'null'
          minimum: 0
          maximum: 2147483647
        mediaStartSeconds:
          type:
          - number
          - 'null'
          minimum: 0
        durationSeconds:
          type:
          - number
          - 'null'
          minimum: 0
        revision:
          type: integer
          minimum: 1
          maximum: 9007199254740991
    BroadcastRangeInput:
      type: object
      additionalProperties: false
      required:
      - recordingId
      - epoch
      - rangeRevision
      - startSequence
      - endSequenceExclusive
      - revoked
      properties:
        recordingId:
          type: string
          format: uuid
        epoch:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        rangeRevision:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        startSequence:
          type:
          - integer
          - 'null'
          minimum: 0
          maximum: 2147483647
        endSequenceExclusive:
          type:
          - integer
          - 'null'
          minimum: 0
          maximum: 2147483647
        revoked:
          type: boolean
        memberState:
          type: string
          enum:
          - live
          - blocked
          - vod
          default: blocked
          description: CMS-owned member admission; absent denies member bytes. Live permits the verified range intersection;
            vod additionally permits published package playback.
    ErrorResponse:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
              enum:
              - AST_INVALID_REQUEST
              - AST_INVALID_RANGE
              - AST_INVALID_TICKET
              - AST_UNAUTHORIZED
              - AST_FORBIDDEN
              - AST_NOT_FOUND
              - AST_CONFLICT
              - AST_NOT_READY
              - AST_INTERNAL
              - asset-not-ready
              - quota-exceeded
            message:
              type: string
            data:
              type: object
              additionalProperties: true
    RecordingCaptureAbortInput:
      type: object
      additionalProperties: false
      required:
      - operationKey
      - reasonCode
      properties:
        operationKey:
          type: string
          pattern: ^[a-zA-Z0-9._:-]{1,128}$
        reasonCode:
          type: string
          enum:
          - user_abort
          - disk_limit
          - encoder_failure
          - capture_incomplete
    RecordingCaptureConfirmInput:
      type: object
      additionalProperties: false
      required:
      - operationKey
      - paths
      properties:
        operationKey:
          type: string
          pattern: ^[a-zA-Z0-9._:-]{1,128}$
        paths:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: string
            pattern: ^(master\.m3u8|(480p|720p|1080p)/(index\.m3u8|init\.mp4|seg-[0-9]{6}\.m4s))$
          uniqueItems: true
    RecordingCaptureCreateInput:
      type: object
      additionalProperties: false
      required:
      - recordingId
      - operationKey
      properties:
        segmentFrames:
          type: integer
          enum:
          - 300
          - 900
          description: S10 opt-in for B1 captures only. Omitted means 900; 300 requires 30000/1001 fps and preset
            obs-hls-10s-v1 at seal. Immutable per capture.
        broadcastEpoch:
          type: integer
          minimum: 1
          maximum: 9007199254740991
          description: Private CMS B1 binding epoch. Omit for unchanged legacy C1 intake. Present initializes deny-all
            range revision 1 before successful create.
        recordingId:
          type: string
          format: uuid
        operationKey:
          type: string
          pattern: ^[a-zA-Z0-9._:-]{1,128}$
    RecordingCaptureDeclareInput:
      type: object
      additionalProperties: false
      required:
      - operationKey
      - objects
      properties:
        operationKey:
          type: string
          pattern: ^[a-zA-Z0-9._:-]{1,128}$
        objects:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/RecordingPackageObject'
    RecordingCaptureError:
      type: object
      additionalProperties: false
      required:
      - code
      - message
      properties:
        code:
          type: string
          enum:
          - capture_invalid
          - capture_unauthorized
          - capture_forbidden
          - capture_not_found
          - capture_conflict
          - capture_missing_objects
          - capture_expired
          - capture_too_large
          - capture_rate_limited
          - capture_unavailable
        message:
          type: string
    RecordingCaptureErrorResponse:
      type: object
      additionalProperties: false
      required:
      - error
      properties:
        error:
          $ref: '#/components/schemas/RecordingCaptureError'
    RecordingCaptureObjectStatus:
      type: object
      additionalProperties: false
      required:
      - path
      - sizeBytes
      - sha256
      - state
      properties:
        path:
          type: string
          pattern: ^(master\.m3u8|(480p|720p|1080p)/(index\.m3u8|init\.mp4|seg-[0-9]{6}\.m4s))$
        sizeBytes:
          type: integer
          minimum: 1
          maximum: 134217728
        sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        state:
          type: string
          enum:
          - declared
          - queued
          - verified
          - failed
    RecordingCaptureReceipt:
      type: object
      additionalProperties: false
      required:
      - operationKey
      - operation
      - acceptedAt
      - captureId
      properties:
        operationKey:
          type: string
          pattern: ^[a-zA-Z0-9._:-]{1,128}$
        operation:
          type: string
          enum:
          - create
          - declare
          - confirm
          - stop
          - seal
          - abort
          - cancel_auto_publish
          - close_live
        acceptedAt:
          type: string
          format: date-time
          description: UTC RFC3339 timestamp emitted with Z suffix.
        captureId:
          type: string
          pattern: ^[a-f0-9]{32}$
    RecordingCaptureResult:
      type: object
      additionalProperties: false
      required:
      - capture
      - receipt
      properties:
        capture:
          $ref: '#/components/schemas/RecordingCaptureStatus'
        receipt:
          $ref: '#/components/schemas/RecordingCaptureReceipt'
    RecordingCaptureSealInput:
      type: object
      additionalProperties: false
      required:
      - operationKey
      - normalEnd
      - inventory
      properties:
        operationKey:
          type: string
          pattern: ^[a-zA-Z0-9._:-]{1,128}$
        normalEnd:
          type: boolean
          const: true
        inventory:
          allOf:
          - $ref: '#/components/schemas/RecordingPackageInventory'
          - type: object
            properties:
              renditions:
                type: array
                minItems: 3
                maxItems: 3
    RecordingCaptureSignInput:
      type: object
      additionalProperties: false
      required:
      - paths
      properties:
        paths:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: string
            pattern: ^(master\.m3u8|(480p|720p|1080p)/(index\.m3u8|init\.mp4|seg-[0-9]{6}\.m4s))$
          uniqueItems: true
    RecordingCaptureSignedObjects:
      type: array
      minItems: 1
      maxItems: 100
      items:
        $ref: '#/components/schemas/SignedRecordingObject'
    RecordingCaptureStatus:
      type: object
      additionalProperties: false
      required:
      - captureId
      - recordingId
      - state
      - createdAt
      - expiresAt
      - declaredBytes
      - declaredObjects
      - objects
      - nextCursor
      - packageId
      - terminalAt
      - terminalReason
      - progress
      properties:
        captureId:
          type: string
          pattern: ^[a-f0-9]{32}$
        recordingId:
          type: string
          format: uuid
        state:
          type: string
          enum:
          - uploading
          - freezing
          - validating
          - ready
          - failed
          - expired
          - aborted
        createdAt:
          type: string
          format: date-time
          description: UTC RFC3339 timestamp emitted with Z suffix.
        expiresAt:
          type: string
          format: date-time
          description: UTC RFC3339 timestamp emitted with Z suffix.
        declaredBytes:
          type: integer
          format: int64
          minimum: 0
          maximum: 10000000000
        declaredObjects:
          type: integer
          format: int64
          minimum: 0
          maximum: 13000
        objects:
          type: array
          minItems: 0
          maxItems: 1000
          items:
            $ref: '#/components/schemas/RecordingCaptureObjectStatus'
        nextCursor:
          type: string
          maxLength: 128
        packageId:
          type:
          - string
          - 'null'
          pattern: ^[a-f0-9]{32}$
        terminalAt:
          type:
          - string
          - 'null'
          format: date-time
          description: UTC RFC3339 timestamp emitted with Z suffix.
        terminalReason:
          type:
          - string
          - 'null'
          maxLength: 128
        progress:
          $ref: '#/components/schemas/RecordingLiveProgress'
    RecordingCover:
      type: object
      required:
      - id
      - uploadId
      - kind
      - state
      properties:
        id:
          type: string
          description: Opaque image identifier; not an object key.
        uploadId:
          type: string
        kind:
          type: string
          enum:
          - auto
          - custom
        state:
          type: string
          enum:
          - uploading
          - pending
          - processing
          - ready
          - failed
          - expired
        operationKey:
          type: string
          description: Custom upload idempotency key.
    RecordingLiveGrantInput:
      type: object
      additionalProperties: false
      required:
      - recordingId
      - userId
      - playbackScopeId
      - expiresAt
      properties:
        recordingId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        playbackScopeId:
          type: string
          format: uuid
        expiresAt:
          type: string
          format: date-time
          description: UTC RFC3339 timestamp emitted with Z suffix.
    RecordingLiveProgress:
      type: object
      additionalProperties: false
      required:
      - revision
      - firstSequence
      - lastSequence
      - mediaEndSeconds
      - lastAdvancedAt
      - endedAt
      - ended
      properties:
        revision:
          type: integer
          format: int64
          minimum: 0
        firstSequence:
          type: integer
          const: 0
        lastSequence:
          type: integer
          minimum: -1
          maximum: 4319
        mediaEndSeconds:
          type: number
          minimum: 0
          maximum: 43200
        lastAdvancedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: UTC RFC3339 timestamp emitted with Z suffix.
        endedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: UTC RFC3339 timestamp emitted with Z suffix.
        ended:
          type: boolean
    RecordingMediaGrant:
      type: object
      required:
      - exchangeCredential
      - expiresAt
      properties:
        exchangeCredential:
          type: string
          description: One-minute body-only bearer, never logged.
        expiresAt:
          type: string
          format: date-time
    RecordingPackage:
      type: object
      additionalProperties: false
      required:
      - packageId
      - sessionId
      - recordingId
      - state
      - sizeBytes
      - createdAt
      - expiresAt
      - inventory
      properties:
        packageId:
          type: string
        sessionId:
          type: string
          description: Same identifier as packageId; one immutable inventory per upload session.
        recordingId:
          type: string
        state:
          type: string
          enum:
          - uploading
          - freezing
          - validating
          - ready
          - failed
          - expired
        sizeBytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 10000000000
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          description: Upload session expiry; not the ready media retention deadline.
        inventory:
          $ref: '#/components/schemas/RecordingPackageInventory'
        readyAt:
          type: string
          format: date-time
        mediaExpiresAt:
          type: string
          format: date-time
          description: Effective authoritative media expiry under the current retention policy; distinct from upload
            expiry.
        uploadedAt:
          type: string
          format: date-time
          description: Immutable accepted upload completion; browser packages inherit source completion.
        retentionRevision:
          type: integer
          format: int64
          minimum: 1
    RecordingPackageInventory:
      type: object
      additionalProperties: false
      description: HLS v1 declared inventory for the gated package upload contract; current MP4 routes do not consume
        it. SHA-256 inventoryDigest hashes UTF-8 encoding/json-compatible serialization with this field omitted,
        objects sorted by path, renditions sorted by name, and fields in the order shown below. Objects exclude
        package.json itself; total package bytes include the serialized inventory. Metadata and hashes are declarations,
        not proof of readiness. Final bytes and media are verified by the recording Job. Master BANDWIDTH and optional
        AVERAGE-BANDWIDTH must match measured media segment bytes and EXTINF durations under RFC 8216 section 4.1,
        not configured encoder bitrates. Ineligible short-tail windows are excluded from peak bandwidth.
      required:
      - schemaVersion
      - presetVersion
      - objects
      - renditions
      - inventoryDigest
      properties:
        schemaVersion:
          type: integer
          const: 1
        presetVersion:
          type: string
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9._-]{0,63}$
        objects:
          type: array
          minItems: 4
          maxItems: 13000
          items:
            $ref: '#/components/schemas/RecordingPackageObject'
        renditions:
          type: array
          minItems: 1
          maxItems: 3
          items:
            $ref: '#/components/schemas/RecordingRendition'
        inventoryDigest:
          type: string
          pattern: ^[a-f0-9]{64}$
    RecordingPackageObject:
      type: object
      additionalProperties: false
      required:
      - path
      - sizeBytes
      - sha256
      properties:
        path:
          type: string
          pattern: ^(master\.m3u8|(480p|720p|1080p)/(index\.m3u8|init\.mp4|seg-[0-9]{6}\.m4s))$
          description: Canonical relative path. Unique paths and every declared rendition's complete contiguous
            segment list are required. No URLs, encoded paths, queries or package.json.
        sizeBytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 134217728
          description: Playlists additionally have a 1048576-byte limit. Package total including inventory must
            be at most 10000000000 bytes.
        sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
    RecordingPackageStatus:
      type: object
      additionalProperties: false
      required:
      - packageId
      - sessionId
      - recordingId
      - state
      - sizeBytes
      - expiresAt
      - confirmedObjects
      - nextCursor
      properties:
        processingProgress:
          $ref: '#/components/schemas/RecordingProcessingProgress'
        packageId:
          type: string
        sessionId:
          type: string
        recordingId:
          type: string
        state:
          type: string
          enum:
          - uploading
          - freezing
          - validating
          - ready
          - failed
          - expired
        sizeBytes:
          type: integer
          format: int64
        expiresAt:
          type: string
          format: date-time
        confirmedObjects:
          type: array
          maxItems: 1000
          items:
            type: string
        nextCursor:
          type: string
          description: Last examined path; empty when this pass is complete.
        readyAt:
          type: string
          format: date-time
        mediaExpiresAt:
          type: string
          format: date-time
        uploadedAt:
          type: string
          format: date-time
        retentionRevision:
          type: integer
          format: int64
          minimum: 1
        renditions:
          type: array
          minItems: 1
          maxItems: 3
          items:
            $ref: '#/components/schemas/RecordingRendition'
    RecordingPartTarget:
      type: object
      required:
      - url
      - method
      - headers
      properties:
        url:
          type: string
          format: uri
        method:
          type: string
          const: PUT
        headers:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    RecordingProcessingProgress:
      type: object
      additionalProperties: false
      description: Advisory attempt-scoped progress only. Missing counters mean unknown; heartbeat never implies
        forward progress or readiness.
      required:
      - attempt
      - phase
      - attemptStartedAt
      - phaseStartedAt
      - lastProgressAt
      - heartbeatAt
      properties:
        attempt:
          type: integer
          minimum: 0
          maximum: 3
        phase:
          type: string
          enum:
          - queued
          - source_finalization
          - encoding
          - package_validation
          - package_finalization
        rendition:
          type: string
          enum:
          - 480p
          - 720p
          - 1080p
        objectsVerified:
          type: integer
          format: int64
          minimum: 0
        objectsTotal:
          type: integer
          format: int64
          minimum: 0
        segmentsVerified:
          type: integer
          format: int64
          minimum: 0
        segmentsTotal:
          type: integer
          format: int64
          minimum: 0
        bytesVerified:
          type: integer
          format: int64
          minimum: 0
        bytesTotal:
          type: integer
          format: int64
          minimum: 0
        attemptStartedAt:
          type: string
          format: date-time
        phaseStartedAt:
          type: string
          format: date-time
        lastProgressAt:
          type: string
          format: date-time
        heartbeatAt:
          type: string
          format: date-time
    RecordingRendition:
      type: object
      additionalProperties: false
      required:
      - name
      - width
      - height
      - frameRate
      - videoBitrate
      - audioBitrate
      - durationSeconds
      - segmentCount
      properties:
        name:
          type: string
          enum:
          - 480p
          - 720p
          - 1080p
          description: 720p is mandatory for backward compatibility; 480p and 1080p optional. Names are unique;
            each additional rung has distinct dimensions and ordered bitrates.
        width:
          type: integer
          minimum: 2
          maximum: 1920
          multipleOf: 2
          description: 480p maximum width is 854; 720p maximum width is 1280; source must never be upscaled.
        height:
          type: integer
          minimum: 2
          maximum: 1080
          multipleOf: 2
          description: 480p maximum height is 480; 720p maximum height is 720. Actual dimensions are retained for
            smaller sources.
        frameRate:
          type: number
          exclusiveMinimum: 0
          maximum: 30
        videoBitrate:
          type: integer
          minimum: 500000
          maximum: 8000000
        audioBitrate:
          type: integer
          const: 128000
        durationSeconds:
          type: number
          exclusiveMinimum: 0
          maximum: 43200
        segmentCount:
          type: integer
          minimum: 1
          maximum: 4320
          description: Actual number of contiguous media segments, including a legal short final segment; validated
            against playlists and decoded media, not inferred from duration. All renditions require aligned actual
            boundaries. The obs-hls-10s-v1 profile allows up to 4320 segments; other profiles remain limited to
            1440.
    SignedRecordingObject:
      allOf:
      - $ref: '#/components/schemas/RecordingPartTarget'
      - type: object
        required:
        - path
        properties:
          path:
            type: string
  securitySchemes:
    daprCaller:
      type: apiKey
      in: header
      name: dapr-api-token
      description: Dapr app-channel token with the authenticated Dapr caller identity.
    workloadPrincipal:
      type: apiKey
      in: header
      name: X-MS-CLIENT-PRINCIPAL
      description: Validated Azure workload principal. The configured LINE workload principal maps to `hhc-line-function-bot`.
