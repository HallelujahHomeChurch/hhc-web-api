      - type: object
        additionalProperties: false
        required:
        - mode
        - uploadId
        properties:
          mode:
            type: string
            enum:
            - custom
          uploadId:
            type: string
            pattern: ^[A-Za-z0-9-]{1,128}$
    LiveCoverSettings:
      type: object
      additionalProperties: false
      required:
      - revision
      - selection
      - coverState
      properties:
        revision:
          type: integer
          minimum: 1
          format: int64
        selection:
          $ref: '#/components/schemas/LiveCoverSelection'
        coverState:
          type: string
          enum:
          - none
          - waiting
          - pending
          - ready
          - failed
        coverId:
          type: string
          maxLength: 128
        contentPath:
          type: string
          pattern: ^/api/admin/recordings/
        inheritedRevision:
          type: integer
          minimum: 1
          format: int64
    MemberLiveRecording:
      type: object
      additionalProperties: false
      required:
      - id
      - captureId
      - title
      - liveState
      - createdAt
      - stopAcceptedAt
      - progress
      properties:
        coverRevision:
          type: string
          maxLength: 128
          description: Immutable active image identity; changes only after a ready image becomes effective.
        id:
          type: string
          format: uuid
        captureId:
          type: string
          pattern: ^[a-f0-9]{32}$
        title:
          type: string
          maxLength: 180
        description:
          $ref: '#/components/schemas/RecordingDescription'
        liveState:
          type: string
          enum:
          - starting
          - live
          - recovering
          - interrupted
          - ending
          - ended
          - failed
          - expired
          - aborted
        createdAt:
          type: string
          format: date-time
          description: UTC RFC3339 timestamp emitted with Z suffix.
        stopAcceptedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: UTC RFC3339 timestamp emitted with Z suffix.
        progress:
          $ref: '#/components/schemas/RecordingLiveProgress'
    MemberRecording:
      type: object
      additionalProperties: false
      required:
      - id
      - title
      - uploadedAt
      - expiresAt
      - featured
      - hidden
      - status
      - version
      properties:
        id:
          type: string
          format: uuid
        selectedCoverId:
          type: string
          pattern: ^[A-Za-z0-9-]{1,128}$
          description: Optional explicit CMS selection. An absent value may use default auto cover; member clients
            may lazily request the current cover endpoint.
        title:
          type: string
          minLength: 1
          maxLength: 180
        description:
          $ref: '#/components/schemas/RecordingDescription'
        uploadedAt:
          type:
          - string
          - 'null'
          format: date-time
        expiresAt:
          type:
          - string
          - 'null'
          format: date-time
        featured:
          type: boolean
        hidden:
          type: boolean
        status:
          type: string
          enum:
          - draft
          - published
        primaryAssetVersionId:
          type: string
        packageId:
          type: string
          pattern: ^[a-f0-9]{32}$
        sourceId:
          type: string
          pattern: ^[a-f0-9]{32}$
          description: Immutable browser source reference for Admin resume and processing status.
        readyAt:
          type: string
          format: date-time
        durationSeconds:
          type: number
          minimum: 0
        version:
          type: integer
          format: int64
          minimum: 1
    RecordingCoverUploadEnvelope:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          $ref: '#/components/schemas/RecordingCoverUpload'
        meta:
          type: object
          additionalProperties: true
        error:
          type:
          - 'null'
    RecordingCoverUpload:
      type: object
      additionalProperties: false
      required:
      - uploadId
      - state
      properties:
        uploadId:
          type: string
          pattern: ^[A-Za-z0-9-]{1,128}$
        state:
          type: string
          enum:
          - uploading
          - pending
          - processing
          - ready
          - failed
          - expired
    RecordingDescription:
      type: string
      maxLength: 5000
      pattern: ^[^\x00]*$
      description: Optional plain-text video description; Unicode code points, no HTML rendering. Omission preserves
        the saved value on update; an empty string clears it.
    RecordingLiveProgress:
      type: object
      additionalProperties: false
      required:
      - revision
      - firstSequence
      - lastSequence
      - mediaEndSeconds
      - lastAdvancedAt
      - endedAt
      - ended
      properties:
        revision:
          type: integer
          format: int64
          minimum: 0
        firstSequence:
          type: integer
          const: 0
        lastSequence:
          type: integer
          minimum: -1
          maximum: 1439
        mediaEndSeconds:
          type: number
          minimum: 0
          maximum: 43200
        lastAdvancedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: UTC RFC3339 timestamp emitted with Z suffix.
        endedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: UTC RFC3339 timestamp emitted with Z suffix.
        ended:
          type: boolean
