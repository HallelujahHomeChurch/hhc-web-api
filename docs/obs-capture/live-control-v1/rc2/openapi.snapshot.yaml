        live:
          anyOf:
          - $ref: '#/components/schemas/MemberLiveRecording'
          - type: 'null'
        mediaStartSeconds:
          anyOf:
          - type: number
            minimum: 0
          - type: 'null'
        durationSeconds:
          anyOf:
          - type: number
            minimum: 0
          - type: 'null'
    BroadcastWatchListEnvelope:
      type: object
      additionalProperties: false
      required:
      - data
      - meta
      - error
      properties:
        data:
