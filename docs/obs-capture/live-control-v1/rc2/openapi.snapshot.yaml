          - preview
          - start_pending
          - live
          - end_pending
          - processing
          - archived
          - cancelled
          - failed
        announced:
          type: boolean
        scheduledAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        title:
          type: string
          minLength: 1
          maxLength: 180
        description:
          $ref: '#/components/schemas/RecordingDescription'
        policy:
          $ref: '#/components/schemas/BroadcastPolicy'
        cover:
          $ref: '#/components/schemas/LiveCoverSettings'
        binding:
          anyOf:
          - $ref: '#/components/schemas/BroadcastBinding'
