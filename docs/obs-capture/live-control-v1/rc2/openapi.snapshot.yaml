          - healthy
          - interrupted
          - recovering
        lastConfirmedAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        lastPublishedAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        verifiedEndSeconds:
          anyOf:
          - type: number
            minimum: 0
          - type: 'null'
        queuedObjects:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
        reason:
          anyOf:
          - type: string
          - type: 'null'
    BroadcastViewEnvelope:
      type: object
      additionalProperties: false
      required:
      - data
      - meta
      - error
      properties:
        data:
          $ref: '#/components/schemas/BroadcastView'
        meta:
          type: object
          additionalProperties: true
        error:
          type: 'null'
    BroadcastWatchEnvelope:
      type: object
      additionalProperties: false
      required:
      - data
      - meta
      - error
      properties:
        data:
          $ref: '#/components/schemas/BroadcastWatch'
        meta:
          type: object
          additionalProperties: true
        error:
          type: 'null'
    BroadcastWatch:
      type: object
      additionalProperties: false
      required:
      - recordingId
      - title
      - description
      - view
      - scheduledAt
      - serverNow
      - cover
      - stateRevision
      properties:
        recordingId:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 180
        description:
          $ref: '#/components/schemas/RecordingDescription'
        view:
          type: string
          enum:
          - waiting
          - live
          - processing
          - vod
          - cancelled
          - expired
          - unavailable
        scheduledAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        serverNow:
          type: string
          format: date-time
        cover:
          anyOf:
          - type: object
            additionalProperties: false
            required:
            - revision
            - contentPath
            properties:
              revision:
