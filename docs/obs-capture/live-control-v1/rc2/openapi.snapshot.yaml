      properties:
        captureId:
          type: string
          pattern: ^[a-f0-9]{32}$
        epoch:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        actorId:
          type: string
          format: uuid
    BroadcastBoundaries:
      type: object
      additionalProperties: false
      required:
      - startSequence
      - endSequenceExclusive
