        startSequence:
          anyOf:
          - type: integer
            minimum: 0
            maximum: 2147483647
          - type: 'null'
        endSequenceExclusive:
          anyOf:
          - type: integer
            minimum: 0
            maximum: 2147483647
          - type: 'null'
        revision:
          type: integer
          minimum: 1
          maximum: 9007199254740991
    BroadcastHealth:
      type: object
      additionalProperties: false
