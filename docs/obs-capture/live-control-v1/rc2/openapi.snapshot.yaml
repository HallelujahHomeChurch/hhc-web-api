components:
  securitySchemes:
    daprApiToken:
      type: apiKey
      in: header
      name: dapr-api-token
      description: Dapr API token supplied by api-gateway; the value is never published in this contract.
    daprCallerAppId:
      type: apiKey
      in: header
      name: Dapr-Caller-App-Id
      description: Must identify the configured api-gateway Dapr application.
    trustedUserId:
      type: apiKey
      in: header
      name: X-HHC-User-ID
      description: Sanitized Account user identifier injected by api-gateway.
    trustedAuthProvider:
      type: apiKey
      in: header
      name: X-HHC-Auth-Provider
      description: Must be account-api.
    trustedPrincipalId:
      type: apiKey
      in: header
      name: X-HHC-Principal-ID
      description: Sanitized service principal UUID injected by api-gateway; never accepted directly from clients.
    trustedPrincipalType:
      type: apiKey
      in: header
      name: X-HHC-Principal-Type
      description: Must be service for the service-principal security alternative. Human identity retains trustedUserId.
    trustedClientId:
      type: apiKey
      in: header
      name: X-HHC-Client-ID
      description: Sanitized Account client identifier injected by api-gateway.
    trustedCredentialId:
      type: apiKey
      in: header
      name: X-HHC-Credential-ID
      description: Sanitized service credential UUID injected by api-gateway; this is an identifier, never a secret.
    trustedScopes:
      type: apiKey
      in: header
      name: X-HHC-Scopes
      description: Sanitized Account scopes injected by api-gateway and enforced per operation.
  responses:
    AdminForbidden:
      description: The trusted Account identity lacks a required scope.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    AdminUnauthorized:
      description: Trusted gateway identity is missing or invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    BroadcastFailure:
      description: B1 operation rejected or dependency unavailable; failed responses never prove a state transition.
      headers:
        Retry-After:
          description: Retry delay for unavailable dependencies.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BroadcastErrorEnvelope'
  schemas:
    BroadcastBindInput:
      type: object
      additionalProperties: false
      required:
      - operationKey
      - expectedRevision
      - protocolVersion
      properties:
        operationKey:
          type: string
          pattern: ^[a-zA-Z0-9._:-]{1,128}$
        expectedRevision:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        protocolVersion:
          type: string
          minLength: 1
          maxLength: 64
    BroadcastCapabilitiesEnvelope:
      type: object
      additionalProperties: false
      required:
      - data
      - meta
      - error
      properties:
        data:
          $ref: '#/components/schemas/BroadcastCapabilities'
        meta:
          type: object
          additionalProperties: true
        error:
          type: 'null'
    BroadcastCapabilities:
      type: object
      additionalProperties: false
      required:
      - versions
      - maxActiveCaptures
      - markerMode
      properties:
        versions:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum:
            - b1-2026-10-10.rc1
        maxActiveCaptures:
          type: integer
          enum:
          - 1
        markerMode:
          type: string
          enum:
          - next-common-segment
    BroadcastControlEnvelope:
      type: object
      additionalProperties: false
      required:
      - data
      - meta
      - error
      properties:
        data:
          $ref: '#/components/schemas/BroadcastControl'
        meta:
          type: object
          additionalProperties: true
        error:
          type: 'null'
    BroadcastControl:
      type: object
      additionalProperties: false
      required:
      - revision
      - phase
      - pendingCommand
      properties:
        revision:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        phase:
          type: string
          enum:
          - draft
          - scheduled
          - preview
          - start_pending
          - live
          - end_pending
          - processing
          - archived
          - cancelled
          - failed
        pendingCommand:
          anyOf:
          - $ref: '#/components/schemas/BroadcastCommand'
          - type: 'null'
    BroadcastCommand:
      type: object
      additionalProperties: false
      required:
      - commandId
      - kind
      - captureId
      - epoch
      - requestedAt
      - status
      - boundarySequence
      properties:
        commandId:
          type: string
          format: uuid
        kind:
          type: string
          enum:
          - start
          - end
        captureId:
          type: string
          pattern: ^[a-f0-9]{32}$
        epoch:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        requestedAt:
          type: string
          format: date-time
        status:
          type: string
          enum:
          - pending
          - acknowledged
          - cancelled
          - rejected
        boundarySequence:
          anyOf:
          - type: integer
            minimum: 0
            maximum: 2147483647
          - type: 'null'
    BroadcastCreateInput:
      type: object
      additionalProperties: false
      required:
      - operationKey
      - title
      - description
      - scheduledAt
      - policy
      properties:
        operationKey:
          type: string
          pattern: ^[a-zA-Z0-9._:-]{1,128}$
        title:
          type: string
          minLength: 1
          maxLength: 180
        description:
          $ref: '#/components/schemas/RecordingDescription'
        scheduledAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        policy:
          $ref: '#/components/schemas/BroadcastPolicy'
        cover:
          $ref: '#/components/schemas/LiveCoverSelection'
    BroadcastEmergencyCloseInput:
      type: object
      additionalProperties: false
      required:
      - operationKey
      - expectedRevision
      - reason
      properties:
        operationKey:
          type: string
          pattern: ^[a-zA-Z0-9._:-]{1,128}$
        expectedRevision:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        reason:
          type: string
          minLength: 1
          maxLength: 500
    BroadcastErrorEnvelope:
      type: object
      additionalProperties: false
      required:
      - data
      - meta
      - error
      properties:
        data:
          type: 'null'
        meta:
          type: object
          additionalProperties: true
        error:
          type: object
          additionalProperties: false
          required:
          - code
          - message
          properties:
            code:
              type: string
              enum:
              - broadcast_invalid
              - broadcast_not_found
              - broadcast_state_conflict
              - broadcast_already_bound
              - broadcast_active_limit
              - broadcast_epoch_mismatch
              - broadcast_boundary_conflict
              - broadcast_operation_conflict
              - broadcast_revision_conflict
              - broadcast_protocol_unsupported
              - unauthorized
              - forbidden
              - rate_limited
              - unavailable
            message:
              type: string
    BroadcastListEnvelope:
      type: object
      additionalProperties: false
      required:
      - data
      - meta
      - error
      properties:
        data:
          $ref: '#/components/schemas/BroadcastList'
        meta:
          type: object
          additionalProperties: true
        error:
          type: 'null'
    BroadcastList:
      type: object
      additionalProperties: false
      required:
      - items
      - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BroadcastView'
        nextCursor:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
    BroadcastMarkerAckInput:
      type: object
      additionalProperties: false
      required:
      - operationKey
      - captureId
      - epoch
      - boundarySequence
      properties:
        operationKey:
          type: string
          pattern: ^[a-zA-Z0-9._:-]{1,128}$
        captureId:
          type: string
          pattern: ^[a-f0-9]{32}$
        epoch:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        boundarySequence:
          type: integer
          minimum: 0
          maximum: 2147483647
    BroadcastMutationInput:
      type: object
      additionalProperties: false
      required:
      - operationKey
      - expectedRevision
      properties:
        operationKey:
          type: string
          pattern: ^[a-zA-Z0-9._:-]{1,128}$
        expectedRevision:
          type: integer
          minimum: 1
          maximum: 9007199254740991
    BroadcastMutationResultEnvelope:
      type: object
      additionalProperties: false
      required:
      - data
      - meta
      - error
      properties:
        data:
          $ref: '#/components/schemas/BroadcastMutationResult'
        meta:
          type: object
          additionalProperties: true
        error:
          type: 'null'
    BroadcastMutationResult:
      type: object
      additionalProperties: false
      required:
      - broadcast
      - receipt
      properties:
        broadcast:
          $ref: '#/components/schemas/BroadcastView'
        receipt:
          $ref: '#/components/schemas/BroadcastReceipt'
    BroadcastPolicy:
      type: object
      additionalProperties: false
      required:
      - autoStart
      - autoEnd
      - autoPublish
      properties:
        autoStart:
          type: boolean
        autoEnd:
          type: boolean
        autoPublish:
          type: boolean
    BroadcastPreviewAccessEnvelope:
      type: object
      additionalProperties: false
      required:
      - data
      - meta
      - error
      properties:
        data:
          $ref: '#/components/schemas/BroadcastPreviewAccess'
        meta:
          type: object
          additionalProperties: true
        error:
          type: 'null'
    BroadcastPreviewAccess:
      type: object
      additionalProperties: false
      required:
      - recordingId
      - captureId
      - epoch
      - purpose
      - playbackScopeId
      - mediaUrl
      - exchangeCredential
      - issuedAt
      - expiresAt
      properties:
