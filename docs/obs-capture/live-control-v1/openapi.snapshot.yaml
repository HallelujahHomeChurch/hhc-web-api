      - Admin
      x-hhc-visibility: admin
      x-hhc-callers:
      - api-gateway
      x-hhc-cache: private, no-store
      x-required-scopes:
      - cms:recordings:read
      x-b1-status: candidate-not-deployed
      security:
      - daprApiToken: []
        daprCallerAppId: []
        trustedUserId: []
        trustedAuthProvider: []
        trustedScopes: []
      servers:
      - url: https://admin.alive.org.tw/api
      responses:
        '200':
          description: BroadcastPreviewAccess
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BroadcastPreviewAccessEnvelope'
        '400':
          description: B1 error; retry 429/503 using the original operation key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BroadcastErrorEnvelope'
        '401':
          description: B1 error; retry 429/503 using the original operation key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BroadcastErrorEnvelope'
        '403':
          description: B1 error; retry 429/503 using the original operation key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BroadcastErrorEnvelope'
        '404':
          description: B1 error; retry 429/503 using the original operation key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BroadcastErrorEnvelope'
        '409':
          description: B1 error; retry 429/503 using the original operation key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BroadcastErrorEnvelope'
        '412':
          description: B1 error; retry 429/503 using the original operation key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BroadcastErrorEnvelope'
        '422':
          description: B1 error; retry 429/503 using the original operation key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BroadcastErrorEnvelope'
        '429':
          description: B1 error; retry 429/503 using the original operation key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BroadcastErrorEnvelope'
          headers:
            Retry-After:
              description: Retry delay in seconds
              schema:
                type: integer
                minimum: 1
        '503':
          description: B1 error; retry 429/503 using the original operation key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BroadcastErrorEnvelope'
          headers:
            Retry-After:
              description: Retry delay in seconds
              schema:
                type: integer
                minimum: 1
      parameters:
      - name: recordingId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BroadcastPreviewInput'
components:
  schemas:
    BroadcastPolicy:
      type: object
      additionalProperties: false
      required:
      - autoStart
      - autoEnd
      - autoPublish
      properties:
        autoStart:
          type: boolean
        autoEnd:
          type: boolean
        autoPublish:
          type: boolean
    BroadcastBinding:
      type: object
      additionalProperties: false
      required:
      - captureId
      - epoch
      - actorId
      properties:
        captureId:
          type: string
          pattern: ^[a-f0-9]{32}$
        epoch:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        actorId:
          type: string
          format: uuid
    BroadcastBoundaries:
      type: object
      additionalProperties: false
      required:
      - startSequence
      - endSequenceExclusive
      - revision
      properties:
        startSequence:
          anyOf:
          - type: integer
            minimum: 0
            maximum: 2147483647
          - type: 'null'
        endSequenceExclusive:
          anyOf:
          - type: integer
            minimum: 0
            maximum: 2147483647
          - type: 'null'
        revision:
          type: integer
          minimum: 1
          maximum: 9007199254740991
    BroadcastCommand:
      type: object
      additionalProperties: false
      required:
      - commandId
      - kind
      - captureId
      - epoch
      - requestedAt
      - status
      - boundarySequence
      properties:
        commandId:
          type: string
          format: uuid
        kind:
          type: string
          enum:
          - start
          - end
        captureId:
          type: string
          pattern: ^[a-f0-9]{32}$
        epoch:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        requestedAt:
          type: string
          format: date-time
        status:
          type: string
          enum:
          - pending
          - acknowledged
          - cancelled
          - rejected
        boundarySequence:
          anyOf:
          - type: integer
            minimum: 0
            maximum: 2147483647
          - type: 'null'
    BroadcastHealth:
      type: object
      additionalProperties: false
      required:
      - state
      - lastConfirmedAt
      - lastPublishedAt
      - verifiedEndSeconds
      - queuedObjects
      - reason
      properties:
        state:
          type: string
          enum:
          - waiting
          - healthy
          - interrupted
          - recovering
        lastConfirmedAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        lastPublishedAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        verifiedEndSeconds:
          anyOf:
          - type: number
            minimum: 0
          - type: 'null'
        queuedObjects:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
        reason:
          anyOf:
          - type: string
          - type: 'null'
    BroadcastArchive:
      type: object
      additionalProperties: false
      required:
      - state
      - reason
      properties:
        state:
          type: string
          enum:
          - none
          - processing
          - ready
          - published
          - failed
        reason:
          anyOf:
          - type: string
          - type: 'null'
    BroadcastView:
      type: object
      additionalProperties: false
      required:
      - recordingId
      - revision
      - phase
      - announced
      - scheduledAt
      - title
      - description
      - policy
      - cover
      - binding
      - boundaries
      - health
      - pendingCommand
      - archive
      properties:
        recordingId:
          type: string
          format: uuid
        revision:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        phase:
          type: string
          enum:
          - draft
          - scheduled
          - preview
          - start_pending
          - live
          - end_pending
          - processing
          - archived
          - cancelled
          - failed
        announced:
          type: boolean
        scheduledAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        title:
          type: string
          minLength: 1
          maxLength: 180
        description:
          $ref: '#/components/schemas/RecordingDescription'
        policy:
          $ref: '#/components/schemas/BroadcastPolicy'
        cover:
          $ref: '#/components/schemas/LiveCoverSettings'
        binding:
          anyOf:
          - $ref: '#/components/schemas/BroadcastBinding'
          - type: 'null'
        boundaries:
          $ref: '#/components/schemas/BroadcastBoundaries'
        health:
          $ref: '#/components/schemas/BroadcastHealth'
        pendingCommand:
          anyOf:
          - $ref: '#/components/schemas/BroadcastCommand'
          - type: 'null'
        archive:
          $ref: '#/components/schemas/BroadcastArchive'
    RecordingDescription:
      type: string
      maxLength: 5000
      pattern: ^[^\x00]*$
      description: Optional plain-text video description; Unicode code points, no
        HTML rendering. Omission preserves the saved value on update; an empty string
        clears it.
    LiveCoverSettings:
      type: object
      additionalProperties: false
      required:
      - revision
      - selection
      - coverState
      properties:
        revision:
          type: integer
          minimum: 1
          format: int64
        selection:
          $ref: '#/components/schemas/LiveCoverSelection'
        coverState:
          type: string
          enum:
          - none
          - waiting
          - pending
          - ready
          - failed
        coverId:
          type: string
          maxLength: 128
        contentPath:
          type: string
          pattern: ^/api/admin/recordings/
        inheritedRevision:
          type: integer
          minimum: 1
          format: int64
    LiveCoverSelection:
      oneOf:
      - type: object
        additionalProperties: false
        required:
        - mode
        properties:
          mode:
            type: string
            enum:
            - auto
      - type: object
        additionalProperties: false
        required:
        - mode
        - uploadId
        properties:
          mode:
            type: string
            enum:
            - custom
          uploadId:
            type: string
            pattern: ^[A-Za-z0-9-]{1,128}$
    BroadcastMutationInput:
      type: object
      additionalProperties: false
      required:
      - operationKey
      - expectedRevision
      properties:
        operationKey:
          type: string
          pattern: ^[a-zA-Z0-9._:-]{1,128}$
        expectedRevision:
          type: integer
          minimum: 1
          maximum: 9007199254740991
    BroadcastCreateInput:
      type: object
      additionalProperties: false
      required:
      - operationKey
      - title
      - description
      - scheduledAt
      - policy
      properties:
        operationKey:
          type: string
          pattern: ^[a-zA-Z0-9._:-]{1,128}$
        title:
          type: string
          minLength: 1
          maxLength: 180
        description:
          $ref: '#/components/schemas/RecordingDescription'
        scheduledAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        policy:
          $ref: '#/components/schemas/BroadcastPolicy'
        cover:
          $ref: '#/components/schemas/LiveCoverSelection'
    BroadcastUpdateInput:
      type: object
      additionalProperties: false
      required:
      - operationKey
      - expectedRevision
      properties:
        operationKey:
          type: string
          pattern: ^[a-zA-Z0-9._:-]{1,128}$
        expectedRevision:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        title:
          type: string
          minLength: 1
          maxLength: 180
        description:
          $ref: '#/components/schemas/RecordingDescription'
        scheduledAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        policy:
          $ref: '#/components/schemas/BroadcastPolicy'
        cover:
          $ref: '#/components/schemas/LiveCoverSelection'
      minProperties: 3
    BroadcastBindInput:
      type: object
      additionalProperties: false
      required:
      - operationKey
      - expectedRevision
      - protocolVersion
      properties:
        operationKey:
          type: string
          pattern: ^[a-zA-Z0-9._:-]{1,128}$
        expectedRevision:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        protocolVersion:
          type: string
          minLength: 1
          maxLength: 64
    BroadcastMarkerAckInput:
      type: object
      additionalProperties: false
      required:
      - operationKey
      - captureId
      - epoch
      - boundarySequence
      properties:
        operationKey:
          type: string
          pattern: ^[a-zA-Z0-9._:-]{1,128}$
        captureId:
          type: string
          pattern: ^[a-f0-9]{32}$
        epoch:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        boundarySequence:
          type: integer
          minimum: 0
          maximum: 2147483647
    BroadcastEmergencyCloseInput:
      type: object
      additionalProperties: false
      required:
      - operationKey
      - expectedRevision
      - reason
      properties:
        operationKey:
          type: string
          pattern: ^[a-zA-Z0-9._:-]{1,128}$
        expectedRevision:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        reason:
          type: string
          minLength: 1
          maxLength: 500
    BroadcastPreviewInput:
      type: object
      additionalProperties: false
      required:
      - captureId
      - epoch
      properties:
        captureId:
          type: string
          pattern: ^[a-f0-9]{32}$
        epoch:
          type: integer
          minimum: 1
          maximum: 9007199254740991
    BroadcastReceipt:
      type: object
      additionalProperties: false
      required:
      - operationKey
      - operation
      - state
      properties:
        operationKey:
          type: string
          pattern: ^[a-zA-Z0-9._:-]{1,128}$
        operation:
          type: string
          enum:
          - create
          - update
          - announce
          - cancel
          - bind
          - start
          - end
          - cancel-command
          - ack
          - emergency-close
        state:
          type: string
          enum:
          - accepted
          - completed
          - rejected
        commandId:
          type: string
          format: uuid
    BroadcastMutationResult:
      type: object
      additionalProperties: false
      required:
      - broadcast
      - receipt
      properties:
        broadcast:
          $ref: '#/components/schemas/BroadcastView'
        receipt:
          $ref: '#/components/schemas/BroadcastReceipt'
    BroadcastList:
      type: object
      additionalProperties: false
      required:
      - items
      - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BroadcastView'
        nextCursor:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
    BroadcastControl:
      type: object
      additionalProperties: false
      required:
      - revision
      - phase
      - pendingCommand
      properties:
        revision:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        phase:
          type: string
          enum:
          - draft
          - scheduled
          - preview
          - start_pending
          - live
          - end_pending
          - processing
          - archived
          - cancelled
          - failed
        pendingCommand:
          anyOf:
          - $ref: '#/components/schemas/BroadcastCommand'
          - type: 'null'
    BroadcastCapabilities:
      type: object
      additionalProperties: false
      required:
      - versions
      - maxActiveCaptures
      - markerMode
      properties:
        versions:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum:
            - b1-2026-10-10.rc1
        maxActiveCaptures:
          type: integer
          enum:
          - 1
        markerMode:
          type: string
          enum:
          - next-common-segment
    BroadcastWatch:
      type: object
      additionalProperties: false
      required:
      - recordingId
      - title
      - description
      - view
      - scheduledAt
      - serverNow
      - cover
      - stateRevision
      properties:
        recordingId:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 180
        description:
          $ref: '#/components/schemas/RecordingDescription'
        view:
          type: string
          enum:
          - waiting
          - live
          - processing
          - vod
          - cancelled
          - expired
          - unavailable
        scheduledAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        serverNow:
          type: string
          format: date-time
        cover:
          anyOf:
          - type: object
            additionalProperties: false
            required:
            - revision
            - contentPath
            properties:
              revision:
                type: string
                minLength: 1
              contentPath:
                type: string
                pattern: ^/api/member/
          - type: 'null'
        stateRevision:
          type: integer
          minimum: 1
          maximum: 9007199254740991
    BroadcastPreviewAccess:
      type: object
      additionalProperties: false
      required:
      - recordingId
      - captureId
      - epoch
      - purpose
      - playbackScopeId
      - mediaUrl
      - exchangeCredential
      - issuedAt
      - expiresAt
      properties:
        recordingId:
          type: string
          format: uuid
        captureId:
          type: string
          pattern: ^[a-f0-9]{32}$
        epoch:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        purpose:
          type: string
          enum:
          - staff-preview
        playbackScopeId:
          type: string
          format: uuid
        mediaUrl:
          type: string
          format: uri
        exchangeCredential:
          type: string
          minLength: 1
        issuedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
    BroadcastErrorEnvelope:
      type: object
      additionalProperties: false
      required:
      - data
      - meta
      - error
      properties:
        data:
          type: 'null'
        meta:
          type: object
          additionalProperties: true
        error:
          type: object
          additionalProperties: false
          required:
          - code
          - message
          properties:
            code:
              type: string
              enum:
              - broadcast_invalid
              - broadcast_not_found
              - broadcast_state_conflict
              - broadcast_already_bound
              - broadcast_active_limit
              - broadcast_epoch_mismatch
              - broadcast_boundary_conflict
              - broadcast_operation_conflict
              - broadcast_revision_conflict
              - broadcast_protocol_unsupported
              - unauthorized
              - forbidden
              - rate_limited
              - unavailable
            message:
              type: string
    BroadcastViewEnvelope:
      type: object
      additionalProperties: false
      required:
      - data
      - meta
      - error
      properties:
        data:
          $ref: '#/components/schemas/BroadcastView'
        meta:
          type: object
          additionalProperties: true
        error:
          type: 'null'
    BroadcastMutationResultEnvelope:
      type: object
      additionalProperties: false
      required:
      - data
      - meta
      - error
      properties:
        data:
          $ref: '#/components/schemas/BroadcastMutationResult'
        meta:
          type: object
          additionalProperties: true
        error:
          type: 'null'
    BroadcastListEnvelope:
      type: object
      additionalProperties: false
      required:
      - data
      - meta
      - error
      properties:
        data:
          $ref: '#/components/schemas/BroadcastList'
        meta:
          type: object
          additionalProperties: true
        error:
          type: 'null'
    BroadcastControlEnvelope:
      type: object
      additionalProperties: false
      required:
      - data
      - meta
      - error
      properties:
        data:
          $ref: '#/components/schemas/BroadcastControl'
        meta:
          type: object
          additionalProperties: true
        error:
          type: 'null'
    BroadcastCapabilitiesEnvelope:
      type: object
      additionalProperties: false
      required:
      - data
      - meta
      - error
      properties:
        data:
          $ref: '#/components/schemas/BroadcastCapabilities'
        meta:
          type: object
          additionalProperties: true
        error:
          type: 'null'
    BroadcastWatchEnvelope:
      type: object
      additionalProperties: false
      required:
      - data
      - meta
      - error
      properties:
        data:
          $ref: '#/components/schemas/BroadcastWatch'
        meta:
          type: object
          additionalProperties: true
        error:
          type: 'null'
    BroadcastPreviewAccessEnvelope:
      type: object
      additionalProperties: false
      required:
      - data
      - meta
      - error
      properties:
        data:
          $ref: '#/components/schemas/BroadcastPreviewAccess'
        meta:
          type: object
          additionalProperties: true
        error:
          type: 'null'
  securitySchemes:
    daprApiToken:
      type: apiKey
      in: header
      name: dapr-api-token
      description: Dapr API token supplied by api-gateway; the value is never published
        in this contract.
    daprCallerAppId:
      type: apiKey
      in: header
      name: Dapr-Caller-App-Id
      description: Must identify the configured api-gateway Dapr application.
    trustedUserId:
      type: apiKey
      in: header
      name: X-HHC-User-ID
      description: Sanitized Account user identifier injected by api-gateway.
    trustedAuthProvider:
      type: apiKey
      in: header
      name: X-HHC-Auth-Provider
      description: Must be account-api.
    trustedScopes:
      type: apiKey
      in: header
      name: X-HHC-Scopes
      description: Sanitized Account scopes injected by api-gateway and enforced per
        operation.
