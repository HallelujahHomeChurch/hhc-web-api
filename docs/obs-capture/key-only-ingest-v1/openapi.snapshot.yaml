components:
  securitySchemes:
    daprApiToken:
      type: apiKey
      in: header
      name: dapr-api-token
      description: Dapr API token supplied by api-gateway; the value is never published
        in this contract.
    daprCallerAppId:
      type: apiKey
      in: header
      name: Dapr-Caller-App-Id
      description: Must identify the configured api-gateway Dapr application.
    broadcastIngestSession:
      type: http
      scheme: bearer
      bearerFormat: HHC-INGEST
  schemas:
    BroadcastMarkerAckInput:
      type: object
      additionalProperties: false
      required:
      - operationKey
      - captureId
      - epoch
      - boundarySequence
      properties:
        operationKey:
          type: string
          pattern: ^[a-zA-Z0-9._:-]{1,128}$
        captureId:
          type: string
          pattern: ^[a-f0-9]{32}$
        epoch:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        boundarySequence:
          type: integer
          minimum: 0
          maximum: 2147483647
    BroadcastIngestErrorEnvelope:
      type: object
      additionalProperties: false
      required:
      - data
      - meta
      - error
      properties:
        data:
          type: 'null'
        meta:
          type: object
          additionalProperties: true
        error:
          type: object
          additionalProperties: false
          required:
          - code
          - message
          properties:
            code:
              type: string
              minLength: 1
            message:
              type: string
            details:
              type: object
              additionalProperties: true
    BroadcastMutationResultEnvelope:
      type: object
      additionalProperties: false
      required:
      - data
      - meta
      - error
      properties:
        data:
          $ref: '#/components/schemas/BroadcastMutationResult'
        meta:
          type: object
          additionalProperties: true
        error:
          type: 'null'
    BroadcastMutationResult:
      type: object
      additionalProperties: false
      required:
      - broadcast
      - receipt
      properties:
        broadcast:
          $ref: '#/components/schemas/BroadcastView'
        receipt:
          $ref: '#/components/schemas/BroadcastReceipt'
    BroadcastReceipt:
      type: object
      additionalProperties: false
      required:
      - operationKey
      - operation
      - state
      properties:
        operationKey:
          type: string
          pattern: ^[a-zA-Z0-9._:-]{1,128}$
        operation:
          type: string
          enum:
          - create
          - update
          - announce
          - cancel
          - bind
          - start
          - end
          - cancel-command
          - ack
          - emergency-close
        state:
          type: string
          enum:
          - accepted
          - completed
          - rejected
        commandId:
          type: string
          format: uuid
    BroadcastView:
      type: object
      additionalProperties: false
      required:
      - recordingId
      - revision
      - phase
      - announced
      - scheduledAt
      - title
      - description
      - policy
      - cover
      - binding
      - boundaries
      - health
      - pendingCommand
      - archive
      properties:
        recordingId:
          type: string
          format: uuid
        revision:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        phase:
          type: string
          enum:
          - draft
          - scheduled
          - preview
          - start_pending
          - live
          - end_pending
          - processing
          - archived
          - cancelled
          - failed
        announced:
          type: boolean
        scheduledAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        title:
          type: string
          minLength: 1
          maxLength: 180
        description:
          $ref: '#/components/schemas/RecordingDescription'
        policy:
          $ref: '#/components/schemas/BroadcastPolicy'
        cover:
          $ref: '#/components/schemas/LiveCoverSettings'
        binding:
          anyOf:
          - $ref: '#/components/schemas/BroadcastBinding'
          - type: 'null'
        boundaries:
          $ref: '#/components/schemas/BroadcastBoundaries'
        health:
          $ref: '#/components/schemas/BroadcastHealth'
        pendingCommand:
          anyOf:
          - $ref: '#/components/schemas/BroadcastCommand'
          - type: 'null'
        archive:
          $ref: '#/components/schemas/BroadcastArchive'
    BroadcastArchive:
      type: object
      additionalProperties: false
      required:
      - state
      - reason
      properties:
        state:
          type: string
          enum:
          - none
          - processing
          - ready
          - published
          - failed
        reason:
          anyOf:
          - type: string
          - type: 'null'
    BroadcastCommand:
      type: object
      additionalProperties: false
      required:
      - commandId
      - kind
      - captureId
      - epoch
      - requestedAt
      - status
      - boundarySequence
      properties:
        commandId:
          type: string
          format: uuid
        kind:
          type: string
          enum:
          - start
          - end
        captureId:
          type: string
          pattern: ^[a-f0-9]{32}$
        epoch:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        requestedAt:
          type: string
          format: date-time
        status:
          type: string
          enum:
          - pending
          - acknowledged
          - cancelled
          - rejected
        boundarySequence:
          anyOf:
          - type: integer
            minimum: 0
            maximum: 2147483647
          - type: 'null'
    BroadcastHealth:
      type: object
      additionalProperties: false
      required:
      - state
      - lastConfirmedAt
      - lastPublishedAt
      - verifiedEndSeconds
      - queuedObjects
      - reason
      properties:
        state:
          type: string
          enum:
          - waiting
          - healthy
          - interrupted
          - recovering
        lastConfirmedAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        lastPublishedAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        verifiedEndSeconds:
          anyOf:
          - type: number
            minimum: 0
          - type: 'null'
        queuedObjects:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
        reason:
          anyOf:
          - type: string
          - type: 'null'
    BroadcastBoundaries:
      type: object
      additionalProperties: false
      required:
      - startSequence
      - endSequenceExclusive
      - revision
      properties:
        startSequence:
          anyOf:
          - type: integer
            minimum: 0
            maximum: 2147483647
          - type: 'null'
        endSequenceExclusive:
          anyOf:
          - type: integer
            minimum: 0
            maximum: 2147483647
          - type: 'null'
        revision:
          type: integer
          minimum: 1
          maximum: 9007199254740991
    BroadcastBinding:
      type: object
      additionalProperties: false
      required:
      - captureId
      - epoch
      - actorId
      properties:
        captureId:
          type: string
          pattern: ^[a-f0-9]{32}$
        epoch:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        actorId:
          type: string
          format: uuid
    LiveCoverSettings:
      type: object
      additionalProperties: false
      required:
      - revision
      - selection
      - coverState
      properties:
        revision:
          type: integer
          minimum: 1
          format: int64
        selection:
          $ref: '#/components/schemas/LiveCoverSelection'
        coverState:
          type: string
          enum:
          - none
          - waiting
          - pending
          - ready
          - failed
        coverId:
          type: string
          maxLength: 128
        contentPath:
          type: string
          pattern: ^/api/admin/recordings/
        inheritedRevision:
          type: integer
          minimum: 1
          format: int64
    LiveCoverSelection:
      oneOf:
      - type: object
        additionalProperties: false
        required:
        - mode
        properties:
          mode:
            type: string
            enum:
            - auto
      - type: object
        additionalProperties: false
        required:
        - mode
        - uploadId
        properties:
          mode:
            type: string
            enum:
            - custom
          uploadId:
            type: string
            pattern: ^[A-Za-z0-9-]{1,128}$
    BroadcastPolicy:
      type: object
      additionalProperties: false
      required:
      - autoStart
      - autoEnd
      - autoPublish
      properties:
        autoStart:
          type: boolean
        autoEnd:
          type: boolean
        autoPublish:
          type: boolean
    RecordingDescription:
      type: string
      maxLength: 5000
      pattern: ^[^\x00]*$
      description: Optional plain-text video description; Unicode code points, no
        HTML rendering. Omission preserves the saved value on update; an empty string
        clears it.
    BroadcastControlEnvelope:
      type: object
      additionalProperties: false
      required:
      - data
      - meta
      - error
      properties:
        data:
          $ref: '#/components/schemas/BroadcastControl'
        meta:
          type: object
          additionalProperties: true
        error:
          type: 'null'
    BroadcastControl:
      type: object
      additionalProperties: false
      required:
      - revision
      - phase
      - pendingCommand
      properties:
        revision:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        phase:
          type: string
          enum:
          - draft
          - scheduled
          - preview
          - start_pending
          - live
          - end_pending
          - processing
          - archived
          - cancelled
          - failed
        pendingCommand:
          anyOf:
          - $ref: '#/components/schemas/BroadcastCommand'
          - type: 'null'
    RecordingCaptureAbortInput:
      type: object
      additionalProperties: false
      required:
      - operationKey
      - reasonCode
      properties:
        operationKey:
          type: string
          pattern: ^[a-zA-Z0-9._:-]{1,128}$
        reasonCode:
          type: string
          enum:
          - user_abort
          - disk_limit
          - encoder_failure
          - capture_incomplete
    RecordingCaptureResultEnvelope:
      type: object
      additionalProperties: false
      required:
      - data
      - meta
      - error
      properties:
        data:
          $ref: '#/components/schemas/RecordingCaptureResult'
        meta:
          type: object
          additionalProperties: true
        error:
          type: 'null'
    RecordingCaptureResult:
      type: object
      additionalProperties: false
      required:
      - capture
      - receipt
      properties:
        capture:
          $ref: '#/components/schemas/RecordingCaptureStatus'
        receipt:
          $ref: '#/components/schemas/RecordingCaptureReceipt'
    RecordingCaptureReceipt:
      type: object
      additionalProperties: false
      required:
      - operationKey
      - operation
      - acceptedAt
      - captureId
      properties:
        operationKey:
          type: string
          pattern: ^[a-zA-Z0-9._:-]{1,128}$
        operation:
          type: string
          enum:
          - create
          - declare
          - confirm
          - stop
          - seal
          - abort
          - cancel_auto_publish
          - close_live
        acceptedAt:
          type: string
          format: date-time
          description: UTC RFC3339 timestamp emitted with Z suffix.
        captureId:
          type: string
          pattern: ^[a-f0-9]{32}$
    RecordingCaptureStatus:
      type: object
      additionalProperties: false
      required:
      - captureId
      - recordingId
      - recordingVersion
      - state
      - liveState
      - liveEnabled
      - autoPublish
      - createdAt
      - expiresAt
      - serverNow
      - stopAcceptedAt
      - replayUntil
      - terminalAt
      - terminalReason
      - packageId
      - declaredBytes
      - declaredObjects
      - objects
      - nextCursor
      - progress
      properties:
        captureId:
          type: string
          pattern: ^[a-f0-9]{32}$
        recordingId:
          type: string
          format: uuid
        recordingVersion:
          type: integer
          format: int64
          minimum: 1
        state:
          type: string
          enum:
          - creating
          - uploading
          - freezing
          - validating
          - ready
          - failed
          - expired
          - aborted
        liveState:
          type: string
          enum:
          - starting
          - live
          - recovering
          - interrupted
          - ending
          - ended
          - failed
          - expired
          - aborted
        liveEnabled:
          type: boolean
        autoPublish:
          type: string
          enum:
          - pending
          - cancelled
          - blocked
          - published
        createdAt:
          type: string
          format: date-time
          description: UTC RFC3339 timestamp emitted with Z suffix.
        expiresAt:
          type: string
          format: date-time
          description: UTC RFC3339 timestamp emitted with Z suffix.
        serverNow:
          type: string
          format: date-time
          description: UTC RFC3339 timestamp emitted with Z suffix.
        stopAcceptedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: UTC RFC3339 timestamp emitted with Z suffix.
        replayUntil:
          type:
          - string
          - 'null'
          format: date-time
          description: UTC RFC3339 timestamp emitted with Z suffix.
        terminalAt:
          type:
          - string
          - 'null'
          format: date-time
          description: UTC RFC3339 timestamp emitted with Z suffix.
        terminalReason:
          type:
          - string
          - 'null'
          maxLength: 128
        packageId:
          type:
          - string
          - 'null'
          pattern: ^[a-f0-9]{32}$
        declaredBytes:
          type: integer
          format: int64
          minimum: 0
          maximum: 10000000000
        declaredObjects:
          type: integer
          format: int64
          minimum: 0
          maximum: 10000
        objects:
          type: array
          minItems: 0
          maxItems: 1000
          items:
            $ref: '#/components/schemas/RecordingCaptureObjectStatus'
        nextCursor:
          type: string
          maxLength: 128
        progress:
          $ref: '#/components/schemas/RecordingLiveProgress'
    RecordingLiveProgress:
      type: object
      additionalProperties: false
      required:
      - revision
      - firstSequence
      - lastSequence
      - mediaEndSeconds
      - lastAdvancedAt
      - endedAt
      - ended
      properties:
        revision:
          type: integer
          format: int64
          minimum: 0
        firstSequence:
          type: integer
          const: 0
        lastSequence:
          type: integer
          minimum: -1
          maximum: 1439
        mediaEndSeconds:
          type: number
          minimum: 0
          maximum: 43200
        lastAdvancedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: UTC RFC3339 timestamp emitted with Z suffix.
        endedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: UTC RFC3339 timestamp emitted with Z suffix.
        ended:
          type: boolean
    RecordingCaptureObjectStatus:
      type: object
      additionalProperties: false
      required:
      - path
      - sizeBytes
      - sha256
      - state
      properties:
        path:
          type: string
          pattern: ^(master\.m3u8|(480p|720p|1080p)/(index\.m3u8|init\.mp4|seg-[0-9]{6}\.m4s))$
        sizeBytes:
          type: integer
          minimum: 1
          maximum: 134217728
        sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        state:
          type: string
          enum:
          - declared
          - queued
          - verified
          - failed
    RecordingCaptureSealInput:
      type: object
      additionalProperties: false
      required:
      - operationKey
      - normalEnd
      - inventory
      properties:
        operationKey:
          type: string
          pattern: ^[a-zA-Z0-9._:-]{1,128}$
        normalEnd:
          type: boolean
          const: true
        inventory:
          allOf:
          - $ref: '#/components/schemas/RecordingPackageInventory'
          - type: object
            properties:
              renditions:
                type: array
                minItems: 3
                maxItems: 3
    RecordingPackageInventory:
      type: object
      additionalProperties: false
      description: HLS v1 declared inventory for the gated package upload contract;
        current MP4 routes do not consume it. SHA-256 inventoryDigest hashes UTF-8
        encoding/json-compatible serialization with this field omitted, objects sorted
        by path, renditions sorted by name, and fields in the order shown below. Objects
        exclude package.json itself; total package bytes include the serialized inventory.
        Metadata and hashes are declarations, not proof of readiness. Final bytes
        and media are verified by the recording Job. Master BANDWIDTH and optional
        AVERAGE-BANDWIDTH must match measured media segment bytes and EXTINF durations
        under RFC 8216 section 4.1, not configured encoder bitrates. Ineligible short-tail
        windows are excluded from peak bandwidth.
      required:
      - schemaVersion
      - presetVersion
      - objects
      - renditions
      - inventoryDigest
      properties:
        schemaVersion:
          type: integer
          const: 1
        presetVersion:
          type: string
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9._-]{0,63}$
        objects:
          type: array
          minItems: 4
          maxItems: 10000
          items:
            $ref: '#/components/schemas/RecordingPackageObject'
        renditions:
          type: array
          minItems: 1
          maxItems: 3
          items:
            $ref: '#/components/schemas/RecordingRendition'
        inventoryDigest:
          type: string
          pattern: ^[a-f0-9]{64}$
    RecordingRendition:
      type: object
      additionalProperties: false
      required:
      - name
      - width
      - height
      - frameRate
      - videoBitrate
      - audioBitrate
      - durationSeconds
      - segmentCount
      properties:
        name:
          type: string
          enum:
          - 480p
          - 720p
          - 1080p
          description: 720p is mandatory for backward compatibility; 480p and 1080p
            optional. Names are unique; each additional rung has distinct dimensions
            and ordered bitrates.
        width:
          type: integer
          minimum: 2
          maximum: 1920
          multipleOf: 2
          description: 480p maximum width is 854; 720p maximum width is 1280; source
            must never be upscaled.
        height:
          type: integer
          minimum: 2
          maximum: 1080
          multipleOf: 2
          description: 480p maximum height is 480; 720p maximum height is 720. Actual
            dimensions are retained for smaller sources.
        frameRate:
          type: number
          exclusiveMinimum: 0
          maximum: 30
        videoBitrate:
          type: integer
          minimum: 500000
          maximum: 8000000
        audioBitrate:
          type: integer
          const: 128000
        durationSeconds:
          type: number
          exclusiveMinimum: 0
          maximum: 43200
        segmentCount:
          type: integer
          minimum: 1
          maximum: 1440
          description: Actual number of contiguous media segments, including a legal
            short final segment; validated against playlists and decoded media, not
            inferred from duration. All renditions require aligned actual boundaries.
    RecordingPackageObject:
      type: object
      additionalProperties: false
      required:
      - path
      - sizeBytes
      - sha256
      properties:
        path:
          type: string
          pattern: ^(master\.m3u8|(480p|720p|1080p)/(index\.m3u8|init\.mp4|seg-[0-9]{6}\.m4s))$
          description: Canonical relative path. Unique paths and every declared rendition's
            complete contiguous segment list are required. No URLs, encoded paths,
            queries or package.json.
        sizeBytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 134217728
          description: Playlists additionally have a 1048576-byte limit. Package total
            including inventory must be at most 10000000000 bytes.
        sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
    RecordingCaptureOperationInput:
      type: object
      additionalProperties: false
      required:
      - operationKey
      properties:
        operationKey:
          type: string
          pattern: ^[a-zA-Z0-9._:-]{1,128}$
    RecordingCaptureConfirmInput:
      type: object
      additionalProperties: false
      required:
      - operationKey
      - paths
      properties:
        operationKey:
          type: string
          pattern: ^[a-zA-Z0-9._:-]{1,128}$
        paths:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: string
            pattern: ^(master\.m3u8|(480p|720p|1080p)/(index\.m3u8|init\.mp4|seg-[0-9]{6}\.m4s))$
          uniqueItems: true
    RecordingCaptureSignInput:
      type: object
      additionalProperties: false
      required:
      - paths
      properties:
        paths:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: string
            pattern: ^(master\.m3u8|(480p|720p|1080p)/(index\.m3u8|init\.mp4|seg-[0-9]{6}\.m4s))$
          uniqueItems: true
    RecordingCaptureSignedEnvelope:
      type: object
      additionalProperties: false
      required:
      - data
      - meta
      - error
      properties:
        data:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/SignedRecordingObject'
        meta:
          type: object
          additionalProperties: true
        error:
          type: 'null'
    SignedRecordingObject:
      type: object
      additionalProperties: false
      required:
      - path
      - url
      - method
      - headers
      properties:
        path:
          type: string
        url:
          type: string
          format: uri
          description: At most fifteen-minute single-object R2 PUT capability; never
            log or persist.
        method:
          type: string
          enum:
          - PUT
        headers:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    RecordingCaptureDeclareInput:
      type: object
      additionalProperties: false
      required:
      - operationKey
      - objects
      properties:
        operationKey:
          type: string
          pattern: ^[a-zA-Z0-9._:-]{1,128}$
        objects:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/RecordingPackageObject'
    RecordingCaptureEnvelope:
      type: object
      additionalProperties: false
      required:
      - data
      - meta
      - error
      properties:
        data:
          $ref: '#/components/schemas/RecordingCaptureStatus'
        meta:
          type: object
          additionalProperties: true
        error:
          type: 'null'
    BroadcastIngestRenewInput:
      type: object
      additionalProperties: false
      required:
      - streamKey
      - sessionToken
      properties:
        streamKey:
          type: string
          writeOnly: true
          pattern: ^hhc_stream_[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$
          description: Canonical 32 CSPRNG bytes. Never log or persist raw value;
            OBS uses OS credential storage.
        sessionToken:
          type: string
          writeOnly: true
          maxLength: 2048
          pattern: ^hhc_ingest_[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$
    BroadcastIngestSessionEnvelope:
      type: object
      additionalProperties: false
      required:
      - data
      - meta
      - error
      properties:
        data:
          $ref: '#/components/schemas/BroadcastIngestSession'
        meta:
          type: object
          additionalProperties: true
        error:
          type: 'null'
    BroadcastIngestSession:
      type: object
      additionalProperties: false
      required:
      - token
      - expiresAt
      - recordingId
      - captureId
      - epoch
      properties:
        token:
          type: string
          readOnly: true
          maxLength: 2048
          pattern: ^hhc_ingest_[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$
          description: Opaque 15-minute event-scoped credential; store in OS credential
            storage, never log or journal.
        expiresAt:
          type: string
          format: date-time
        recordingId:
          type: string
          format: uuid
        captureId:
          type: string
          pattern: ^[a-f0-9]{32}$
        epoch:
          type: integer
          minimum: 1
          maximum: 9007199254740991
    BroadcastSourceBindInput:
      type: object
      additionalProperties: false
      required:
      - streamKey
      - operationKey
      - expectedSourceRevision
      - recordingId
      - expectedRevision
      - protocolVersion
      properties:
        streamKey: &id002
          type: string
          writeOnly: true
          pattern: ^hhc_stream_[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$
          description: Canonical 32 CSPRNG bytes. Never log or persist raw value;
            OBS uses OS credential storage.
        operationKey:
          type: string
          pattern: ^[a-zA-Z0-9._:-]{1,128}$
        expectedSourceRevision: &id001
          type: integer
          minimum: 1
          maximum: 9007199254740991
        recordingId: &id003
          type: string
          format: uuid
        expectedRevision: *id001
        protocolVersion:
          type: string
          minLength: 1
          maxLength: 64
    BroadcastIngestBindingEnvelope:
      type: object
      additionalProperties: false
      required:
      - data
      - meta
      - error
      properties:
        data:
          $ref: '#/components/schemas/BroadcastIngestBinding'
        meta:
          type: object
          additionalProperties: true
        error:
          type: 'null'
    BroadcastIngestBinding:
      type: object
      additionalProperties: false
      required:
      - broadcast
      - receipt
      - session
      properties:
        broadcast:
          $ref: '#/components/schemas/BroadcastView'
        receipt:
          $ref: '#/components/schemas/BroadcastReceipt'
        session:
          $ref: '#/components/schemas/BroadcastIngestSession'
    BroadcastSourceResolveInput:
      type: object
      additionalProperties: false
      required:
      - streamKey
      properties:
        streamKey: *id002
    BroadcastSourceResolvedEnvelope:
      type: object
      additionalProperties: false
      required:
      - data
      - meta
      - error
      properties:
        data:
          $ref: '#/components/schemas/BroadcastSourceResolved'
        meta:
          type: object
          additionalProperties: true
        error:
          type: 'null'
    BroadcastSourceResolved:
      type: object
      additionalProperties: false
      required:
      - sourceRevision
      - recordingId
      - broadcastRevision
      properties:
        sourceRevision: *id001
        recordingId: *id003
        broadcastRevision: *id001
