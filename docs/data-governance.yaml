    legal_basis: {status: pending_legal, reference: null}
    retention: {status: enforced, rule: {trigger: age_since, field: window_start, source: {path: internal/postgres/bulletin_watermark.go, symbol: Repository.PurgeWatermarkRecords}, duration_source: {path: internal/postgres/bulletin_watermark.go, symbol: Repository.PurgeWatermarkRecords}, predicate: "window_start < now - interval '2 days'", description: Hashed counters are retained for at most two days plus worker cleanup lag.}, action: delete}
    cleanup: {mode: existing_worker, implementation: [{path: internal/postgres/bulletin_watermark.go, symbol: Repository.PurgeWatermarkRecords}], evidence: [{kind: go_test, path: internal/postgres/recording_watermark_test.go, test_name: TestRecordingWatermarkCleanupAndMediaDeletionAreIndependent}]}
