    necessity: "required"
    storage: {"kind":"postgres","resource":"hhc_web.bulletin_reader_processed_mutation","sources":[{"path":"internal/postgres/bulletin_reader.go","symbol":"Repository.MutateReader"}]}
    subject_keys: [{"kind":"user_id","field":"account_id","evidence":[{"path":"internal/postgres/bulletin_reader.go","symbol":"Repository.MutateReader"}]}]
    data_classes: ["identity","activity","content"]
    fields:
      - {"name":"account_id, document_id","purpose":"Bind private reader data to its Account subject and bulletin.","necessity":"required","data_classes":["identity","activity"]}
      - {"name":"mutation_id, request_hash, result_json, created_at, expires_at","purpose":"Deduplicate offline retries for 91 days without logging private operation content.","necessity":"required","data_classes":["activity","content"]}
    attribution: {"mode":"direct","explanation":"Account UUID identifies the owner; CMS and watermark trace APIs cannot read these private records."}
    legal_basis: {"status":"pending_legal","reference":null}
    retention: {"status":"enforced","rule":{"trigger":"expires_at","field":"expires_at","source":{"path":"internal/postgres/bulletin_watermark.go","symbol":"Repository.PurgeWatermarkRecords"},"duration_source":null,"predicate":"expires_at <= now","description":"Terminal mutation receipts expire after 91 times 24 hours. Existing publication worker deletes expired rows even for inactive accounts; ordinary account cleanup removes them immediately. Backup erasure is not claimed."},"action":"delete"}
    cleanup: {"mode":"existing_worker","implementation":[{"path":"internal/postgres/bulletin_watermark.go","symbol":"Repository.PurgeWatermarkRecords"}],"evidence":[{"kind":"go_test","path":"internal/postgres/bulletin_reader_cleanup_test.go","test_name":"TestPrivateReaderMutationRetentionWithoutFurtherWrites"}]}
  - id: "hhc-web.online-reader-receipts"
    owner: "hhc-web-api"
    purpose: "Issue member-only Online content with traceable authorization and bounded offline validation; retain existing ordinary account cleanup and subject fences."
    necessity: "required"
    storage: {"kind":"postgres","resource":"hhc_web.online_bulletin_reader_receipt","sources":[{"path":"internal/postgres/online_bulletin_reader.go","symbol":"Repository.OpenOnlineBulletin"},{"path":"internal/postgres/bulletin_watermark.go","symbol":"Repository.PurgeWatermarkRecords"}]}
    subject_keys: [{"kind":"user_id","field":"account_id","evidence":[{"path":"internal/postgres/online_bulletin_reader.go","symbol":"Repository.OpenOnlineBulletin"}]}]
    data_classes: ["identity","activity","security","consent"]
    fields:
      - {"name":"id, account_id, document_id, revision","purpose":"Bind issuance to the authorized account and immutable published revision.","necessity":"required","data_classes":["identity","activity","security"]}
      - {"name":"trace_code","purpose":"Support existing privileged exact-code investigations without PDF fingerprint evidence.","necessity":"required","data_classes":["identity","activity","security"]}
      - {"name":"privacy_notice_version","purpose":"Record the configured privacy notice version.","necessity":"required","data_classes":["identity","activity","security"]}
      - {"name":"issued_at, expires_at","purpose":"Enforce fixed 365-day receipt retention.","necessity":"required","data_classes":["identity","activity","security"]}
    attribution: {"mode":"direct","explanation":"The persisted account_id identifies the authorized Account subject. Issuance does not prove subsequent distribution or reading."}
    legal_basis: {"status":"pending_legal","reference":null}
    retention: {"status":"enforced","rule":{"trigger":"expires_at","field":"expires_at","source":{"path":"internal/postgres/bulletin_watermark.go","symbol":"Repository.PurgeWatermarkRecords"},"duration_source":null,"predicate":"expires_at <= now","description":"Receipt expiry is exactly 365 times 24 hours after issuance. Revalidation never extends receipt retention. Lookup and export exclude expired rows. Existing publication worker deletes expired receipts and cascades request deletion. Erasure deletes them immediately; restriction prevents issuance and lookup. Backup deletion and legal approval are not claimed."},"action":"delete"}
    cleanup: {"mode":"existing_worker","implementation":[{"path":"internal/postgres/bulletin_watermark.go","symbol":"Repository.PurgeWatermarkRecords"},{"path":"internal/publication/worker.go","symbol":"Worker.Run"}],"evidence":[{"kind":"go_test","path":"internal/postgres/online_bulletin_reader_test.go","test_name":"TestReaderTraceLookupExportErasureAndRetention"}]}
  - id: "hhc-web.online-reader-validations"
    owner: "hhc-web-api"
    purpose: "Issue member-only Online content with traceable authorization and bounded offline validation; retain existing ordinary account cleanup and subject fences."
    necessity: "required"
    storage: {"kind":"postgres","resource":"hhc_web.online_bulletin_reader_request","sources":[{"path":"internal/postgres/online_bulletin_reader.go","symbol":"Repository.OpenOnlineBulletin"},{"path":"internal/postgres/bulletin_watermark.go","symbol":"Repository.PurgeWatermarkRecords"}]}
    subject_keys: [{"kind":"user_id","field":"account_id","evidence":[{"path":"internal/postgres/online_bulletin_reader.go","symbol":"Repository.OpenOnlineBulletin"}]}]
    data_classes: ["identity","activity","security","consent"]
    fields:
      - {"name":"account_id, client_request_id, receipt_id","purpose":"Bind an idempotent access request to one account and receipt.","necessity":"required","data_classes":["identity","activity","security"]}
      - {"name":"request_hash","purpose":"Reject reuse of a client request identifier with different selectors.","necessity":"required","data_classes":["identity","activity","security"]}
      - {"name":"validated_at, offline_valid_until","purpose":"Replay the original seven-day offline window without silently extending it.","necessity":"required","data_classes":["identity","activity","security"]}
    attribution: {"mode":"direct","explanation":"The persisted account_id identifies the authorized Account subject. Issuance does not prove subsequent distribution or reading."}
    legal_basis: {"status":"pending_legal","reference":null}
    retention: {"status":"enforced","rule":{"trigger":"expires_at","field":"receipt.expires_at","source":{"path":"internal/postgres/bulletin_watermark.go","symbol":"Repository.PurgeWatermarkRecords"},"duration_source":null,"predicate":"receipt.expires_at <= now","description":"Validation rows cascade-delete with their parent receipt at its fixed 365-day expiry or account erasure. The seven-day offline window is not an independent server retention extension. Restricted subjects cannot issue content. No tokens, IP addresses, browser identifiers or reading telemetry are retained."},"action":"delete"}
    cleanup: {"mode":"existing_worker","implementation":[{"path":"internal/postgres/bulletin_watermark.go","symbol":"Repository.PurgeWatermarkRecords"},{"path":"internal/publication/worker.go","symbol":"Worker.Run"}],"evidence":[{"kind":"go_test","path":"internal/postgres/online_bulletin_reader_test.go","test_name":"TestReaderTraceLookupExportErasureAndRetention"}]}
  - id: hhc-web.recording-watermark-receipts
    owner: hhc-web-api
    purpose: Record exact member recording issuance for authorized investigation and website_watermark data-rights processing.
    necessity: required
    storage: {kind: postgres, resource: hhc_web.recording_watermark_receipt, sources: [{path: internal/postgres/recording_watermark.go, symbol: RecordingRepository.EnsureRecordingWatermark}]}
    subject_keys: [{kind: user_id, field: user_id, evidence: [{path: internal/postgres/recording_watermark.go, symbol: RecordingRepository.EnsureRecordingWatermark}]}]
    data_classes: [identity, activity, security]
    fields:
      - {name: id, purpose: Identify the receipt., necessity: required, data_classes: [security]}
      - {name: trace_code, purpose: Resolve the displayed code exactly., necessity: required, data_classes: [identity, security]}
      - {name: user_id, purpose: Identify the issued account., necessity: required, data_classes: [identity]}
      - {name: recording_id, purpose: Bind the recording even after media deletion., necessity: required, data_classes: [activity]}
      - {name: package_id, purpose: Bind immutable media ownership., necessity: required, data_classes: [security]}
      - {name: format_version, purpose: Identify the issuance format., necessity: required, data_classes: [security]}
      - {name: issued_at, purpose: Record initial issuance time., necessity: required, data_classes: [activity]}
      - {name: expires_at, purpose: Enforce fixed receipt expiry., necessity: required, data_classes: [security]}
    attribution: {mode: direct, explanation: An issuance UUID association does not prove who leaked content. No name or email snapshot is stored.}
    legal_basis: {status: pending_legal, reference: null}
    retention: {status: enforced, rule: {trigger: expires_at, field: expires_at, source: {path: internal/postgres/bulletin_watermark.go, symbol: Repository.PurgeWatermarkRecords}, duration_source: null, predicate: 'expires_at <= now', description: Exactly 365 times 24 hours after issuance; renewal does not extend expiry. The existing publication worker purges expired rows. Online table cleanup is not backup deletion.}, action: delete}
    cleanup: {mode: existing_worker, implementation: [{path: internal/postgres/bulletin_watermark.go, symbol: Repository.PurgeWatermarkRecords}], evidence: [{kind: go_test, path: internal/postgres/recording_watermark_test.go, test_name: TestRecordingWatermarkCleanupAndMediaDeletionAreIndependent}]}
  - id: hhc-web.recording-watermark-lookups
    owner: hhc-web-api
    purpose: Audit recording lookup attempts without copying recipient identity or submitted codes.
    necessity: required
    storage: {kind: postgres, resource: hhc_web.cms_audit_event, sources: [{path: internal/postgres/recording_watermark.go, symbol: RecordingRepository.LookupRecordingWatermark}]}
    subject_keys: [{kind: user_id, field: actor, evidence: [{path: internal/postgres/recording_watermark.go, symbol: RecordingRepository.LookupRecordingWatermark}]}]
    data_classes: [identity, activity, security]
    fields:
      - {name: id, purpose: Identify the audit event., necessity: required, data_classes: [security]}
      - {name: action, purpose: Select recording_watermark.lookup only., necessity: required, data_classes: [security]}
      - {name: resource_type, purpose: Identify the recording resource category., necessity: required, data_classes: [activity]}
      - {name: resource_id, purpose: Bind recording UUID or an unrelated UUID for malformed input., necessity: required, data_classes: [activity]}
      - {name: actor, purpose: Identify the investigator rather than the recipient., necessity: required, data_classes: [identity]}
      - {name: payload_json, purpose: Retain only an enumerated lookup result., necessity: required, data_classes: [security]}
      - {name: created_at, purpose: Bound audit retention., necessity: required, data_classes: [activity]}
    attribution: {mode: direct, explanation: Actor identifies the investigator only. No code or recipient UUID is copied. Actor audit export follows existing manual review.}
    legal_basis: {status: pending_legal, reference: null}
    retention: {status: enforced, rule: {trigger: age_since, field: created_at, source: {path: internal/postgres/bulletin_watermark.go, symbol: Repository.PurgeWatermarkRecords}, duration_source: {path: internal/postgres/bulletin_watermark.go, symbol: Repository.PurgeWatermarkRecords}, predicate: "action = 'recording_watermark.lookup' AND created_at <= now - interval '8760 hours'", description: Local lookup audits are deleted after 365 times 24 hours or actor erasure. Central operator audits retain their own existing policy.}, action: delete}
    cleanup: {mode: existing_worker, implementation: [{path: internal/postgres/bulletin_watermark.go, symbol: Repository.PurgeWatermarkRecords}], evidence: [{kind: go_test, path: internal/postgres/recording_watermark_test.go, test_name: TestRecordingWatermarkInvalidLookupsConsumeBudget}]}
  - id: hhc-web.recording-watermark-rate
